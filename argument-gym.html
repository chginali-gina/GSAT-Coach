<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="description" content="論述練功房 3:00：高中生中英雙語口語論述訓練。8 種論述技巧、4 種講稿架構、選題快打、AI 找正反資料、3 分鐘講稿與計時試講。">
<meta property="og:title" content="論述練功房 3:00 | Argument Gym">
<meta property="og:description" content="學技巧、寫講稿、計時講 3 分鐘。Gina教室的AI奇蹟">
<title>三分鐘論述練功房</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: 手機 App 式——上方標題列、一次一個步驟頁、底部 6 格分頁；淺藍清新單一風格 */
:root{--bg:#F5F9FD;--bg-2:#EAF3FB;--card:#FFFFFF;--accent:#2F86D6;--accent-deep:#1F6FB8;--accent-ink:#155A96;--tint:#DCEBFA;--second:#0E9A9A;--second-tint:#D7F2F0;--ink:#17324D;--ink-soft:#557089;--line:#D3E2EF;--on-accent:#FFFFFF;--shadow:0 6px 22px rgba(31,111,184,.10);--btn-shadow:none;--good:#3F7A3A;--good-tint:#E3EFDD;--bad:#A63D2A;--bad-tint:#F8E1DA;--f-display:'Nunito','Noto Sans TC','PingFang TC',sans-serif;--f-body:'Nunito','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;--f-num:'Nunito',system-ui,sans-serif;--hw:800;--radius:16px;--bw:1px}
body[data-skin="sky"]{--bg:#F5F9FD;--bg-2:#EAF3FB;--card:#FFFFFF;--accent:#2F86D6;--accent-deep:#1F6FB8;--accent-ink:#155A96;--tint:#DCEBFA;--second:#0E9A9A;--second-tint:#D7F2F0;--ink:#17324D;--ink-soft:#557089;--line:#D3E2EF;--on-accent:#FFFFFF;--shadow:0 6px 22px rgba(31,111,184,.10);--btn-shadow:none;--good:#3F7A3A;--good-tint:#E3EFDD;--bad:#A63D2A;--bad-tint:#F8E1DA;--f-display:'Nunito','Noto Sans TC','PingFang TC',sans-serif;--f-body:'Nunito','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;--f-num:'Nunito',system-ui,sans-serif;--hw:800;--radius:16px;--bw:1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}
:root:not([data-theme="light"]) body[data-skin="sky"]{--bg:#0F1A26;--bg-2:#132233;--card:#182A3D;--accent:#6CB4F0;--accent-deep:#4A9BE0;--accent-ink:#A6D2F8;--tint:#1C3550;--second:#4FD1C5;--second-tint:#173A3A;--ink:#E6EFF8;--ink-soft:#9FB3C8;--line:#26394D;--on-accent:#0F1A26;--shadow:0 6px 22px rgba(0,0,0,.35);--btn-shadow:none;--good:#8CC983;--good-tint:#22321F;--bad:#F09A84;--bad-tint:#3B231C}}
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="dark"] body[data-skin="sky"]{--bg:#0F1A26;--bg-2:#132233;--card:#182A3D;--accent:#6CB4F0;--accent-deep:#4A9BE0;--accent-ink:#A6D2F8;--tint:#1C3550;--second:#4FD1C5;--second-tint:#173A3A;--ink:#E6EFF8;--ink-soft:#9FB3C8;--line:#26394D;--on-accent:#0F1A26;--shadow:0 6px 22px rgba(0,0,0,.35);--btn-shadow:none;--good:#8CC983;--good-tint:#22321F;--bad:#F09A84;--bad-tint:#3B231C}
:root{--f-ui:system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;--bar-h:64px}
*{box-sizing:border-box}
html{font-size:106.25%}
html[data-size="lg"]{font-size:118.75%}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.8;-webkit-text-size-adjust:100%;
  --c1:var(--accent);--c2:var(--second);--c3:var(--accent-deep);--c4:color-mix(in srgb,var(--second) 55%,var(--ink-soft));--c5:var(--ink-soft);--c6:color-mix(in srgb,var(--accent) 50%,var(--second))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;line-height:1.35;margin:0;font-family:var(--f-display)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* bilingual */
.en{display:block;font-size:.86em;line-height:1.6;color:var(--ink-soft);margin-top:2px}
.en.in{display:inline;margin:0 0 0 .45em;font-size:.82em}
.btn .en,.on .en,.tabbar .en{color:inherit;opacity:.82}
h2 .en,h3 .en{font-weight:600}

/* app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:var(--bw) solid var(--line)}
.appbar .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
.brand{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.brand b{font-family:var(--f-display);font-weight:var(--hw);font-size:1.12rem}
.brand .num{font-family:var(--f-num);color:var(--accent);font-weight:700;font-variant-numeric:lining-nums}
.brand small{color:var(--ink-soft);font-size:.78rem;font-family:var(--f-ui)}
.iconbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:var(--bw) solid var(--line);background:var(--card);font-family:var(--f-ui);font-size:.88rem}

/* pages */
main{padding-bottom:calc(var(--bar-h) + 24px + env(safe-area-inset-bottom,0px))}
.page{padding-block:22px 12px}
.page-head{margin-bottom:18px}
.kicker{display:flex;align-items:center;gap:8px;font-family:var(--f-ui);font-size:.8rem;letter-spacing:.08em;color:var(--accent-ink);font-weight:600;text-transform:uppercase}
.kicker .n{font-family:var(--f-num);font-size:1.6rem;letter-spacing:0;color:var(--accent);font-variant-numeric:lining-nums}
.layer{font-size:.72rem;letter-spacing:.04em;text-transform:none;color:var(--second);background:var(--second-tint);padding:1px 8px;border-radius:999px}
.page-head h2{font-size:clamp(1.45rem,5.6vw,1.95rem);font-weight:var(--hw);margin-top:4px}
.page-head .get{color:var(--ink-soft);margin-top:8px;font-size:.96rem}
.pager{display:flex;gap:10px;margin-top:28px}
.pager .btn{flex:1;justify-content:center}

.card{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stack{display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--ink-soft);font-size:.92rem}
.chip{display:inline-block;font-family:var(--f-ui);font-size:.78rem;padding:2px 10px;border-radius:999px;background:var(--tint);color:var(--accent-ink);font-weight:600}

.btn{display:inline-flex;align-items:center;gap:6px;min-height:46px;background:var(--accent);color:var(--on-accent);border:var(--bw) solid var(--accent);font-weight:700;padding:8px 20px;border-radius:999px;font-family:var(--f-ui);font-size:.95rem;box-shadow:var(--btn-shadow);transition:transform .15s,background .2s;line-height:1.3;text-align:center}
.btn:hover{background:var(--accent-deep)}
.btn:active{transform:translate(1px,1px)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--card);color:var(--accent-ink);border-color:var(--accent);box-shadow:none}
.btn.ghost:hover{background:var(--tint)}
.btn.small{min-height:40px;padding:6px 14px;font-size:.86rem}
.btn.block{width:100%;justify-content:center}

/* intro */
.intro{background:var(--bg-2);border-radius:var(--radius);padding:18px 16px;margin-bottom:18px}
.intro p{font-size:.98rem}
.promise{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.promise div{border-top:2px solid var(--accent);padding-top:6px;min-width:0}
.promise b{display:block;font-family:var(--f-num);font-size:1.6rem;color:var(--accent-ink);font-variant-numeric:lining-nums;line-height:1.2}
.promise span{font-size:.8rem;color:var(--ink-soft);line-height:1.5;display:block}
.tip{display:flex;gap:10px;align-items:center;background:var(--second-tint);border-radius:12px;padding:10px 12px;margin-bottom:16px;font-size:.9rem}
.tip p{flex:1;min-width:0}

/* technique accordion */
.tech{background:var(--card);border:var(--bw) solid var(--line);border-radius:calc(var(--radius) - 4px);overflow:hidden}
.tech summary{list-style:none;padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer;min-height:56px}
.tech summary::-webkit-details-marker{display:none}
.tech .ti{font-family:var(--f-num);font-size:1.35rem;color:var(--accent);width:1.4em;flex:0 0 auto;font-variant-numeric:lining-nums;font-weight:700}
.tech .tn{flex:1;min-width:0;font-weight:700;font-size:1.04rem;line-height:1.45}
.tech .chev{transition:transform .2s;color:var(--ink-soft)}
.tech[open] .chev{transform:rotate(90deg)}
.tech .body{padding:0 14px 16px;display:grid;gap:12px}
.lbl{font-family:var(--f-ui);font-size:.76rem;letter-spacing:.06em;color:var(--second);font-weight:700;margin-bottom:2px}
.pattern{background:var(--tint);border-radius:10px;padding:10px 12px;color:var(--accent-ink)}
.vs{display:grid;gap:8px}
.vs div{border-radius:10px;padding:10px 12px;font-size:.95rem}
.vs .weak{background:var(--bad-tint)}
.vs .strong{background:var(--good-tint)}
.vs .weak .lbl{color:var(--bad)}
.vs .strong .lbl{color:var(--good)}
.risk{font-size:.9rem;color:var(--ink-soft);border-left:3px solid var(--line);padding-left:10px}

/* frameworks */
.fw h3{font-size:1.06rem;font-weight:var(--hw)}
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;margin-top:10px;font-family:var(--f-ui);font-size:.7rem}
.bar span{display:flex;align-items:center;justify-content:center;color:var(--on-accent);white-space:nowrap;overflow:hidden;min-width:0;font-variant-numeric:tabular-nums}
.fw .seq{margin-top:8px;font-size:.9rem}
.fw .when{margin-top:6px;font-size:.9rem;color:var(--ink-soft)}

/* observation */
.observe{border:1.5px dashed var(--second);border-radius:var(--radius);padding:16px;background:var(--card);margin-top:20px}
.observe h3{font-size:1.06rem;color:var(--second)}
.obs-item{margin-top:14px;padding-top:12px;border-top:var(--bw) solid var(--line);display:grid;gap:8px}
.pm{display:grid;gap:8px;font-size:.92rem}
.pm div{background:var(--bg-2);border-radius:10px;padding:8px 10px}
.observe .src{font-size:.8rem;color:var(--ink-soft);margin-top:12px;line-height:1.7}
.observe a{color:var(--second)}

/* quiz */
.quiz-q{font-size:1.04rem;margin:10px 0 12px}
.opts{display:grid;gap:8px}
.opts button{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;min-height:48px;font-size:.96rem}
.opts button.right{border-color:var(--good);background:var(--good-tint)}
.opts button.wrong{border-color:var(--bad);background:var(--bad-tint)}
.feedback{margin-top:12px;font-size:.94rem;white-space:pre-line}
.progress{font-family:var(--f-ui);font-size:.84rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}

/* topics */
.current{background:var(--card);border:2px solid var(--accent);border-radius:var(--radius);padding:14px;display:grid;gap:10px}
.current .q{font-weight:700;font-size:1.08rem;line-height:1.5}
.seg-ctl{display:flex;background:var(--bg-2);border-radius:999px;padding:4px;gap:4px}
.seg-ctl button,.seg-ctl label{flex:1;min-height:42px;border:none;background:transparent;border-radius:999px;font-family:var(--f-ui);font-size:.86rem;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.25;cursor:pointer;padding:2px 6px}
.seg-ctl input{position:absolute;opacity:0;pointer-events:none}
.seg-ctl .on,.seg-ctl label:has(input:checked){background:var(--accent);color:var(--on-accent);font-weight:700}
.seg-ctl label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:0 0 auto;min-height:40px;border:var(--bw) solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px;font-family:var(--f-ui);font-size:.86rem}
.cats button.on{background:var(--second);border-color:var(--second);color:var(--bg)}
.topics{display:grid;gap:8px}
.topics button{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-size:.96rem;line-height:1.5;min-height:52px}
.topics button small{display:block;font-family:var(--f-ui);font-size:.72rem;color:var(--second);letter-spacing:.04em;font-weight:700}
.topics button.on{border-color:var(--accent);background:var(--tint)}
.custom{display:flex;gap:8px}
.custom input{flex:1;min-width:0}
input[type=text],textarea{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;font-size:1rem}
input[type=text]:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{resize:vertical;line-height:1.75}
.mini-timer{font-family:var(--f-num);font-size:1.7rem;color:var(--accent-ink);font-variant-numeric:lining-nums tabular-nums;font-weight:700}

/* AI */
.ai-box{background:var(--card);border:var(--bw) solid var(--line);border-radius:calc(var(--radius) - 4px);padding:14px}
.ai-box h3{font-size:1rem;margin-bottom:6px}
.ai-box ul{margin:0;padding-left:1.2em}
.ai-box li + li{margin-top:8px}
.ai-box.pro h3{color:var(--good)}
.ai-box.con h3{color:var(--bad)}
.ai-box.vf h3{color:var(--second)}
.kw{display:flex;flex-wrap:wrap;gap:8px}
.kw a{display:inline-flex;align-items:center;gap:4px;min-height:36px;font-family:var(--f-ui);font-size:.86rem;text-decoration:none;color:var(--second);border:1.5px solid var(--second);border-radius:999px;padding:2px 12px}
.kw svg.i{width:15px;height:15px}
.status{font-family:var(--f-ui);font-size:.88rem;color:var(--ink-soft);margin-top:10px}
.status.err{color:var(--bad)}
.notice{background:var(--second-tint);border-radius:12px;padding:10px 12px;font-size:.9rem}
.stream{white-space:pre-wrap;line-height:1.8}
.fallback pre{white-space:pre-wrap;background:var(--bg-2);border-radius:10px;padding:10px;font-size:.8rem;max-height:200px;overflow:auto;font-family:var(--f-ui);margin:8px 0}

/* builder */
.fw-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.fw-tabs::-webkit-scrollbar{display:none}
.fw-tabs button{flex:0 0 auto;min-height:42px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px;font-family:var(--f-ui);font-size:.86rem;line-height:1.25}
.fw-tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{background:var(--card);border:var(--bw) solid var(--line);border-radius:calc(var(--radius) - 4px);padding:14px;border-left:5px solid var(--sc)}
.seg-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.seg-top label{font-weight:700;font-size:1.02rem}
.seg-time{font-family:var(--f-ui);font-size:.78rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.seg-time.over{color:var(--bad);font-weight:700}
.seg .hint{font-size:.88rem;color:var(--ink-soft);margin:4px 0 8px;line-height:1.6}
.seg .hint i{font-style:normal;color:var(--accent-ink)}
.meter{position:sticky;bottom:calc(var(--bar-h) + env(safe-area-inset-bottom,0px));z-index:5;background:var(--card);border:var(--bw) solid var(--line);border-radius:14px;padding:10px 14px;margin-top:14px;box-shadow:0 -6px 18px color-mix(in srgb,var(--ink) 10%,transparent)}
.meter .track{height:8px;border-radius:4px;background:var(--bg-2);overflow:hidden;margin-top:6px;position:relative}
.meter .fill{height:100%;width:0;transition:width .3s}
.meter .goal{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);left:calc(100% * 180 / 216)}
.meter .nums{display:flex;justify-content:space-between;font-family:var(--f-ui);font-size:.84rem;font-variant-numeric:tabular-nums;gap:8px;flex-wrap:wrap}
.example-flag{display:grid;gap:8px;background:var(--tint);border-radius:12px;padding:10px 12px;font-size:.9rem}

/* timer */
.stage{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--radius);padding:18px 16px;text-align:center;box-shadow:var(--shadow)}
.big-clock{font-family:var(--f-num);font-weight:700;font-size:clamp(3.6rem,19vw,5.5rem);line-height:1;color:var(--accent-ink);font-variant-numeric:lining-nums tabular-nums;margin:6px 0}
.big-clock.warn{color:var(--bad)}
.segbar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:12px 0 4px;position:relative}
.segbar span{opacity:.3}
.segbar span.past{opacity:1}
.segbar .needle{position:absolute;top:0;bottom:0;width:3px;background:var(--ink);left:0;transition:left .25s linear}
.now-seg{font-weight:700;font-size:1.08rem;margin-top:10px}
.prompter{text-align:left;background:var(--bg-2);border-radius:12px;padding:14px;margin-top:12px;font-size:1.12rem;line-height:1.9;max-height:42vh;overflow:auto;white-space:pre-wrap}
.stage .row{justify-content:center;margin-top:14px}
.rubric{display:grid;gap:8px;margin-top:12px}
.rubric label{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:var(--bw) solid var(--line);border-radius:12px;padding:12px;cursor:pointer;line-height:1.55;min-height:52px}
.rubric input{margin-top:3px;accent-color:var(--accent);width:22px;height:22px;flex:0 0 auto}
.score{font-family:var(--f-num);font-weight:700;font-size:1.8rem;color:var(--accent-ink);font-variant-numeric:lining-nums}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:var(--bw) solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.tabbar button{min-height:var(--bar-h);border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:var(--f-ui);font-size:.72rem;color:var(--ink-soft);line-height:1.2;padding:4px 2px;position:relative}
.tabbar button b{font-family:var(--f-num);font-size:1.12rem;font-variant-numeric:lining-nums;line-height:1.1}
.tabbar button .en{font-size:.62rem;margin:0}
.tabbar button[aria-current="step"]{color:var(--accent-ink);font-weight:700}
.tabbar button[aria-current="step"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

/* settings sheet */
.scrim{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--ink) 45%,transparent)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25)}

function showQ(){

}
function fullText(){ const fw = fwById(state.fw), d = draft(); return fw.segs.map(s => (d[s.k] || '').trim()).filter(Boolean).join('\n\n'); }
function labeledText(){ const fw = fwById(state.fw), d = draft(); return `${S('題目','Topic')}: ${topicS()}\n${S('立場','Position')}: ${S(stanceP()[0], stanceP()[1])}\n${S('架構','Structure')}: ${S(fw.name[0], fw.name[1])}\n\n` + fw.segs.map(s => `【${S(s.t[0], s.t[1])}】\n${(d[s.k] || '').trim() || '—'}`).join('\n\n'); }
function updateMeter(){
  const m = measure(fullText()); if (!$('#mCount')) return;
  const parts = []; if (m.cjk) parts.push(state.lang === 'en' ? `${m.cjk} chars` : `${m.cjk} 字`); if (m.words || !m.cjk) parts.push(`${m.words} words`);
  $('#mCount').textContent = parts.join(' · ');
  $('#mTime').textContent = S('預估 ', 'About ') + fmt(m.sec) + ' / 3:00';
  $('#mFill').style.width = Math.min(100, m.sec / 216 * 100) + '%';
  $('#mFill').style.background = m.sec > 200 ? 'var(--bad)' : m.sec >= 160 ? 'var(--good)' : 'var(--accent)';
}
let resetArm = false;
function resetFw(e){
  const b = $('#resetDraft');
  if (!resetArm){ resetArm = true; b.textContent = ''; b.append(Li(UI.sure)); setTimeout(() => { resetArm = false; const x = $('#resetDraft'); if (x){ x.textContent = ''; x.append(Li(UI.resetFw)); } }, 3000); return; }
  resetArm = false; state.drafts[state.fw] = {}; if (state.fw === 'prep') state.sampleOn = false; save(); renderBuild(); renderSpeak();
}
function bstat(p, err){ const s = $('#buildStatus'); if (s){ s.className = 'status' + (err ? ' err' : ''); s.textContent = S(p[0], p[1]); } }
async function copyDraft(){ try { await navigator.clipboard.writeText(labeledText()); bstat(UI.copiedDraft); } catch(e){ bstat(UI.copyFail); } }
async function saveDraft(){
  try { await downloads.save({filename:`3min-speech-${(state.topic.en || 'draft').replace(/[^A-Za-z0-9]+/g,'-').slice(0,40)}.txt`, data:labeledText()}); bstat(UI.dlOk); }
  catch(e){ bstat(e && e.code === 'declined' ? UI.dlNo : UI.dlFail); }
}
function feedbackPrompt(){
  const ln = state.lang === 'en' ? 'Reply in clear English (CEFR B1–B2).' : state.lang === 'bi' ? '用繁體中文回饋；「原句 → 改寫」的部分若講稿是英文就用英文改寫，並在每一大點後附一句簡短英文摘要。' : '全部用繁體中文。';
  return `你是溫暖但直接的高中口語表達教練。以下是學生的 3 分鐘口頭論述講稿（中文口說約每分鐘 200 字，英文約 130 字）。

${labeledText()}

請用純文字（不要用 Markdown 符號）依序寫：
一、做得好的 2 點（具體指出哪一句）
二、最需要改的 3 點：每點寫「原句 → 改寫後的句子」，並說明為什麼
三、這篇用到了哪些論述技巧（從這 8 種中判斷：結論先行、議題轉化、條件式回答、借力使力、故事加數據、重新定義、類比與幽默、預先回應反方），還可以加哪一種
四、時間估計：目前大約幾分幾秒，太長或太短該刪或補哪一段
五、提醒：講稿中哪些數字或事實需要學生自己去查證出處
語氣鼓勵，整體 450 字以內。${ln}`;
}
function crossPrompt(){
  const ln = state.lang === 'en' ? 'Write in clear English (CEFR B1–B2).' : state.lang === 'bi' ? '每一行都用「繁體中文 / English」雙語。' : '用繁體中文。';
  return `你扮演公平但犀利的反方辯士，對象是高中生。以下是學生的講稿：

${labeledText()}

請用純文字提出 3 個最能挑戰這篇講稿的追問。每題格式：
追問 1：（一句話的問題）
為什麼這題難：（一句）
回答提示：（一句，提示可以用哪種技巧回應，不要直接給答案）
最後加一句鼓勵。不要攻擊學生本人。${ln}`;
}
async function streamAI(title, prompt){
  const m = measure(fullText());
  if (m.cjk < 40 && m.words < 25){ bstat(UI.need40); return; }
  const box = $('#fbBox'), tx = $('#fbText'), tt = $('#fbTitle');
  box.hidden = false; tt.textContent = ''; tt.append(Li(title)); box.querySelectorAll('.stream + .btn').forEach(b => b.remove());
  if (!sample){ bstat(UI.promptShown); tx.textContent = prompt;
    const cb = el('button', {type:'button', class:'btn small', style:'margin-top:10px'}, Li(UI.copyPrompt));
    cb.addEventListener('click', async () => { try { await navigator.clipboard.writeText(prompt); cb.textContent = ''; cb.append(Li(UI.copied)); } catch(e){ const r = document.createRange(); r.selectNodeContents(tx); const g = getSelection(); g.removeAllRanges(); g.addRange(r); cb.textContent = ''; cb.append(Li(UI.selected)); } });
    tx.after(cb); return; }
  fbCtl = new AbortController();
  tx.textContent = S('AI 思考中……','AI is thinking…'); $('#fbStop').hidden = false;
  $('#aiFeedback').disabled = true; $('#aiCross').disabled = true; $('#buildStatus').textContent = '';
  try {
    const r = await sample(prompt, {signal: fbCtl.signal, cache:false, onText: ({text}) => { const t = $('#fbText'); if (t) t.textContent = text; }});
    if (r.truncated) bstat(UI.truncated);
  } catch(e){
    if (e && e.code !== 'cancelled'){ const s = $('#buildStatus'); if (s){ s.className = 'status err'; s.textContent = aiErr(e.code); } if (HIDE.includes(e.code)) sample = null; }
    const t = $('#fbText'); if (t && e && e.text) t.textContent = e.text;
  } finally { ['#aiFeedback','#aiCross'].forEach(s => { const b = $(s); if (b) b.disabled = false; }); const b = $('#fbStop'); if (b) b.hidden = true; }
}

/* ---------- page 6 ---------- */
let tElapsed = 0, tRun = null, tLast = 0, wake = null, tMsg = null;
const segIndex = (fw, t) => { let acc = 0; for (let i = 0; i < fw.segs.length; i++){ acc += fw.segs[i].s; if (t < acc) return i; } return fw.segs.length - 1; };
function renderSpeak(){
  const sec = $('#speak'); sec.textContent = '';
  const w = el('div', {class:'wrap'}); w.append(pageHead(5));
  const fw = fwById(state.fw);
  const bar = el('div', {class:'segbar', id:'segbar'});
  fw.segs.forEach((s, i) => bar.append(el('span', {style:`flex:${s.s};background:${SC[i]}`})));
  bar.append(el('div', {class:'needle', id:'needle'}));
  w.append(el('div', {class:'stage'},
    el('p', {class:'muted'}, Li(UI.fwLbl), '：', Li(fw.name)),
    el('div', {class:'big-clock', id:'bigClock', role:'timer'}),
    bar,
    el('p', {class:'now-seg', id:'nowSeg', 'aria-live':'polite'}),
    el('div', {class:'prompter', id:'prompter'}),
    el('div', {class:'row'},
      el('button', {type:'button', class:'btn', id:'tStart', onclick:startOrFinish}, Li(tRun || tElapsed > 0 ? UI.finish : UI.start)),
      el('button', {type:'button', class:'btn ghost', id:'tPause', hidden: (tElapsed > 0 || tRun) ? null : '', onclick:pauseResume}, Li(tRun ? UI.pause : UI.resume)),
      el('button', {type:'button', class:'btn ghost', onclick:resetT}, Li(UI.reset))),
    el('p', {class:'muted', id:'tResult', style:'margin-top:10px'}, tMsg ? Lp(tMsg) : null)));
  const rub = el('div', {class:'rubric'});
  RUBRIC.forEach((r, i) => {
    const inp = el('input', {type:'checkbox', id:'rb'+i});
    inp.checked = !!state.rubric[i];
    inp.addEventListener('change', () => { state.rubric[i] = inp.checked; save(); scoreR(); });
    rub.append(el('label', {for:'rb'+i}, inp, el('span', null, Lp(r))));
  });
  w.append(el('div', {class:'card', style:'margin-top:16px'},
    el('div', {class:'row', style:'justify-content:space-between'}, el('h3', {style:'font-size:1.06rem'}, Lp(UI.rubricT)), el('span', {class:'score', id:'score'})),
    rub, el('p', {class:'muted', id:'rubricTip', style:'margin-top:10px'})));
  w.append(pager(5));
  sec.append(w);
  tick(); scoreR();
}
function tick(){
  const fw = fwById(state.fw), left = 180 - tElapsed, c = $('#bigClock'); if (!c) return;
  c.textContent = left >= 0 ? fmt(Math.ceil(left)) : '+' + fmt(-left);
  c.classList.toggle('warn', left <= 15);
  $('#needle').style.left = `calc(${Math.min(100, tElapsed / 180 * 100)}% - 1px)`;
  const i = segIndex(fw, tElapsed), active = tRun || tElapsed > 0;
  [...$('#segbar').querySelectorAll('span')].forEach((s, j) => s.classList.toggle('past', active && j <= i));
  const ns = $('#nowSeg'); ns.textContent = '';
  ns.append(!active ? Li(UI.ready) : left >= 0 ? Li([UI.now[0] + fw.segs[i].t[0], UI.now[1] + fw.segs[i].t[1]]) : Li(UI.over));
  const txt = (draft()[fw.segs[i].k] || '').trim();
  const p = $('#prompter'); if (p.dataset.k !== fw.segs[i].k + txt.length){ p.dataset.k = fw.segs[i].k + txt.length; p.textContent = txt || S(`「${fw.segs[i].t[0]}」${UI.notWritten[0]}`, `“${fw.segs[i].t[1]}” ${UI.notWritten[1]}`); }
}
function startT(){
  tLast = performance.now();
  tRun = setInterval(() => { const n = performance.now(); tElapsed += (n - tLast) / 1000; tLast = n; tick(); }, 250);
  try { navigator.wakeLock && navigator.wakeLock.request('screen').then(w => { wake = w; }).catch(() => {}); } catch(e){}
}
function stopT(){ clearInterval(tRun); tRun = null; try { wake && wake.release(); } catch(e){} wake = null; }
function startOrFinish(){
  if (!tRun && tElapsed === 0){ tMsg = null; startT(); renderSpeak(); return; }
  stopT();
  const t = tElapsed, ok = t >= 165 && t <= 195;
  tMsg = [`這次講了 ${fmt(t)}。` + (ok ? '時間掌握得很好！' : t < 165 ? '偏短，可以在例證段多加一個具體例子。' : '偏長，試著刪掉重複的句子。'),
          `You spoke for ${fmt(t)}. ` + (ok ? 'Great timing!' : t < 165 ? 'A bit short. Add one more concrete example.' : 'A bit long. Cut repeated sentences.')];
  state.rubric[4] = ok; save(); tElapsed = 0; renderSpeak();
}
function pauseResume(){ if (tRun) stopT(); else startT(); const b = $('#tPause'); b.textContent = ''; b.append(Li(tRun ? UI.pause : UI.resume)); }
function resetT(){ stopT(); tElapsed = 0; tMsg = null; renderSpeak(); }
function scoreR(){
  const n = state.rubric.filter(Boolean).length; const s = $('#score'); if (!s) return;
  s.textContent = `${n} / 6`;
  const tip = $('#rubricTip'); tip.textContent = ''; tip.append(Lp(n === 6 ? UI.rt6 : n >= 4 ? UI.rt4 : UI.rt0));
}

/* ---------- shell: brand, tab bar, settings ---------- */
function renderShell(){
  document.documentElement.lang = state.lang === 'en' ? 'en' : 'zh-Hant';
  document.documentElement.dataset.size = state.size;
  document.body.dataset.skin = 'sky';
  const b = $('#brand'); b.textContent = '';
  b.append(el('b', {text: state.lang === 'en' ? UI.brand[1] : UI.brand[0]}), el('span', {class:'num', text:'3:00'}));
  if (state.lang === 'bi') b.append(el('small', {text:UI.brand[1]}));
  const sl = $('#settingsLbl'); sl.textContent = state.lang === 'en' ? UI.settings[1] : UI.settings[0];
  const tb = $('#tabbar'); tb.textContent = '';
  STEPS.forEach((s, i) => tb.append(el('button', {type:'button', 'aria-current': i === state.step ? 'step' : null, onclick:() => go(i)},
    el('b', {text:String(i+1)}), el('span', {text: state.lang === 'en' ? s.n[1] : s.n[0]}), state.lang === 'bi' ? el('span', {class:'en', text:s.n[1]}) : null)));
}
function renderAll(){ renderShell(); renderLearn(); renderExamples(); renderTopics(); renderAI(); renderBuild(); renderSpeak(); showStep(); }
function showStep(){ STEPS.forEach((s, i) => { $('#' + s.id).hidden = i !== state.step; }); }
function go(i){
  state.step = i; save(); showStep(); renderShell();
  if (i === 3) renderAI(); if (i === 4) renderBuild(); if (i === 5) renderSpeak();
  window.scrollTo(0, 0);
}

function openSheet(){
  const inr = $('#sheetIn'); inr.textContent = '';
  inr.append(el('div', {class:'sheet-top'}, el('h3', {id:'sheetTitle'}, Li(UI.settings)), el('button', {type:'button', class:'btn small', onclick:closeSheet}, Li(UI.close))));
  const lang = el('div', {class:'seg-ctl'});
  [['zh', UI.zhOnly], ['bi', UI.bi], ['en', UI.enOnly]].forEach(([v, p]) => lang.append(el('button', {type:'button', class: state.lang === v ? 'on' : '', 'aria-pressed':String(state.lang === v), onclick:() => { state.lang = v; if (state.sampleOn) loadSample(); save(); renderAll(); openSheet(); }, text: v === 'zh' ? '中文' : v === 'en' ? 'English' : '雙語 Bilingual'})));
  inr.append(el('div', null, el('h4', null, Li(UI.lang)), lang));
  const size = el('div', {class:'seg-ctl'});
  [['md', UI.sizeMd], ['lg', UI.sizeLg]].forEach(([v, p]) => size.append(el('button', {type:'button', class: state.size === v ? 'on' : '', 'aria-pressed':String(state.size === v), onclick:() => { state.size = v; save(); renderShell(); openSheet(); }}, Li(p))));
  inr.append(el('div', null, el('h4', null, Li(UI.size)), size));
  $('#scrim').hidden = false; $('#sheet').hidden = false;
  const first = inr.querySelector('.seg-ctl .on') || inr.querySelector('button'); first && first.focus();
}
function closeSheet(){ $('#scrim').hidden = true; $('#sheet').hidden = true; $('#openSettings').focus(); }
$('#openSettings').addEventListener('click', openSheet);
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

/* ---------- capabilities ---------- */
if (window.claude && typeof window.claude.use === 'function'){
  window.claude.use('sample').then(s => { sample = s; }).catch(() => {});
  window.claude.use('downloads').then(d => { downloads = d; if (d && state.step === 4) renderBuild(); }).catch(() => {});
}

/* ---------- init ---------- */
const h = (location.hash || '').slice(1);
const hi = STEPS.findIndex(s => s.id === h);
if (hi >= 0) state.step = hi;
if (!(state.step >= 0 && state.step < 6)) state.step = 0;
if (!state.topic || typeof state.topic !== 'object') state.topic = {zh:'用 AI 寫作業算不算作弊？', en:'Is using AI for homework cheating?'};
if (!state.visited){ state.visited = true; state.fw = 'prep'; loadSample(); }
renderAll();
})();
</script>
