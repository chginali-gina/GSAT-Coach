<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Body Reader Academy｜讀心探員特訓營 L7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F9FD; --bg-2:#EAF3FB; --card:#FFFFFF;
  --accent:#2F86D6; --accent-deep:#1F6FB8; --accent-ink:#155A96; --tint:#DCEBFA;
  --second:#0E9A9A; --second-tint:#D7F2F0;
  --ink:#17324D; --ink-soft:#557089; --line:#D3E2EF; --on-accent:#FFFFFF;
  --good:#3F7A3A; --good-tint:#E3EFDD; --bad:#A63D2A; --bad-tint:#F8E1DA;
  --sun:#F4B740; --sun-tint:#FFF3D6; --grape:#7C6CE0; --grape-tint:#ECE9FC;
  --shadow:0 6px 22px rgba(31,111,184,.10);
  --radius:16px;
  --c1:#2F86D6; --c2:#0E9A9A; --c3:#7C6CE0; --c4:#E8912D; --c5:#1F6FB8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0F1A26; --bg-2:#132233; --card:#182A3D;
  --accent:#6CB4F0; --accent-deep:#4A9BE0; --accent-ink:#A6D2F8; --tint:#1C3550;
  --second:#4FD1C5; --second-tint:#173A3A;
  --ink:#E6EFF8; --ink-soft:#9FB3C8; --line:#26394D; --on-accent:#0F1A26;
  --good:#8CC983; --good-tint:#22321F; --bad:#F09A84; --bad-tint:#3B231C;
  --sun:#F6C765; --sun-tint:#3A3120; --grape:#A99DF2; --grape-tint:#2A2645;
  --shadow:0 6px 22px rgba(0,0,0,.35);
  --c1:#6CB4F0; --c2:#4FD1C5; --c3:#A99DF2; --c4:#F2B062; --c5:#8EC5F5;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1A26; --bg-2:#132233; --card:#182A3D;
  --accent:#6CB4F0; --accent-deep:#4A9BE0; --accent-ink:#A6D2F8; --tint:#1C3550;
  --second:#4FD1C5; --second-tint:#173A3A;
  --ink:#E6EFF8; --ink-soft:#9FB3C8; --line:#26394D; --on-accent:#0F1A26;
  --good:#8CC983; --good-tint:#22321F; --bad:#F09A84; --bad-tint:#3B231C;
  --sun:#F6C765; --sun-tint:#3A3120; --grape:#A99DF2; --grape-tint:#2A2645;
  --shadow:0 6px 22px rgba(0,0,0,.35);
  --c1:#6CB4F0; --c2:#4FD1C5; --c3:#A99DF2; --c4:#F2B062; --c5:#8EC5F5;
}
*{box-sizing:border-box}
html{font-size:106.25%;-webkit-text-size-adjust:100%}
html.big{font-size:118.75%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;line-height:1.8}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--card);z-index:60}
button{font:inherit;color:inherit}
h1,h2,h3{font-weight:800;text-wrap:balance;line-height:1.35;margin:0}
.num{font-variant-numeric:lining-nums tabular-nums}
.en{display:block;font-size:.86em;line-height:1.6;color:var(--ink-soft);margin-top:2px}
.en.in{display:inline;margin-left:.45em;font-size:.82em}
.btn .en,.on .en,.tab.on .en{color:inherit;opacity:.82}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--second));display:grid;place-items:center;color:#fff;flex:none}
.logo svg.i{width:22px;height:22px}
.brand{flex:1;min-width:0;line-height:1.25}
.brand b{display:block;font-size:1rem;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--ink-soft);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;font-size:.85rem}
.pill.badge{background:var(--sun-tint);border-color:transparent;color:var(--ink)}
.pill.badge svg.i{color:var(--sun)}

main{max-width:760px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin:14px 0}
.hero{position:relative;overflow:hidden;background:linear-gradient(150deg,var(--tint),var(--second-tint));border:none}
.hero .blob{position:absolute;border-radius:50%;opacity:.55}
.hero .b1{width:150px;height:150px;background:var(--sun-tint);right:-40px;top:-50px}
.hero .b2{width:90px;height:90px;background:var(--grape-tint);right:60px;bottom:-40px}
.hero > *{position:relative}
.kicker{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:800;letter-spacing:.04em;color:var(--accent-ink);background:var(--card);padding:3px 10px;border-radius:999px}
.hero h1{font-size:clamp(1.45rem,5.6vw,1.95rem);margin:10px 0 6px}
.lead{color:var(--ink-soft);margin:6px 0 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 20px;border-radius:999px;border:none;background:var(--accent);color:var(--on-accent);font-weight:800;cursor:pointer;text-align:center;line-height:1.3}
.btn:hover{background:var(--accent-deep)}
.btn.ghost{background:var(--card);color:var(--accent-ink);border:1.5px solid var(--accent)}
.btn.ghost:hover{background:var(--tint)}
.btn.soft{background:var(--second-tint);color:var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1}

/* steps intro */
.steps3{display:grid;gap:10px;margin-top:6px}
.s3{display:flex;gap:12px;align-items:flex-start}
.s3 .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;flex:none}

/* form */
.field{display:grid;gap:6px;margin:10px 0}
.field label{font-weight:700;font-size:.92rem}
.field input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
.field input:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--card)}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3 .wide{grid-column:1/-1}

/* station map */
.map{display:grid;gap:10px}
.st{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;text-align:left;width:100%;min-height:68px}
.st:hover{border-color:var(--accent)}
.st .dot{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:1.15rem;flex:none}
.st .t{flex:1;line-height:1.35}
.st .t b{display:block}
.st .t small{color:var(--ink-soft)}
.st.locked{opacity:.55;cursor:not-allowed}
.st .stat{font-size:.78rem;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.stat.done{background:var(--good-tint);color:var(--good)}
.stat.now{background:var(--sun-tint);color:var(--ink)}
.stat.lock{background:var(--bg-2);color:var(--ink-soft)}

/* station header */
.sh{display:flex;gap:14px;align-items:center;margin:4px 0 8px}
.bignum{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;color:#fff;font-size:2rem;font-weight:900;flex:none;box-shadow:var(--shadow)}
.sh small{display:block;color:var(--ink-soft);font-weight:700}
.tag{display:inline-block;font-size:.75rem;font-weight:800;background:var(--second-tint);color:var(--second);padding:2px 9px;border-radius:999px;margin-left:6px;vertical-align:middle}
.sh h2{font-size:clamp(1.3rem,5vw,1.7rem)}
.get{display:flex;gap:8px;align-items:flex-start;background:var(--sun-tint);border-radius:12px;padding:10px 12px;margin:10px 0 0;font-weight:600}
.get svg.i{color:var(--c4);margin-top:4px}

/* passage */
details.psg{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin:14px 0;overflow:hidden}
details.psg summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 16px;min-height:52px;font-weight:800}
details.psg summary::-webkit-details-marker{display:none}
details.psg summary .ar{margin-left:auto;transition:transform .2s}
details.psg[open] summary .ar{transform:rotate(90deg)}
.psg-body{padding:0 16px 14px;border-top:1px dashed var(--line)}
.psg-body p{margin:12px 0;font-size:.98rem}
.psg-body .pn{display:inline-block;font-weight:900;color:var(--accent-ink);background:var(--tint);border-radius:8px;padding:0 7px;margin-right:6px;font-size:.8rem}

/* questions */
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:14px 0;box-shadow:var(--shadow)}
.q.ok{border-color:var(--good)}
.qh{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.qn{background:var(--tint);color:var(--accent-ink);border-radius:10px;font-weight:900;padding:2px 9px;flex:none;font-size:.9rem}
.qt{font-weight:700;line-height:1.6}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;min-height:52px;padding:11px 13px;border-radius:13px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--tint)}
.opt .k{font-weight:900;color:var(--accent-ink);flex:none;width:26px}
.opt.sel{border-color:var(--accent);background:var(--tint)}
.opt.good{border-color:var(--good);background:var(--good-tint)}
.opt.bad{border-color:var(--bad);background:var(--bad-tint);opacity:.85}
.opt.out{opacity:.35;text-decoration:line-through}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:.95rem}
.fb.good{background:var(--good-tint);color:var(--ink);border-left:5px solid var(--good)}
.fb.bad{background:var(--bad-tint);color:var(--ink);border-left:5px solid var(--bad)}
.fb b{display:inline-flex;align-items:center;gap:6px}
.fb.good b{color:var(--good)} .fb.bad b{color:var(--bad)}

/* hints */
.hintbar{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.hbtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px dashed var(--c4);background:transparent;color:var(--ink);cursor:pointer;font-weight:700;font-size:.88rem}
.hbtn:disabled{opacity:.45;cursor:default}
.hbtn svg.i{color:var(--c4)}
.hdots{display:inline-flex;gap:4px}
.hdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.hdots i.on{background:var(--c4)}
.hint{background:var(--sun-tint);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.93rem}
.hint .lv{font-weight:900;color:var(--c4);font-size:.78rem;display:block}
.quote{display:block;margin-top:6px;padding:8px 10px;background:var(--card);border-radius:10px;font-style:italic;border-left:4px solid var(--c4)}

/* station 1 */
.note{background:repeating-linear-gradient(var(--card),var(--card) 37px,var(--line) 38px);border-radius:var(--radius);border:1px solid var(--line);padding:16px 16px 6px;box-shadow:var(--shadow)}
.note .sent{margin:0 0 14px;line-height:2.1}
.note .sn{font-weight:900;color:var(--c1);margin-right:4px}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:110px;min-height:38px;padding:0 10px;margin:0 2px;border-radius:10px;border:2px dashed var(--accent);background:var(--tint);color:var(--accent-ink);font-weight:800;cursor:pointer;vertical-align:middle}
.blank.act{border-style:solid;box-shadow:0 0 0 4px rgba(244,183,64,.45)}
.blank.filled{border-style:solid;background:var(--card)}
.blank.right{border-color:var(--good);background:var(--good-tint);color:var(--good);cursor:default}
.bank{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 -4px 20px rgba(31,111,184,.12);padding:12px;margin:14px 0}
.bank small{display:block;color:var(--ink-soft);font-weight:700;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-weight:800}
.chip:hover:not(:disabled){border-color:var(--accent)}
.chip:disabled{opacity:.3;cursor:default}

/* station 3 */
.cards{display:grid;gap:8px}
.bc{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:54px;padding:10px 12px;border-radius:13px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;line-height:1.45}
.bc.sel{border-color:var(--sun);box-shadow:0 0 0 3px rgba(244,183,64,.4);background:var(--card)}
.bc .lab{margin-left:auto;font-size:.75rem;font-weight:900;padding:3px 9px;border-radius:999px;white-space:nowrap}
.lab.lie{background:var(--bad-tint);color:var(--bad)}
.lab.love{background:var(--grape-tint);color:var(--grape)}
.lab.none{background:var(--bg-2);color:var(--ink-soft)}
.lab.empty{border:1.5px dashed var(--line);color:var(--ink-soft)}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--card);padding:10px;border-radius:var(--radius);border:1px solid var(--line);box-shadow:0 -4px 20px rgba(31,111,184,.12);margin-top:12px}
.bin{min-height:64px;border-radius:14px;border:none;cursor:pointer;font-weight:800;line-height:1.3;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.bin svg.i{width:22px;height:22px}
.bin.lie{background:var(--bad-tint);color:var(--bad)}
.bin.love{background:var(--grape-tint);color:var(--grape)}
.bin.none{background:var(--bg-2);color:var(--ink-soft)}
.bin:disabled{opacity:.5;cursor:default}
.bin .cnt{font-size:.72rem;opacity:.85}

/* station 4 */
.sus{display:grid;gap:10px}
.sus .p{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border-radius:14px;padding:12px}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;flex:none}
.sus .p b{display:block}
.sus .p small{color:var(--ink-soft);font-weight:700}
.sus .p p{margin:4px 0 0;font-size:.96rem}

/* nav */
.nav2{display:flex;gap:10px;margin:22px 0 4px}
.nav2 .en{display:none}
.nav2 .btn{flex:1}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
.tab{position:relative;height:64px;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink-soft);font-weight:800;font-size:.72rem;line-height:1.15;padding:0 2px}
.tab .tn{font-size:1.05rem;font-weight:900;display:flex;align-items:center;justify-content:center;height:24px}
.tab .tn svg.i{width:18px;height:18px}
.tab.on{color:var(--accent)}
.tab.on::before{content:"";position:absolute;top:0;left:18%;right:18%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab.done .tn{color:var(--good)}
.tab:disabled{opacity:.4;cursor:not-allowed}
.tab .en{font-size:.62rem;margin:0}

/* sheet & modal */
.mask{position:fixed;inset:0;background:rgba(15,26,38,.45);z-index:80;display:none}
.mask.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--card);border-radius:22px 22px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto;transform:translateY(105%);transition:transform .25s}
.sheet.show{transform:none}
.sheet h3{margin-bottom:10px}
.seg{display:flex;background:var(--bg-2);border-radius:999px;padding:4px;gap:4px;margin:6px 0 14px}
.seg button{flex:1;min-height:42px;border:none;border-radius:999px;background:transparent;cursor:pointer;font-weight:800;font-size:.9rem}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;z-index:95;width:min(92vw,420px);background:var(--card);border-radius:24px;padding:26px 20px 20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25);transition:all .25s}
.modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.medal{width:96px;height:96px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 0 0 8px var(--sun-tint);animation:pop .6s ease}
.medal svg.i{width:46px;height:46px}
@keyframes pop{0%{transform:scale(.3) rotate(-20deg)}70%{transform:scale(1.12) rotate(6deg)}100%{transform:scale(1)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:96;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:3px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.7}}
@media (prefers-reduced-motion:reduce){.medal,.confetti i{animation:none}.sheet,.modal{transition:none}}

/* certificate */
.cert{text-align:center;background:linear-gradient(160deg,var(--sun-tint),var(--tint));border:none}
.cert h1{font-size:clamp(1.4rem,5.5vw,1.9rem);margin:6px 0}
.badges{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px 0}
.bdg{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff}
.bdg.off{background:var(--line)!important;color:var(--ink-soft)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.stat-box{background:var(--card);border-radius:14px;padding:10px}
.stat-box b{display:block;font-size:1.5rem;font-weight:900;color:var(--accent-ink)}
.stat-box small{color:var(--ink-soft);font-weight:700}
.rank{display:inline-block;font-weight:900;padding:4px 14px;border-radius:999px;background:var(--card);color:var(--c4);margin-top:4px}
.miss{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.miss li{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:.93rem}
.miss li small{display:block;color:var(--ink-soft);font-weight:700}
.sync{display:flex;text-align:left;align-items:center;gap:8px;font-size:.88rem;font-weight:700;padding:10px 12px;border-radius:12px;margin-top:10px}
.sync.ok{background:var(--good-tint);color:var(--good)}
.sync.wait{background:var(--sun-tint);color:var(--ink)}
.sync.off{background:var(--bg-2);color:var(--ink-soft)}
.tip{background:var(--second-tint);border-radius:14px;padding:12px 14px;margin:14px 0;display:flex;gap:10px;align-items:flex-start}
.tip svg.i{color:var(--second);margin-top:4px}

/* scenes */
.scene{display:block;width:100%;height:auto;border-radius:var(--radius)}
.sv-sky{fill:var(--tint)}.sv-sky2{fill:var(--second-tint)}.sv-ground{fill:var(--good-tint)}.sv-card{fill:var(--card)}
.sv-ink{fill:var(--ink)}.sv-soft{fill:var(--ink-soft)}.sv-a{fill:var(--accent)}.sv-b{fill:var(--second)}.sv-c{fill:var(--grape)}
.sv-d{fill:var(--c4)}.sv-sun{fill:var(--sun)}.sv-sunt{fill:var(--sun-tint)}.sv-bad{fill:var(--bad)}.sv-badt{fill:var(--bad-tint)}

const LEVELS=[['見習生','Cadet'],['新手探員','Rookie'],['觀察員','Observer'],['分析師','Analyst'],['資深探員','Senior Agent'],['讀心大師','Master Profiler']];
const XP_PER_LV=200;
const lvInfo=()=>{const lv=Math.min(LEVELS.length-1,Math.floor(state.xp/XP_PER_LV));const cur=lv===LEVELS.length-1?XP_PER_LV:state.xp-lv*XP_PER_LV;return {lv,cur,name:LEVELS[lv]};};
let fx=[];
function gain(n,x,y,label){
  if(n<=0) return; const before=lvInfo().lv; state.xp+=n;
  fx.push({type:'xp',n,x,y,label});
  if(lvInfo().lv>before) fx.push({type:'lvup'});
}
function reward(id,correct,x,y,silent){
  const r=state.q[id];
  if(correct){
    const first=r.t===1;
    if(first){state.combo++;state.maxCombo=Math.max(state.maxCombo,state.combo);}
    const bonus=first&&state.combo>=2?Math.min(25,5*(state.combo-1)):0;
    if(!silent){ gain((first?20:10)+bonus,x,y,state.combo>=2&&first?'Combo \u00d7'+state.combo:''); sfx.right(state.combo); }
    return (first?20:10)+bonus;
  } else { state.combo=0; if(!silent) sfx.wrong(); return 0; }
}

/* ---------- 合成音效（Web Audio） ---------- */
let actx=null;
function slide(f1,f2,dur,type,vol,delay=0){
  if(state.mute) return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume();
    const t=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+0.02);}catch(e){}
}
const sfx={
  right(c=1){const b=523.25*Math.pow(2,Math.min(c,8)/12);[1,1.26,1.5].forEach((m,i)=>slide(b*m,b*m,0.13,'triangle',0.16,i*0.075));},
  wrong(){slide(190,135,0.26,'sawtooth',0.09);},
  gadget(){slide(380,1180,0.28,'sine',0.12);},
  tap(){slide(660,700,0.04,'sine',0.05);},
  win(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>slide(f,f,0.18,'triangle',0.15,i*0.1));}
};

function attempt(id,correct){
  const r=state.q[id]||(state.q[id]={t:0,first:null,ok:false});
  r.t++; if(!correct) r.w=(r.w||0)+1; if(r.first===null) r.first=!!correct; if(correct) r.ok=true;
}
const isOk = id => !!(state.q[id]&&state.q[id].ok);
function hintLevel(id){return state.hl[id]||0;}
function useHint(id,st){
  const lv=hintLevel(id); if(lv>=3) return;
  state.hl[id]=lv+1; state.hs[st]=(state.hs[st]||0)+1;
}
const unlocked = n => n===1 || !!state.done[n-2];
const badges = () => state.done.filter(Boolean).length;
const totalHints = () => Object.values(state.hs).reduce((a,b)=>a+b,0);
const totalScore = () => Object.values(state.score).reduce((a,b)=>a+b,0);
function wrongCount(){let c=0;for(const k in state.q){c+=state.q[k].w||0;}return c;}
function elapsed(){if(!state.start)return 0;return Math.round(((state.end||Date.now())-state.start)/1000);}
const fmtTime = s => Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function rankOf(sc){return sc>=90?['Gold Reader','金牌探員']:sc>=75?['Silver Reader','銀牌探員']:sc>=60?['Bronze Reader','銅牌探員']:['Junior Reader','見習探員'];}

    stationScore:st?state.score[st]:'',scores:[1,2,3,4,5].map(n=>state.score[n]??''),
    done:badges(),total:totalScore(),xp:state.xp,maxCombo:state.maxCombo,hints:totalHints(),wrong:wrongCount(),elapsedSec:elapsed(),
    rank:badges()===5?rankOf(totalScore())[0]:'',reflect:(type==='final'||type==='reflect')?state.reflect:'',
    details:st?ST_ITEMS[st].map(id=>({qid:id,label:QLABEL[id].label,station:st,first:state.q[id]?.first?1:0,tries:state.q[id]?.t||0})):[],
    ts:new Date().toISOString()};
}
function queue(type,st){if(!state.player)return;state.outbox.push(payload(type,st));if(state.outbox.length>40)state.outbox=state.outbox.slice(-40);save();flush();}
let flushing=false;
async function flush(){
  if(!SCRIPT_URL||!state.outbox.length||flushing) return;
  flushing=true;
  while(state.outbox.length){
    try{await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(state.outbox[0])});state.outbox.shift();state.sent++;save();}
    catch(e){break;}
  }
  flushing=false;
  if(state.page==='cert') render();
}

function mcq(item,num,st,optsRender){
  const r=state.q[item.id]; const ok=isOk(item.id);

  const lv=hintLevel(item.id); let elim=item.hints&&item.hints[2]&&item.hints[2].act==='elim'&&lv>=3?item.hints[2].keep:null;
  if(state.cutUsed[item.id]&&!elim) elim=state.cutUsed[item.id];
  const letters='ABCD';
  const opts=item.opts.map((o,i)=>{
    let cls='opt'; let dis=ok;

    if(elim&&!elim.includes(i)&&!ok){cls+=' out';dis=true;}
    return `<button class="${cls}" data-mc="${item.id}" data-i="${i}" data-st="${st}" ${dis?'disabled':''}><span class="k">${letters[i]}</span><span lang="en">${esc(optsRender?optsRender(o):o)}</span></button>`;

const MAP_PTS = [[60,505],[112,420],[255,345],[105,265],[250,185],[115,105],[262,50]];
function gameMap(){
  const p=state.player;
  const cur = state.done.indexOf(0)+1; // 0 = all done
  const d=`M60 505 C60 470 112 460 112 420 S255 380 255 345 S105 300 105 265 S250 220 250 185 S115 140 115 105 S262 85 262 50`;
  const deco = `${tree(36,360,.9)}${tree(320,430,.8)}${tree(325,280,.9)}${tree(34,200,.8)}${tree(318,120,.85)}${tree(40,52,.7)}
    ${cloud(300,500,.7)}${cloud(190,250,.55)}${flag(150,470,'sv-sun')}
    <g transform="translate(18 520)"><rect width="52" height="18" rx="5" class="sv-a"/><text x="26" y="13" text-anchor="middle" class="sv-tw" style="font-size:10px">START</text></g>`;
  const svg=`<svg viewBox="0 0 360 540" class="mapsvg" aria-hidden="true">

    ${deco}
    <path d="${d}" fill="none" style="stroke:var(--d-path,#E9D9B5);stroke-width:30;stroke-linecap:round"/>
    <path d="${d}" fill="none" style="stroke:var(--card);stroke-width:3;stroke-dasharray:8 10;stroke-linecap:round"/>
  </svg>`;
  const nodes = STATIONS.map((st,i)=>{
    const [x,y]=MAP_PTS[i+1]; const done=state.done[i]; const u=p&&unlocked(st.n); const now=p&&cur===st.n;
    const stars = done ? `<span class="nstars">${[0,1,2].map(k=>`<svg viewBox="0 0 24 24" class="${k<starCount(state.score[st.n])?'on':''}"><path d="${'M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z'}"/></svg>`).join('')}</span>`:'';
    return `<button class="node ${done?'done':u?'':'lock'} ${now?'now':''}" style="left:${x/3.6}%;top:${y/5.4}%" data-go="${st.n}" ${u?'':'disabled'} aria-label="${esc(S('第'+st.n+'站 '+st.title[0],'Station '+st.n))}">
      ${now?`<span class="pin">${pinSVG()}</span>`:''}
      <span class="disc" style="background:${st.color}">${done?ic('check'):u?st.n:ic('lock')}</span>
      ${stars}<span class="nl">${esc(state.lang==='en'?st.title[1]:st.title[0])}</span></button>`;
  }).join('');
  const [cx,cy]=MAP_PTS[6]; const all=badges()===5;
  const certNode=`<button class="node cert-node ${all?'done':'lock'}" style="left:${cx/3.6}%;top:${cy/5.4}%" data-go="cert" ${all?'':'disabled'}>
     <span class="disc trophy">${ic('award')}</span><span class="nl">${esc(S('探員證書','Certificate'))}</span></button>`;
  return `<div class="gmap">${svg}${nodes}${certNode}</div>`;
}

/* ---------- 完成一站 ---------- */
function completeStation(n){
  if(state.done[n-1]) return;
  const ids=ST_ITEMS[n]; const first=ids.filter(id=>state.q[id]&&state.q[id].first).length;
  const sc=Math.max(0,Math.round(20*first/ids.length)-(state.hs[n]||0));
  state.score[n]=sc; state.done[n-1]=1; gain(50,innerWidth/2,innerHeight/2,'Mission'); say(n===5?'final':'done',n);
  if(badges()===5&&!state.end) state.end=Date.now();
  save();
  queue(badges()===5?'final':'progress',n); sfx.win();
  showBadge(n,sc);
}
function showBadge(n,sc){
  const st=STATIONS[n-1];
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="medal2">${badgeSVG(n,96)}</div>
   <h2>${T('獲得徽章！','Badge earned!')}</h2>

   <button class="btn block" data-modal-go="${n===5?'cert':n+1}">${n===5?T('領取證書','Get certificate',true):T('前往第'+(n+1)+'站','Go to Station '+(n+1),true)}${ic('arrow')}</button>
   <button class="btn ghost block" style="margin-top:8px" data-modal-close>${T('留在這站看答案','Stay and review',true)}</button>`;

function confetti(){

/* ---------- 事件 ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-go]'); if(!t) return;
  const d=t.dataset;
  if(t.id==='setBtn'){openSheet();return;}
  if(t.id==='muteBtn'){state.mute=!state.mute;render();if(!state.mute)sfx.tap();return;}
  if(d.act==='file'){openFile();return;}
  if(d.act==='closeFile'){closeFile();return;}
  if(d.tool==='lens'){const id=d.q;if(state.inv.lens<1||state.lensUsed[id])return;
    let q=id==='t0'?T0.lens:id==='c2'?'The reverse is true for left-handed people.':id==='s1'?(S1.items.find(x=>!isOk(x.id))||{}).src:([...S2,...S5,S4.q1].find(x=>x.id===id)||{hints:[{},{}]}).hints[1].quote;
    q=norm(q); if(!q) return; state.inv.lens--; if(id!=='s1') state.lensUsed[id]=1; if(!state.marks.includes(q)) state.marks.push(q); sfx.gadget(); render(); openFile(); return;}
  if(d.tool==='cut'){const id=d.q;const item=[...S2,...S5,S4.q1].find(x=>x.id===id);if(!item||state.inv.cut<1||state.cutUsed[id])return;
    const w=state.w[id]||{wrong:[]};const wrongs=item.opts.map((_,i)=>i).filter(i=>i!==item.ans&&!w.wrong.includes(i));
    const remove=wrongs.slice(0,2); state.cutUsed[id]=item.opts.map((_,i)=>i).filter(i=>!remove.includes(i)); state.inv.cut--; sfx.gadget(); render(); return;}
  if(d.check==='t0'){const w=state.w.t0;const bOk=Math.abs(w.body-55)<=2, wOk=Math.abs(w.words-7)<=1;const c=bOk&&wOk;attempt('t0',c);reward('t0',c,e.clientX,e.clientY);
    w.last=c?null:[...(bOk?[]:['body']),...(wOk?[]:['words'])];
    if(c) say(state.combo>=3?'combo':'right',2); else {say('wrong',2);fx.push({type:'shake',sel:'.detector'});}
    render(); if(c&&ST_ITEMS[2].every(isOk)) completeStation(2); return;}
  if(d.tile!==undefined){const w=state.w.r3;const i=Number(d.tile);if(!w.seq.includes(i)){w.seq.push(i);w.last=null;sfx.tap();}render();return;}
  if(d.slot!==undefined){const w=state.w.r3;w.seq.splice(Number(d.slot),1);w.last=null;render();return;}
  if(d.check==='r3'){const item=S5.find(x=>x.id==='r3');const w=state.w.r3;const built=w.seq.map(i=>item.tiles[i]);
    const c=built.join('|')===item.ans.join('|');attempt('r3',c);reward('r3',c,e.clientX,e.clientY);
    if(!c){ w.last = built.includes('which')?['同位語子句要用 that，不能用 which。','Use "that," not "which," in this pattern.']
      : built[0]!=='The fact'?['句子的主詞從 The fact 開始。','The subject starts with "The fact."']
      : built[1]!=='that'?['The fact 後面要緊接 that，而且 that 不能省略。','"That" must come right after "The fact" and cannot be left out.']
      : built.length<item.ans.length?['句子還不完整，所有正確字卡都要用上（有一張是陷阱）。','The sentence isn\u2019t complete. Use every correct piece (one piece is a trap).']
      : ['that 子句（S + V）講完之後，才接主要動詞 suggests。','Finish the that-clause (S + V) first, then add the main verb "suggests."'];
      w.seq=[]; say('wrong',5); fx.push({type:'shake',sel:'.lockbox'}); }
    else say(state.combo>=3?'combo':'right',5);
    render(); if(c&&ST_ITEMS[5].every(isOk)) completeStation(5); return;}
  if(d.go!==undefined){go(d.go);return;}
  if(d.modalGo!==undefined){closeModal();go(d.modalGo);return;}
  if(d.modalClose!==undefined){closeModal();render();return;}
  if(d.set){state[d.set]=d.v==='true'?true:d.v==='false'?false:d.v;render();openSheet();return;}
  if(d.act==='closeSheet'){closeSheet();return;}
  if(d.act==='resetAsk'){document.getElementById('resetBox').innerHTML=`<div class="fb bad" style="margin-top:8px">${T('確定要清除所有進度與成績嗎？已送給老師的紀錄不會被刪除。','Clear all progress? Records already sent to your teacher stay.')}<div class="row" style="margin-top:8px"><button class="btn" data-act="reset">${T('確定清除','Clear',true)}</button><button class="btn ghost" data-act="closeSheet">${T('取消','Cancel',true)}</button></div></div>`;return;}
  if(d.act==='reset'){const keep={lang:state.lang,big:state.big};state=Object.assign(fresh(),keep);closeSheet();go('home');return;}
  if(d.act==='flush'){flush();return;}
  if(d.act==='sendReflect'){state.reflect=document.getElementById('reflect').value.trim();queue('reflect');t.innerHTML=ic('check')+T('已儲存','Saved',true);save();return;}

  if(d.hint){useHint(d.hint,Number(d.st)); state.combo=0; sfx.gadget();
    if(hintLevel(d.hint)===3&&d.hint==='t0'){state.w.t0.body=55;}
    if(hintLevel(d.hint)===3&&d.hint==='r3'){const item=S5.find(x=>x.id==='r3');state.w.r3.seq=[item.tiles.indexOf('The fact'),item.tiles.indexOf('that')];state.w.r3.last=null;}
    const lv=hintLevel(d.hint);
    if(lv===3&&d.hint==='s1'){const w=state.w.s1;const x=S1.items.find(y=>!isOk(y.id));if(x){const r=state.q[x.id]||(state.q[x.id]={t:0,first:null,ok:false});if(r.first===null)r.first=false;r.ok=true;delete w.fill[x.id];Object.keys(w.fill).forEach(k=>{if(w.fill[k]===x.ans)delete w.fill[k];});w.sel=null;}
      if(S1.items.every(y=>isOk(y.id))){render();completeStation(1);return;}}
    if(lv===3&&d.hint==='s3'){const w=state.w.s3;const c=S3.cards.find(y=>w.bins[y.id]!==y.a);if(c){w.bins[c.id]=c.a;}}
    render();return;}

  if(d.blank){const w=state.w.s1;if(w.fill[d.blank]){delete w.fill[d.blank];}w.sel=d.blank;render();return;}
  if(d.chip){const w=state.w.s1;if(!w.sel)return;w.fill[w.sel]=d.chip;const nx=S1.items.find(x=>!isOk(x.id)&&!w.fill[x.id]);w.sel=nx?nx.id:null;render();return;}
  if(d.check==='s1'){const w=state.w.s1;w.wrongIds=[];
    let xp=0,anyWrong=false;
    S1.items.forEach(x=>{if(isOk(x.id))return;const c=w.fill[x.id]===x.ans;attempt(x.id,c);if(!c){anyWrong=true;w.wrongIds.push(x.id);delete w.fill[x.id];}});
    S1.items.forEach(x=>{const r=state.q[x.id];if(r&&r.ok&&!r.rew&&r.t>0){r.rew=1;xp+=reward(x.id,true,0,0,true);}});
    if(anyWrong){state.combo=0;say('wrong',1);fx.push({type:'shake',sel:'.note'});}else say(state.combo>=3?'combo':'right',1);
    if(xp) gain(xp,e.clientX,e.clientY,state.combo>=2?'Combo \u00d7'+state.combo:'');
    w.sel=null; if(S1.items.every(x=>isOk(x.id))){render();completeStation(1);} else render(); return;}

  if(d.mc){const all=[...S2,...S5,S4.q1];const item=all.find(x=>x.id===d.mc);const i=Number(d.i);const c=i===item.ans;attempt(item.id,c);
    const w=state.w[item.id]; if(!c){w.wrong.push(i);w.last=i;} else w.last=null;
    const st=Number(d.st); reward(item.id,c,e.clientX,e.clientY);
    if(c) say(state.combo>=3?'combo':'right',st); else {say('wrong',st);fx.push({type:'shake',sel:`[data-mc="${item.id}"][data-i="${i}"]`});}
    render();
    if(c&&st!==4&&ST_ITEMS[st].every(isOk)) completeStation(st);
    return;}

  if(d.card){const w=state.w.s3;w.sel=d.card;render();return;}
  if(d.bin){const w=state.w.s3;if(!w.sel)return;w.bins[w.sel]=d.bin;sfx.tap();const nx=S3.cards.find(c=>!w.bins[c.id]);w.sel=nx?nx.id:null;w.res=null;render();return;}
  if(d.check==='s3'){const w=state.w.s3;const res={lie:0,love:0,none:0};
    S3.cards.forEach(c=>{const ok=w.bins[c.id]===c.a;attempt(c.id,ok);if(ok)state.q[c.id].ok=true;else{state.q[c.id].ok=false;res[w.bins[c.id]]++;}});
    let xp=0; S3.cards.forEach(c=>{const r=state.q[c.id];if(r.ok&&!r.rew){r.rew=1;xp+=r.t===1?10:5;}});
    const allOk=S3.cards.every(c=>w.bins[c.id]===c.a);
    if(allOk){if(S3.cards.every(c=>state.q[c.id].first)){state.combo++;state.maxCombo=Math.max(state.maxCombo,state.combo);}say(state.combo>=3?'combo':'right',3);}else{state.combo=0;say('wrong',3);fx.push({type:'shake',sel:'.cards'});}
    if(xp) gain(xp,e.clientX,e.clientY,'');
    if(allOk){w.res=null;render();completeStation(3);}else{w.res=res;render();}return;}

  if(d.multi!==undefined){const w=state.w.c2;const i=Number(d.multi);const k=w.sel.indexOf(i);if(k>=0)w.sel.splice(k,1);else if(w.sel.length<3)w.sel.push(i);w.res=null;render();return;}
  if(d.check==='c2'){const w=state.w.c2;const c=w.sel.every(i=>S4.q2.opts[i].a);attempt('c2',c);reward('c2',c,e.clientX,e.clientY);
    if(c) say(state.combo>=3?'combo':'right',4); else {say('wrong',4);fx.push({type:'shake',sel:'[data-check="c2"]'});}
    if(c){render();completeStation(4);}else{w.res=w.sel.slice();w.sel=w.sel.filter(i=>S4.q2.opts[i].a);render();}return;}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='joinForm') return; e.preventDefault();
  const cls=document.getElementById('fCls').value.trim(), seat=document.getElementById('fSeat').value.trim(), name=document.getElementById('fName').value.trim();
  if(!cls||!seat||!name) return;
  state.player={cls,seat,name}; state.start=state.start||Date.now(); save();
  queue('join'); go(1);
});
document.addEventListener('input',e=>{if(e.target.id==='reflect'){state.reflect=e.target.value;save();}
  if(e.target.id==='gBody'||e.target.id==='gWords'){const w=state.w.t0;const v=Number(e.target.value);if(e.target.id==='gBody'){w.body=v;document.getElementById('vBody').textContent=v+'%';}else{w.words=v;document.getElementById('vWords').textContent=v+'%';}save();}});
document.getElementById('mask').addEventListener('click',()=>{closeSheet();closeModal();closeFile();render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();closeModal();closeFile();}});

render(); flush();
</script>
