<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jungle Rescue: Save the Elephants｜叢林大象救援行動 L8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F6F1; --bg-2:#E3ECE2; --card:#FFFFFF;
  --accent:#2E7D5B; --accent-deep:#1F5C42; --accent-ink:#164732; --tint:#D7EDE2;
  --second:#C87D28; --second-tint:#FBEBD6;
  --ink:#192B22; --ink-soft:#52695D; --line:#C9D9CD; --on-accent:#FFFFFF;
  --good:#2E7D32; --good-tint:#DFF0E0; --bad:#B83A2D; --bad-tint:#FBE2DF;
  --sun:#E8A528; --sun-tint:#FFF3D6; --grape:#6B5B95; --grape-tint:#EBE7F5;
  --shadow:0 6px 22px rgba(25,43,34,.11);
  --radius:16px;
  --c1:#2E7D5B; --c2:#B86B25; --c3:#3D7A8A; --c4:#B83A2D; --c5:#4E6E58;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1713; --bg-2:#14221B; --card:#192A22;
  --accent:#56B88C; --accent-deep:#3E9B72; --accent-ink:#9CE3C2; --tint:#1B382B;
  --second:#E5A14B; --second-tint:#382815;
  --ink:#E5F0EA; --ink-soft:#97B0A3; --line:#273E33; --on-accent:#0E1713;
  --good:#7CCF82; --good-tint:#1D3620; --bad:#F08D82; --bad-tint:#3B1E1B;
  --sun:#F2BD52; --sun-tint:#362B16; --grape:#A999D4; --grape-tint:#262138;
  --shadow:0 6px 22px rgba(0,0,0,.4);
  --c1:#56B88C; --c2:#E5A14B; --c3:#63B3C7; --c4:#F08D82; --c5:#7FB392;
}}
*{box-sizing:border-box}
html{font-size:106.25%;-webkit-text-size-adjust:100%}
html.big{font-size:118.75%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;line-height:1.8;overflow-x:hidden}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--card);z-index:60}
button{font:inherit;color:inherit}
h1,h2,h3{font-weight:800;text-wrap:balance;line-height:1.35;margin:0}
.num{font-variant-numeric:lining-nums tabular-nums}
.en{display:block;font-size:.86em;line-height:1.6;color:var(--ink-soft);margin-top:2px}
.en.in{display:inline;margin-left:.45em;font-size:.82em}
.btn .en,.on .en,.tab.on .en{color:inherit;opacity:.85}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header & HUD */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 12px rgba(25,43,34,.06)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--second));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 3px 10px rgba(46,125,91,.3)}
.logo svg.i{width:22px;height:22px}
.brand{flex:1;min-width:0;line-height:1.25}
.brand b{display:block;font-size:.98rem;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--ink-soft);font-size:.76rem;display:flex;align-items:center;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:0 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:800;font-size:.82rem;transition:transform .12s}
.pill:active{transform:scale(.95)}
.pill.badge{background:var(--sun-tint);border-color:transparent;color:var(--ink)}
.pill.badge svg.i{color:var(--sun)}
.pill.combo{background:linear-gradient(135deg,#D97706,#B91C1C);color:#fff;border:none;animation:popIn .35s cubic-bezier(.18,.89,.32,1.28)}
.pill.icon-only{padding:0 9px}

/* Rescue Progress HUD */
.hud-bar{max-width:760px;margin:0 auto;padding:0 16px 8px;display:flex;align-items:center;gap:10px;font-size:.75rem;font-weight:800}
.xp-lv{background:var(--tint);color:var(--accent-ink);padding:2px 9px;border-radius:999px;white-space:nowrap}
.xp-track{flex:1;height:8px;background:var(--bg-2);border-radius:999px;overflow:hidden;position:relative}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--second));border-radius:999px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.xp-num{color:var(--ink-soft);white-space:nowrap}

main{max-width:760px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

/* cards & animations */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin:14px 0}
.kicker{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:800;letter-spacing:.04em;color:var(--accent-ink);background:var(--card);padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.lead{color:var(--ink-soft);margin:6px 0 0}

@keyframes popIn{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .38s ease}
@keyframes floatUp{0%{transform:translateY(0) scale(.9);opacity:1}100%{transform:translateY(-44px) scale(1.1);opacity:0}}
.float-xp{position:fixed;pointer-events:none;z-index:120;font-weight:900;font-size:1.1rem;color:var(--second);text-shadow:0 2px 8px rgba(0,0,0,.18);animation:floatUp .95s ease-out forwards}

/* Rescue Radio Comms */
.comms{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(135deg,var(--tint),var(--bg-2));border:1.5px solid var(--accent);border-radius:16px;padding:12px 14px;margin:12px 0;position:relative}
.comms-av{width:44px;height:44px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 10px rgba(46,125,91,.25)}
.comms-tag{font-size:.72rem;font-weight:900;letter-spacing:.06em;color:var(--accent-ink);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.comms-tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--second);animation:blink 1.2s infinite}
.comms-msg{font-size:.93rem;font-weight:700;margin-top:2px;line-height:1.55}

/* Rescue Gear / Gadgets */
.gadgets{display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap}
.gadget{flex:1;min-width:145px;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:14px;border:1.5px solid var(--second);background:var(--second-tint);color:var(--ink);cursor:pointer;text-align:left;transition:transform .12s,box-shadow .12s}
.gadget:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 4px 12px rgba(200,125,40,.22)}
.gadget:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.6)}
.gadget .g-ic{width:34px;height:34px;border-radius:10px;background:var(--second);color:#fff;display:grid;place-items:center;flex:none}
.gadget .g-t{font-size:.82rem;font-weight:800;line-height:1.25}
.gadget .g-c{margin-left:auto;background:var(--card);color:var(--second);font-weight:900;font-size:.78rem;padding:2px 8px;border-radius:999px}

/* Escape Room Lock Display */
.lock-box{background:var(--bg-2);border:2px dashed var(--accent);border-radius:14px;padding:12px 14px;margin:12px 0;text-align:center}
.lock-digits{display:flex;justify-content:center;gap:8px;margin:8px 0}
.digit{width:46px;height:54px;border-radius:12px;background:var(--card);border:2px solid var(--accent);display:grid;place-items:center;font-size:1.45rem;font-weight:900;color:var(--accent-ink);box-shadow:var(--shadow)}
.digit.open{background:var(--good-tint);border-color:var(--good);color:var(--good)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 20px;border-radius:999px;border:none;background:var(--accent);color:var(--on-accent);font-weight:800;cursor:pointer;text-align:center;line-height:1.3;transition:transform .12s,background .15s;box-shadow:0 4px 0 var(--accent-deep)}
.btn:hover:not(:disabled){background:var(--accent-deep)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 var(--accent-deep)}
.btn.ghost{background:var(--card);color:var(--accent-ink);border:1.5px solid var(--accent);box-shadow:none}
.btn.ghost:hover:not(:disabled){background:var(--tint)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1}

/* steps intro */
.steps3{display:grid;gap:10px;margin-top:6px}
.s3{display:flex;gap:12px;align-items:flex-start}
.s3 .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;flex:none}

/* form */
.field{display:grid;gap:6px;margin:10px 0}
.field label{font-weight:700;font-size:.92rem}
.field input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
.field input:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--card)}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3 .wide{grid-column:1/-1}

/* station header */
.sh{display:flex;gap:14px;align-items:center;margin:4px 0 8px}
.bignum{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;color:#fff;font-size:2rem;font-weight:900;flex:none;box-shadow:var(--shadow)}
.sh small{display:block;color:var(--ink-soft);font-weight:700}
.tag{display:inline-block;font-size:.75rem;font-weight:800;background:var(--second-tint);color:var(--second);padding:2px 9px;border-radius:999px;margin-left:6px;vertical-align:middle}
.sh h2{font-size:clamp(1.3rem,5vw,1.7rem)}
.get{display:flex;gap:8px;align-items:flex-start;background:var(--sun-tint);border-radius:12px;padding:10px 12px;margin:10px 0 0;font-weight:600}
.get svg.i{color:var(--second);margin-top:4px}

/* passage */
details.psg{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);margin:14px 0;overflow:hidden;transition:border-color .2s}
details.psg[open]{border-color:var(--accent)}
details.psg summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 16px;min-height:52px;font-weight:800}
details.psg summary::-webkit-details-marker{display:none}
details.psg summary .ar{margin-left:auto;transition:transform .2s}
details.psg[open] summary .ar{transform:rotate(90deg)}
.psg-body{padding:0 16px 14px;border-top:1px dashed var(--line)}
.psg-body p{margin:12px 0;font-size:.98rem}
.psg-body .pn{display:inline-block;font-weight:900;color:var(--accent-ink);background:var(--tint);border-radius:8px;padding:0 7px;margin-right:6px;font-size:.8rem}
.psg-body mark.clue{background:var(--sun-tint);color:var(--ink);padding:2px 5px;border-radius:6px;font-weight:700;border-bottom:2px solid var(--sun)}

/* questions */
.q{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:16px;margin:14px 0;box-shadow:var(--shadow);transition:border-color .25s,transform .2s}
.q.ok{border-color:var(--good)}
.qh{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.qn{background:var(--tint);color:var(--accent-ink);border-radius:10px;font-weight:900;padding:2px 9px;flex:none;font-size:.9rem}
.qt{font-weight:700;line-height:1.6}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;min-height:52px;padding:11px 13px;border-radius:13px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;line-height:1.55;transition:transform .1s,border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--tint);transform:translateX(3px)}
.opt .k{font-weight:900;color:var(--accent-ink);flex:none;width:26px}
.opt.sel{border-color:var(--accent);background:var(--tint)}
.opt.good{border-color:var(--good);background:var(--good-tint)}
.opt.bad{border-color:var(--bad);background:var(--bad-tint);opacity:.85}
.opt.out{opacity:.32;text-decoration:line-through;pointer-events:none}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:.95rem;animation:popIn .25s ease}
.fb.good{background:var(--good-tint);color:var(--ink);border-left:5px solid var(--good)}
.fb.bad{background:var(--bad-tint);color:var(--ink);border-left:5px solid var(--bad)}
.fb b{display:inline-flex;align-items:center;gap:6px}
.fb.good b{color:var(--good)} .fb.bad b{color:var(--bad)}

/* hints */
.hintbar{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.hbtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px dashed var(--second);background:transparent;color:var(--ink);cursor:pointer;font-weight:700;font-size:.88rem}
.hbtn:disabled{opacity:.45;cursor:default}
.hbtn svg.i{color:var(--second)}
.hdots{display:inline-flex;gap:4px}
.hdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.hdots i.on{background:var(--second)}
.hint{background:var(--sun-tint);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.93rem}
.hint .lv{font-weight:900;color:var(--second);font-size:.78rem;display:block}
.quote{display:block;margin-top:6px;padding:8px 10px;background:var(--card);border-radius:10px;font-style:italic;border-left:4px solid var(--second)}

/* station 1 */
.note{background:repeating-linear-gradient(var(--card),var(--card) 37px,var(--line) 38px);border-radius:var(--radius);border:1px solid var(--line);padding:16px 16px 6px;box-shadow:var(--shadow)}
.note .sent{margin:0 0 14px;line-height:2.1}
.note .sn{font-weight:900;color:var(--c1);margin-right:4px}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:110px;min-height:38px;padding:0 10px;margin:0 2px;border-radius:10px;border:2px dashed var(--accent);background:var(--tint);color:var(--accent-ink);font-weight:800;cursor:pointer;vertical-align:middle}
.blank.act{border-style:solid;box-shadow:0 0 0 4px rgba(232,165,40,.45)}
.blank.filled{border-style:solid;background:var(--card)}
.blank.right{border-color:var(--good);background:var(--good-tint);color:var(--good);cursor:default}
.bank{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 -4px 20px rgba(25,43,34,.12);padding:12px;margin:14px 0}
.bank small{display:block;color:var(--ink-soft);font-weight:700;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-weight:800;transition:transform .1s}
.chip:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px)}
.chip:disabled{opacity:.3;cursor:default}

/* station 3 */
.cards{display:grid;gap:8px}
.bc{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:54px;padding:10px 12px;border-radius:13px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;line-height:1.45;transition:transform .1s}
.bc.sel{border-color:var(--sun);box-shadow:0 0 0 3px rgba(232,165,40,.4);background:var(--card);transform:scale(1.01)}
.bc .lab{margin-left:auto;font-size:.75rem;font-weight:900;padding:3px 9px;border-radius:999px;white-space:nowrap}
.lab.trap{background:var(--bad-tint);color:var(--bad)}
.lab.safe{background:var(--good-tint);color:var(--good)}
.lab.none{background:var(--bg-2);color:var(--ink-soft)}
.lab.empty{border:1.5px dashed var(--line);color:var(--ink-soft)}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--card);padding:10px;border-radius:var(--radius);border:1px solid var(--line);box-shadow:0 -4px 20px rgba(25,43,34,.12);margin-top:12px}
.bin{min-height:64px;border-radius:14px;border:none;cursor:pointer;font-weight:800;line-height:1.3;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .1s}
.bin:active:not(:disabled){transform:scale(.95)}
.bin svg.i{width:22px;height:22px}
.bin.trap{background:var(--bad-tint);color:var(--bad)}
.bin.safe{background:var(--good-tint);color:var(--good)}
.bin.none{background:var(--bg-2);color:var(--ink-soft)}
.bin:disabled{opacity:.5;cursor:default}
.bin .cnt{font-size:.72rem;opacity:.85}

/* station 4 */
.sus{display:grid;gap:12px}
.sus .p{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border-radius:14px;padding:12px;border:1.5px solid var(--line)}
.sus-portrait{width:64px;height:64px;border-radius:16px;overflow:hidden;flex:none;border:2px solid var(--card);box-shadow:var(--shadow)}
.sus .p b{display:flex;align-items:center;gap:6px}
.sus .p small{color:var(--ink-soft);font-weight:700;background:var(--card);padding:1px 8px;border-radius:999px;border:1px solid var(--line)}
.sus .p p{margin:6px 0 0;font-size:.96rem}

.boss-bar{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,var(--bad-tint),var(--sun-tint));border:1.5px solid var(--bad);border-radius:14px;padding:10px 14px;margin:10px 0;font-weight:800;font-size:.88rem;color:var(--bad)}
.boss-bar .pulse-dot{width:10px;height:10px;border-radius:50%;background:var(--bad);display:inline-block;margin-right:6px;animation:blink .9s infinite}

/* nav */
.nav2{display:flex;gap:10px;margin:22px 0 4px}
.nav2 .btn{flex:1}
.nav2 .en{display:none}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
.tab{position:relative;height:64px;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink-soft);font-weight:800;font-size:.72rem;line-height:1.15;padding:0 2px}
.tab .tn{font-size:1.05rem;font-weight:900;display:flex;align-items:center;justify-content:center;height:24px}
.tab .tn svg.i{width:18px;height:18px}
.tab.on{color:var(--accent)}
.tab.on::before{content:"";position:absolute;top:0;left:18%;right:18%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab.done .tn{color:var(--good)}
.tab:disabled{opacity:.4;cursor:not-allowed}

/* sheet & modal */
.mask{position:fixed;inset:0;background:rgba(14,23,19,.55);backdrop-filter:blur(2px);z-index:80;display:none}
.mask.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--card);border-radius:22px 22px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto;transform:translateY(105%);transition:transform .25s}
.sheet.show{transform:none}
.sheet h3{margin-bottom:10px}
.seg{display:flex;background:var(--bg-2);border-radius:999px;padding:4px;gap:4px;margin:6px 0 14px}
.seg button{flex:1;min-height:42px;border:none;border-radius:999px;background:transparent;cursor:pointer;font-weight:800;font-size:.9rem}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;z-index:95;width:min(92vw,420px);background:var(--card);border-radius:24px;padding:26px 20px 20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);transition:all .25s}
.modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
@keyframes pop{0%{transform:scale(.3) rotate(-20deg)}70%{transform:scale(1.12) rotate(6deg)}100%{transform:scale(1)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:96;overflow:hidden}

let audioCtx = null;
function playSfx(type){
  if(!state.sound) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if(type==='tap'){
      osc.type='sine'; osc.frequency.setValueAtTime(480,now); osc.frequency.exponentialRampToValueAtTime(720,now+.06);
      gain.gain.setValueAtTime(.08,now); gain.gain.exponentialRampToValueAtTime(.001,now+.06);
      osc.start(now); osc.stop(now+.06);
    } else if(type==='good'){
      const comboBoost = Math.min(state.combo||0, 6)*40;
      osc.type='triangle';
      osc.frequency.setValueAtTime(440+comboBoost,now);
      osc.frequency.setValueAtTime(554.37+comboBoost,now+.08);
      osc.frequency.setValueAtTime(659.25+comboBoost,now+.16);
      gain.gain.setValueAtTime(.14,now); gain.gain.exponentialRampToValueAtTime(.001,now+.32);
      osc.start(now); osc.stop(now+.32);
    } else if(type==='bad'){
      osc.type='sawtooth'; osc.frequency.setValueAtTime(165,now); osc.frequency.linearRampToValueAtTime(115,now+.24);
      gain.gain.setValueAtTime(.11,now); gain.gain.exponentialRampToValueAtTime(.001,now+.25);
      osc.start(now); osc.stop(now+.25);
    } else if(type==='gadget'){
      osc.type='sine'; osc.frequency.setValueAtTime(340,now); osc.frequency.exponentialRampToValueAtTime(1080,now+.25);
      gain.gain.setValueAtTime(.12,now); gain.gain.exponentialRampToValueAtTime(.001,now+.26);
      osc.start(now); osc.stop(now+.26);
    } else if(type==='win'){
      [440,554.37,659.25,880].forEach((f,idx)=>{
        const o=audioCtx.createOscillator(), g=audioCtx.createGain();
        o.type='triangle'; o.connect(g); g.connect(audioCtx.destination);

/* 紀錄作答 + XP/Combo */
function attempt(id,correct,evt){
  const r=state.q[id]||(state.q[id]={t:0,first:null,ok:false});
  const wasOk = r.ok;
  r.t++;
  if(!correct){
    r.w=(r.w||0)+1;
    state.combo=0;
    playSfx('bad');
  }
  if(r.first===null) r.first=!!correct;
  if(correct && !wasOk){
    r.ok=true;
    state.combo=(state.combo||0)+1;
    if(state.combo>(state.maxCombo||0)) state.maxCombo=state.combo;
    const gain = 50 + Math.min(state.combo-1, 5)*15;
    state.xp=(state.xp||0)+gain;
    playSfx('good');
    if(evt) spawnFloatXP(`+${gain} XP · Combo ×${state.combo}`, evt.clientX, evt.clientY-20);
  }
}

function useHint(id,st){
  const lv=hintLevel(id); if(lv>=3) return;
  state.hl[id]=lv+1; state.hs[st]=(state.hs[st]||0)+1;
  playSfx('tap');
}
const unlocked = n => n===1 || !!state.done[n-2];
const badges = () => state.done.filter(Boolean).length;
const totalHints = () => Object.values(state.hs).reduce((a,b)=>a+b,0);
const totalScore = () => Object.values(state.score).reduce((a,b)=>a+b,0);
function wrongCount(){let c=0;for(const k in state.q){c+=state.q[k].w||0;}return c;}
function elapsed(){if(!state.start)return 0;return Math.round(((state.end||Date.now())-state.start)/1000);}
const fmtTime = s => Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function rankOf(sc){return sc>=90?['Guardian Legend','傳奇叢林守護神']:sc>=75?['Elite Ranger','王牌動保救援隊長']:sc>=60?['Jungle Scout','正式叢林救援員']:['Rookie Tracker','見習叢林追蹤員'];}
function agentLevel(){
  const xp = state.xp||0;
  if(xp>=1200) return {lv:4,title:['Lv.4 象群守護神','Lv.4 Elephant Guardian'],next:1500,pct:100};
  if(xp>=750)  return {lv:3,title:['Lv.3 王牌救援隊長','Lv.3 Elite Ranger'],next:1200,pct:Math.round((xp-750)/450*100)};
  if(xp>=350)  return {lv:2,title:['Lv.2 叢林突擊員','Lv.2 Jungle Striker'],next:750,pct:Math.round((xp-350)/400*100)};
  return {lv:1,title:['Lv.1 見習救援隊','Lv.1 Rookie Ranger'],next:350,pct:Math.round(xp/350*100)};
}

/* ---------- 上傳成績 ---------- */
function payload(type,st){
  const p=state.player||{};
  return {type,game:GAME_ID,cls:p.cls,seat:p.seat,name:p.name,codename:p.code||'',station:st||'',current:typeof state.page==='number'?state.page:(badges()===5?'done':''),
    stationScore:st?state.score[st]:'',scores:[1,2,3,4,5].map(n=>state.score[n]??''),
    done:badges(),total:totalScore(),xp:state.xp||0,maxCombo:state.maxCombo||0,
    hints:totalHints(),wrong:wrongCount(),elapsedSec:elapsed(),
    rank:badges()===5?rankOf(totalScore())[0]:'',reflect:(type==='final'||type==='reflect')?state.reflect:'',
    details:st?ST_ITEMS[st].map(id=>({qid:id,label:QLABEL[id].label,station:st,first:state.q[id]?.first?1:0,tries:state.q[id]?.t||0})):[],
    ts:new Date().toISOString()};
}
function queue(type,st){if(!state.player)return;state.outbox.push(payload(type,st));if(state.outbox.length>40)state.outbox=state.outbox.slice(-40);save();flush();}
let flushing=false;
async function flush(){
  if(!SCRIPT_URL||!state.outbox.length||flushing) return;
  flushing=true;
  while(state.outbox.length){
    try{
      await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(state.outbox[0])});
      state.outbox.shift(); state.sent++; save();
    }catch(e){break;}
  }
  flushing=false;
  if(state.page==='cert') render();
}
window.addEventListener('online',flush);

function highlightClues(text, active){
  let out = esc(text);
  if(!active) return out;
  CLUES.forEach(c=>{
    const ec = esc(c);
    if(out.includes(ec)) out = out.replace(ec, `<mark class="clue">${ec}</mark>`);
  });
  return out;
}

function hintUI(id,st,hints,quoteText){
  const lv=hintLevel(id);
  if(isOk(id)) return '';
  let h='';
  for(let i=0;i<lv;i++){
    const H=hints[i]; let qt='';
    if(H.quote){const t=typeof H.quote==='string'?H.quote:quoteText; if(t) qt=`<span class="quote" lang="en">${esc(t)}</span>`;}
    h+=`<div class="hint"><span class="lv">${T('救援提示 '+(i+1)+'（-1分）','Hint '+(i+1)+' (-1 pt)',true)}</span>${TP(H.t)}${qt}</div>`;
  }
  const dots=[0,1,2].map(i=>`<i class="${i<lv?'on':''}"></i>`).join('');
  return `<div class="hintbar"><button class="hbtn" data-hint="${id}" data-st="${st}" ${lv>=3||isOk(id)?'disabled':''}>${ic('bulb')}${T(lv>=3?'提示已用完':'呼叫總部支援',lv>=3?'No more hints':'Call HQ Hint',true)}</button><span class="hdots" aria-label="${S('已用提示','hints used')} ${lv}/3">${dots}</span></div>${h}`;
}

/* 單選題 */
function mcq(item,num,st,optsRender){
  const ok=isOk(item.id);
  const w=state.w[item.id]||(state.w[item.id]={wrong:[],last:null,shake:false});
  const lv=hintLevel(item.id);
  const hintElim=item.hints&&item.hints[2]&&item.hints[2].act==='elim'&&lv>=3?item.hints[2].keep:null;
  const jamElim=(state.jammed&&state.jammed[item.id])||[];
  const letters='ABCD';
  const opts=item.opts.map((o,i)=>{
    let cls='opt'; let dis=ok;
    if(ok&&i===item.ans) cls+=' good';
    if(w.wrong.includes(i)){cls+=' bad';dis=true;}
    if(((hintElim&&!hintElim.includes(i))||jamElim.includes(i))&&!ok){cls+=' out';dis=true;}
    return `<button class="${cls}" data-mc="${item.id}" data-i="${i}" data-st="${st}" ${dis?'disabled':''}><span class="k">${letters[i]}</span><span lang="en">${esc(optsRender?optsRender(o):o)}</span></button>`;
  }).join('');
  let fb='';
  if(ok) fb=`<div class="fb good"><b>${ic('check')}${T('密碼鎖解除！','Lock Disarmed!',true)}</b><br>${TP(item.ok)}</div>`;
  else if(w.last!==null&&item.fb[w.last]) fb=`<div class="fb bad"><b>${ic('x')}${T('警報響起！密碼錯誤','Alarm! Wrong Code',true)}</b><br>${TP(item.fb[w.last])} <span class="muted num">(${esc(item.ref)})</span></div>`;
  const shakeCls = w.shake?'shake':''; if(w.shake) w.shake=false;
  return `<div class="q ${ok?'ok':''} ${shakeCls}"><div class="qh"><span class="qn num">Q${num}</span><div class="qt" lang="en">${esc(item.q)}</div></div>
   <div class="opts">${opts}</div>${fb}${jamBtn(item.id)}${item.hints?hintUI(item.id,st,item.hints):''}</div>`;
}

    ${missed.length?`<ul class="miss">${missed.map(id=>`<li><span lang="en">${esc(QLABEL[id].label)}</span><small>${T('回去查閱','Review',true)} ${esc(QLABEL[id].ref)}</small></li>`).join('')}</ul>`:`<p class="muted" style="margin:0">${T('全部一次就解鎖，零失誤的傳奇救援行動！','Flawless escape! Every single lock opened on the first try!')}</p>`}</div>
   <div class="card"><h3>${T('SDGs 動保宣言（實地行動日誌）','SDGs Action Pledge')}</h3>
    <p class="muted" style="margin:4px 0 8px">${T('用 1–2 句英文寫下：除了泰國大象，你還知道哪些動物在觀光業中受苦？我們該怎麼做？（試著用 It is high time that...）','In 1–2 English sentences: What other animals suffer in tourism, and what should we do? (Try using "It is high time that...")')}</p>
    <textarea id="reflect" rows="3" placeholder="It is high time that we stopped watching animal shows because…" lang="en">${esc(state.reflect)}</textarea>
    <button class="btn ghost block" style="margin-top:10px" data-act="sendReflect">${ic('cloud')}${T('傳送動保宣言','Send Action Pledge',true)}</button></div>
   <div class="row"><button class="btn ghost" data-go="home">${ic('home')}${T('回叢林地圖','Map',true)}</button></div>`;
}

/* ---------- render ---------- */
function render(){
  document.documentElement.classList.toggle('big',!!state.big);
  document.documentElement.lang = state.lang==='en'?'en':'zh-Hant';
  document.getElementById('logo').innerHTML=ic('compass');
  const p=state.player;
  document.getElementById('brandSub').innerHTML=p?`${esc(p.name)} · ${esc(p.code?.split(' ')[0]||'Ranger')}`:T('叢林大象救援行動 · L8','',true);

  const cPill=document.getElementById('comboPill');
  if((state.combo||0)>=2){cPill.style.display='inline-flex';cPill.innerHTML=ic('zap')+`×${state.combo}`;}
  else cPill.style.display='none';

  document.getElementById('badgeCount').innerHTML=ic('key')+`<span>${badges()}/5</span>`;
  document.getElementById('sndBtn').innerHTML=ic(state.sound?'volOn':'volOff');
  document.getElementById('setBtn').innerHTML=ic('sliders');
  const fab=document.getElementById('fab'); fab.innerHTML=ic('book')+esc(state.lang==='en'?'Intel':'營區密檔'); fab.classList.toggle('show',typeof state.page==='number'&&!!state.player);

  const lv=agentLevel();
  document.getElementById('hudBar').innerHTML=`<span class="xp-lv">${T(lv.title[0],lv.title[1],true).replace(/<span class="en in"/,'<span class="en in" style="display:none"')}</span>
   <div class="xp-track"><div class="xp-fill" style="width:${lv.pct}%"></div></div>
   <span class="xp-num num">${state.xp||0} XP</span>`;

  let pg=state.page;
  if(typeof pg==='number'&&(!state.player||!unlocked(pg))) pg=state.page='home';
  const app=document.getElementById('app');
  const html = pg==='home'?pageHome():pg==='cert'?pageCert():[null,pageS1,pageS2,pageS3,pageS4,pageS5][pg]();
  app.innerHTML = html + `<footer><b>Gina教室的AI奇蹟</b><br>鳳新高中英文科李姬慧老師 X AI 彙整製作</footer>`;
  renderTabs(pg);
  save();
}
function renderTabs(pg){
  const cells=[{k:'home',n:ic('home'),zh:'地圖',en:'Map'}].concat(STATIONS.map(s=>({k:s.n,n:state.done[s.n-1]?ic('unlock'):(state.player&&unlocked(s.n)?s.n:ic('lock')),zh:'密室'+s.n,en:'R.'+s.n,lock:!state.player||!unlocked(s.n),done:state.done[s.n-1]}))).concat([{k:'cert',n:ic('award'),zh:'證書',en:'Cert.',lock:badges()<5}]);
  document.getElementById('tabs').innerHTML=cells.map(c=>`<button class="tab ${pg===c.k?'on':''} ${c.done?'done':''}" data-go="${c.k}" ${c.lock?'disabled':''} aria-label="${esc(c.zh)}"><span class="tn num">${c.n}</span><span>${esc(state.lang==='en'?c.en:c.zh)}</span></button>`).join('');
}
function go(k){
  playSfx('tap');
  state.page = (k==='home'||k==='cert')?k:Number(k);
  if(typeof state.page==='number') queue('enter');
  render(); window.scrollTo(0,0);
}

/* ---------- 完成一站 ---------- */
function completeStation(n){
  if(state.done[n-1]) return;
  const ids=ST_ITEMS[n]; const first=ids.filter(id=>state.q[id]&&state.q[id].first).length;
  const sc=Math.max(0,Math.round(20*first/ids.length)-(state.hs[n]||0));
  state.score[n]=sc; state.done[n-1]=1;
  state.xp=(state.xp||0)+150;
  if(badges()===5&&!state.end) state.end=Date.now();
  save();
  queue(badges()===5?'final':'progress',n);
  playSfx('win');
  showBadge(n,sc);
}
function showBadge(n,sc){
  const st=STATIONS[n-1];
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="medal2">${badgeSVG(n,96)}</div>
   <h2>${T('獲得第 '+n+' 把叢林鑰匙！','Jungle Key #'+n+' Earned!')}</h2>
   <p class="muted" style="margin:6px 0 2px">${TP(st.title,true)}</p>
   <p style="margin:4px 0 16px">${T('密室得分','Score',true)} <b class="num" style="font-size:1.4rem;color:var(--accent-ink)">${sc}</b> / 20 <span class="kicker" style="margin-left:6px">+150 XP</span></p>
   <button class="btn block" data-modal-go="${n===5?'cert':n+1}">${n===5?T('護送成功！領取英雄證書','Escaped! Claim Certificate',true):T('潛入密室 '+(n+1),'Enter Room '+(n+1),true)}${ic('arrow')}</button>
   <button class="btn ghost block" style="margin-top:8px" data-modal-close>${T('留在本室檢視線索','Stay & Review',true)}</button>`;
  document.getElementById('mask').classList.add('show'); m.classList.add('show');
  confetti();
  setTimeout(()=>{const b=m.querySelector('[data-modal-go]');b&&b.focus();},50);
}
function closeModal(){document.getElementById('modal').classList.remove('show');document.getElementById('mask').classList.remove('show');}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box=document.getElementById('confetti'); const cols=['#2E7D5B','#C87D28','#E8A528','#3D7A8A','#56B88C'];
  box.innerHTML=Array.from({length:45},(_,i)=>`<i style="left:${Math.random()*100}%;background:${cols[i%5]};animation-delay:${Math.random()*.4}s"></i>`).join('');
  setTimeout(()=>box.innerHTML='',2200);
}

/* ---------- 設定 ---------- */
function openSheet(){
  const sh=document.getElementById('sheet');
  const seg=(key,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button data-set="${key}" data-v="${v}" class="${String(state[key])===String(v)?'on':''}">${l}</button>`).join('')}</div>`;
  sh.innerHTML=`<h3 id="sheetTitle">${T('救援終端設定','Terminal Settings',true)}</h3>
   <b>${T('顯示語言','Language',true)}</b>${seg('lang',[['zh','中文'],['bi','雙語'],['en','English']])}
   <b>${T('字體大小','Text size',true)}</b>${seg('big',[[false,S('標準','Normal')],[true,S('放大','Large')]])}
   <button class="btn ghost block" data-act="resetAsk">${T('重新開始（清除進度）','Start over (clear progress)',true)}</button>
   <div id="resetBox"></div>
   <button class="btn block" style="margin-top:10px" data-act="closeSheet">${T('完成','Done',true)}</button>`;
  document.getElementById('mask').classList.add('show'); sh.classList.add('show');
}
function closeSheet(){document.getElementById('sheet').classList.remove('show');document.getElementById('mask').classList.remove('show');}

/* ---------- 事件 ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-go]'); if(!t) return;
  const d=t.dataset;
  if(t.id==='setBtn'){playSfx('tap');openSheet();return;}
  if(t.id==='sndBtn'){state.sound=!state.sound;playSfx('tap');render();return;}
  if(d.go!==undefined){go(d.go);return;}
  if(d.modalGo!==undefined){closeModal();go(d.modalGo);return;}
  if(d.modalClose!==undefined){closeModal();render();return;}
  if(d.set){state[d.set]=d.v==='true'?true:d.v==='false'?false:d.v;playSfx('tap');render();openSheet();return;}
  if(d.act==='closeSheet'){closeSheet();return;}
  if(d.act==='resetAsk'){document.getElementById('resetBox').innerHTML=`<div class="fb bad" style="margin-top:8px">${T('確定要清除所有進度與成績嗎？已送給老師的紀錄不會被刪除。','Clear all progress? Records already sent to your teacher stay.')}<div class="row" style="margin-top:8px"><button class="btn" data-act="reset">${T('確定清除','Clear',true)}</button><button class="btn ghost" data-act="closeSheet">${T('取消','Cancel',true)}</button></div></div>`;return;}
  if(d.act==='reset'){const keep={lang:state.lang,big:state.big,sound:state.sound};state=Object.assign(fresh(),keep);closeSheet();go('home');return;}
  if(d.act==='flush'){flush();return;}
  if(d.act==='intel'){playSfx('tap');openIntel();return;}
  if(d.act==='closeIntel'){closeIntel();return;}
  if(d.jam){
    const id=d.jam; if(state.gadgets.jammer<=0||isOk(id)||(state.jammed[id]&&state.jammed[id].length)) return;
    if(id==='c2'){state.jammed.c2=[3,5];}
    else{const item=[...S2,...S5,S4.q1].find(x=>x.id===id); const wrongs=item.opts.map((_,i)=>i).filter(i=>i!==item.ans&&!(state.w[id]?.wrong||[]).includes(i)); state.jammed[id]=wrongs.slice(0,item.opts.length>3?2:1);}
    state.gadgets.jammer--; playSfx('gadget'); render(); return;}
  if(d.act==='sendReflect'){state.reflect=document.getElementById('reflect').value.trim();queue('reflect');t.innerHTML=ic('check')+T('已儲存','Saved',true);playSfx('good');save();return;}

  /* 叢林救援裝備觸發 */
  if(d.gadget){
    const stNum = Number(d.st);
    if(d.gadget==='scanner' && state.gadgets.scanner>0 && !state.scanOpen[stNum]){
      state.gadgets.scanner--;
      state.scanOpen[stNum]=true;
      playSfx('gadget');
      render(); openIntel();
    } else if(d.gadget==='jammer' && state.gadgets.jammer>0){
      let applied=false;
      if(stNum===2 || stNum===5){
        const list = stNum===2?S2:S5;
        const target = list.find(q=>!isOk(q.id) && !(state.jammed[q.id]?.length));
        if(target){
          const wrongs = [0,1,2,3].filter(idx=>idx!==target.ans && !(state.w[target.id]?.wrong||[]).includes(idx));
          state.jammed[target.id] = wrongs.slice(0,2);
          applied=true;
        }
      } else if(stNum===4){
        if(!isOk('c1') && !(state.jammed.c1?.length)){
          state.jammed.c1 = [0]; applied=true;
        } else if(isOk('c1') && !isOk('c2') && !(state.jammed.c2?.length)){
          state.jammed.c2 = [1,4]; applied=true;
        }
      }
      if(applied){
        state.gadgets.jammer--;
        playSfx('gadget');
        render();
      }
    }
    return;
  }

  if(d.hint){useHint(d.hint,Number(d.st));
    const lv=hintLevel(d.hint);
    if(lv===3&&d.hint==='s1'){const w=state.w.s1;const x=S1.items.find(y=>!isOk(y.id));if(x){const r=state.q[x.id]||(state.q[x.id]={t:0,first:null,ok:false});if(r.first===null)r.first=false;r.ok=true;delete w.fill[x.id];Object.keys(w.fill).forEach(k=>{if(w.fill[k]===x.ans)delete w.fill[k];});w.sel=null;}
      if(S1.items.every(y=>isOk(y.id))){render();completeStation(1);return;}}
    if(lv===3&&d.hint==='s3'){const w=state.w.s3;const c=S3.cards.find(y=>w.bins[y.id]!==y.a);if(c){w.bins[c.id]=c.a;}}
    render();return;}

  if(d.blank){playSfx('tap');const w=state.w.s1;if(w.fill[d.blank]){delete w.fill[d.blank];}w.sel=d.blank;render();return;}
  if(d.chip){playSfx('tap');const w=state.w.s1;if(!w.sel)return;w.fill[w.sel]=d.chip;const nx=S1.items.find(x=>!isOk(x.id)&&!w.fill[x.id]);w.sel=nx?nx.id:null;render();return;}
  if(d.check==='s1'){const w=state.w.s1;w.wrongIds=[];
    S1.items.forEach(x=>{if(isOk(x.id))return;const c=w.fill[x.id]===x.ans;attempt(x.id,c,e);if(!c){w.wrongIds.push(x.id);delete w.fill[x.id];}});
    if(w.wrongIds.length) w.shake=true;
    w.sel=null; if(S1.items.every(x=>isOk(x.id))){render();completeStation(1);} else render(); return;}

  if(d.mc){const all=[...S2,...S5,S4.q1];const item=all.find(x=>x.id===d.mc);const i=Number(d.i);const c=i===item.ans;attempt(item.id,c,e);
    const w=state.w[item.id]; if(!c){w.wrong.push(i);w.last=i;w.shake=true;} else w.last=null;
    const st=Number(d.st); render();
    if(c&&st!==4&&ST_ITEMS[st].every(isOk)) completeStation(st);
    return;}

  if(d.card){playSfx('tap');const w=state.w.s3;w.sel=d.card;render();return;}
  if(d.bin){playSfx('tap');const w=state.w.s3;if(!w.sel)return;w.bins[w.sel]=d.bin;const nx=S3.cards.find(c=>!w.bins[c.id]);w.sel=nx?nx.id:null;w.res=null;render();return;}
  if(d.check==='s3'){const w=state.w.s3;const res={trap:0,safe:0,none:0};
    S3.cards.forEach(c=>{const ok=w.bins[c.id]===c.a;attempt(c.id,ok,e);if(ok)state.q[c.id].ok=true;else{state.q[c.id].ok=false;res[w.bins[c.id]]++;}});
    if(S3.cards.every(c=>w.bins[c.id]===c.a)){w.res=null;render();completeStation(3);}else{w.res=res;w.shake=true;render();}return;}

  if(d.multi!==undefined){playSfx('tap');const w=state.w.c2;const i=Number(d.multi);const k=w.sel.indexOf(i);if(k>=0)w.sel.splice(k,1);else if(w.sel.length<3)w.sel.push(i);w.res=null;render();return;}
  if(d.check==='c2'){const w=state.w.c2;const c=w.sel.every(i=>S4.q2.opts[i].a);attempt('c2',c,e);
    if(c){render();completeStation(4);}else{w.res=w.sel.slice();w.sel=w.sel.filter(i=>S4.q2.opts[i].a);w.shake=true;render();}return;}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='joinForm') return; e.preventDefault();
  const cls=document.getElementById('fCls').value.trim(), seat=document.getElementById('fSeat').value.trim(), name=document.getElementById('fName').value.trim();
  if(!cls||!seat||!name) return;
  const code = CODENAMES[(Number(seat)||Math.floor(Math.random()*8)) % CODENAMES.length];
  state.player={cls,seat,name,code}; state.start=state.start||Date.now(); save();
  playSfx('win');
  queue('join'); go(1);
});
document.addEventListener('input',e=>{if(e.target.id==='reflect'){state.reflect=e.target.value;save();}});
document.getElementById('mask').addEventListener('click',()=>{closeSheet();closeModal();closeIntel();render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();closeModal();closeIntel();}});

render(); flush();
</script>
</body>
</html>
