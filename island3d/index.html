<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gina 的教學群島 3D</title>
  <meta name="description" content="Gina教室的AI奇蹟：動漫奇幻 3D 教學群島，收錄學測、英文課、SDGs、學檔與班級經營教材。">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="stage" aria-hidden="true"></div>

  <header id="hud">
    <div class="brand">Gina 的教學群島<small>Teaching Archipelago</small></div>
    <div class="hud-btns">
      <span id="stamps" class="chip">🏅 0 / 0</span>
      <button id="charBtn" class="chip" type="button">👤 角色</button>
      <button id="listBtn" class="chip" type="button">☰ 島嶼</button>
      <button id="musicBtn" class="chip" type="button" aria-pressed="false">♪ 關</button>
    </div>
  </header>
  <p id="hint">方向鍵／WASD／搖桿走路・點地面或點島自動前往・走進傳送陣登島</p>

  <!-- 開場：選角色 -->
  <section id="intro" class="overlay">
    <div class="select-card">
      <p class="eyebrow">Gina教室的AI奇蹟・教學群島</p>
      <h1>選擇你的旅人</h1>
      <p class="lead">選好的角色會出現在群島上，由你操控走進每一座島。</p>
      <div id="charGrid" class="char-grid" role="radiogroup" aria-label="角色"></div>
      <div id="charInfo" class="char-info"></div>
      <label for="nameInput">旅人的名字</label>
      <input id="nameInput" maxlength="12" placeholder="輸入暱稱（只存在這台裝置）" autocomplete="off">
      <button id="startBtn" type="button">奏起樂章，啟航</button>
      <p class="small">按下後會播放配樂，可隨時在右上角關閉。</p>
    </div>
  </section>

  <!-- 任務追蹤、小地圖、島主對話 -->
  <div id="quest" class="quest"><b>任務</b><span id="questText">走進一座島的傳送陣</span><span id="questArrow">➤</span></div>
  <canvas id="minimap" width="160" height="160" aria-label="小地圖"></canvas>
  <div id="talk" hidden><div class="talk-name" id="talkName"></div><div id="talkText"></div><button id="talkGo" type="button">進入島嶼</button></div>

  <!-- 手機搖桿 -->
  <div id="joy" aria-hidden="true"><div id="joyKnob"></div></div>
  <div id="flash"></div>

  <!-- 島嶼面板 -->
  <section id="panel" hidden aria-live="polite">
    <button id="closeBtn" type="button" aria-label="關閉">✕</button>
    <div id="panelBody"></div>
  </section>

  <!-- 島嶼清單 -->
  <section id="drawer" hidden>
    <div class="drawer-head"><h2>島嶼清單</h2><button id="drawerClose" type="button" aria-label="關閉">✕</button></div>
    <div id="drawerBody"></div>
  </section>

  <div id="toast" role="status"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
