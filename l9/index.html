<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pilgrimage Guardian｜媽祖進香文化特使 L9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2a0b0b; --bg2:#3b0d0d;
  --verm:#b91c1c; --verm-d:#7f1d1d; --gold:#d97706; --gold-b:#fbbf24; --gold-t:#fef3c7;
  --parch:#fffbeb; --parch2:#fef3c7; --card:#fffdf6;
  --ink:#1c1917; --soft:#6b5b4e; --line:#ecd9a8;
  --jade:#047857; --jade-t:#d1fae5; --bad:#b91c1c; --bad-t:#fee2e2;
  --pink:#db2777; --pink-t:#fce7f3; --sky:#0369a1; --sky-t:#e0f2fe;
  --radius:16px; --shadow:0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{font-size:106.25%;-webkit-text-size-adjust:100%}
html.big{font-size:118.75%}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Inter','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;line-height:1.75;
  background-color:var(--bg);
  background-image:radial-gradient(circle at 50% 0%,rgba(217,119,6,.25),transparent 60%),radial-gradient(circle at 15% 85%,rgba(185,28,28,.35),transparent 55%),repeating-linear-gradient(45deg,rgba(251,191,36,.04) 0 2px,transparent 2px 16px);
  background-attachment:fixed}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:#1c0606;z-index:60}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
.disp{font-family:'Cinzel','Noto Sans TC',serif;letter-spacing:.03em}
.scrollf{font-family:'Lora','Noto Sans TC',serif}
.num{font-variant-numeric:lining-nums tabular-nums}
.hidden-svg{position:absolute;width:0;height:0;overflow:hidden}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.en{display:block;font-size:.86em;line-height:1.55;color:var(--soft);margin-top:2px}
.en.in{display:inline;margin-left:.4em;font-size:.82em}
.btn .en,.dark .en{color:inherit;opacity:.8}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:linear-gradient(90deg,#450a0a,#1c1917,#450a0a);border-bottom:2px solid rgba(251,191,36,.6);box-shadow:0 4px 16px rgba(0,0,0,.4);color:var(--gold-t)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px max(14px,env(safe-area-inset-right,0px)) 6px max(14px,env(safe-area-inset-left,0px))}
.crest{width:40px;height:40px;flex:none}
.brand{flex:1;min-width:0;line-height:1.2}
.brand b{display:block;font-family:'Cinzel',serif;font-size:.9rem;color:var(--gold-b);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:.72rem;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid rgba(251,191,36,.45);background:rgba(28,25,23,.7);color:var(--gold-t);cursor:pointer}
.hbtn.codex{width:auto;padding:0 10px;gap:6px;display:inline-flex;background:var(--gold);color:#1c1917;border:none;font-weight:800;font-size:.82rem}
.hud{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;padding:0 max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));font-size:.72rem;font-weight:800}
.hud:empty{display:none}
.meter{flex:1;display:flex;align-items:center;gap:8px}
.meter .tr{flex:1;height:8px;border-radius:999px;background:#292524;overflow:hidden}
.meter .fl{display:block;height:100%;background:linear-gradient(90deg,#ef4444,#f59e0b,#fde047);transition:width .5s}
.merit{background:rgba(4,120,87,.25);border:1px solid rgba(16,185,129,.5);color:#6ee7b7;border-radius:8px;padding:2px 8px;white-space:nowrap}

main{max-width:760px;margin:0 auto;padding:16px max(14px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}

/* cards */
.scroll{background:linear-gradient(180deg,var(--parch),var(--parch2));border:2px solid var(--gold);border-radius:var(--radius);box-shadow:var(--shadow),inset 0 0 0 4px rgba(185,28,28,.1);padding:18px;margin:14px 0}
.dark{background:linear-gradient(165deg,#3b0d0d,#1c1917);border:1.5px solid rgba(251,191,36,.45);border-radius:var(--radius);box-shadow:var(--shadow);color:var(--gold-t);padding:16px;margin:14px 0}
.kicker{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:800;letter-spacing:.08em;color:var(--gold-t);background:var(--verm-d);padding:3px 10px;border-radius:999px;text-transform:uppercase}
.lead{color:var(--soft);margin:8px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 20px;border-radius:14px;border:2px solid var(--gold-b);background:linear-gradient(90deg,var(--verm-d),var(--verm),#b45309);color:var(--gold-t);font-weight:800;cursor:pointer;line-height:1.3;text-align:center}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--card);color:var(--verm-d);border:2px solid var(--gold)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
:focus-visible{outline:3px solid var(--gold-b);outline-offset:2px}

/* form */
.field{display:grid;gap:4px}
.field label{font-weight:700;font-size:.88rem}
.field input,textarea{font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--gold);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
.field input:focus,textarea:focus{outline:none;box-shadow:0 0 0 3px rgba(185,28,28,.25)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .wide{grid-column:1/-1}
.err{color:var(--bad);font-weight:700;font-size:.85rem;margin:8px 0 0}

/* route map */
.gmap{position:relative;width:100%;aspect-ratio:360/520}
.gmap svg.mapsvg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;cursor:pointer;padding:0}
.node .disc{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--parch);border:3px solid var(--gold-b);box-shadow:0 5px 0 rgba(0,0,0,.3)}
.node .disc svg{width:44px;height:44px}
.node.lock .disc{filter:grayscale(1);opacity:.55}
.node.lock{cursor:not-allowed}
.node.now .disc{animation:glow 1.8s infinite}
@keyframes glow{50%{box-shadow:0 5px 0 rgba(0,0,0,.3),0 0 0 12px rgba(251,191,36,0)}0%,100%{box-shadow:0 5px 0 rgba(0,0,0,.3),0 0 0 0 rgba(251,191,36,.7)}}
.node .nl{background:var(--verm-d);color:var(--gold-t);border:1px solid var(--gold-b);border-radius:999px;padding:0 10px;font-size:.72rem;font-weight:800;white-space:nowrap;line-height:1.7}
.node .ok{position:absolute;top:-4px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--jade);color:#fff;display:grid;place-items:center;border:2px solid var(--parch)}
.node .ok svg.i{width:14px;height:14px}
.node .sc{font-size:.7rem;font-weight:900;color:var(--gold-b)}

/* act header */
.banner{position:relative;border-radius:var(--radius);overflow:hidden;border:2px solid var(--gold);box-shadow:var(--shadow);margin:2px 0 12px}
.banner svg.scene{display:block;width:100%;height:auto}
.banner .tag{position:absolute;left:12px;top:10px;background:var(--verm-d);color:var(--gold-t);border:1px solid var(--gold-b);border-radius:999px;font-size:.72rem;font-weight:900;letter-spacing:.1em;padding:2px 10px}
.banner .stamp{position:absolute;right:14px;bottom:14px;color:var(--verm);border:4px solid var(--verm);background:rgba(255,251,235,.9);border-radius:10px;padding:2px 12px;font-weight:900;font-family:'Cinzel',serif;transform:rotate(-10deg);animation:stampin .5s cubic-bezier(.18,.89,.32,1.28)}
@keyframes stampin{0%{transform:rotate(-10deg) scale(2.2);opacity:0}100%{transform:rotate(-10deg) scale(1);opacity:1}}
.ah{display:flex;align-items:center;gap:12px}
.ah .ae{width:56px;height:56px;flex:none}
.ah small{display:block;font-weight:800;font-size:.78rem;color:var(--gold-b)}
.ah h2{font-family:'Cinzel','Noto Sans TC',serif;color:var(--gold-t);font-size:clamp(1.15rem,4.8vw,1.5rem)}
.ah .sub{color:var(--gold-t);opacity:.8;font-size:.86rem}
.goal{display:flex;gap:8px;align-items:flex-start;background:rgba(251,191,36,.12);border:1px dashed rgba(251,191,36,.5);border-radius:12px;padding:8px 12px;margin-top:10px;font-size:.92rem;color:var(--gold-t)}
.goal svg.i{color:var(--gold-b);margin-top:3px}

/* guide */
.guide{display:flex;gap:12px;align-items:flex-start}
.guide .av{width:48px;height:48px;flex:none}
.guide .who{font-size:.72rem;font-weight:900;letter-spacing:.08em;color:var(--gold-b);display:flex;align-items:center;gap:6px}
.guide .who::before{content:"";width:7px;height:7px;border-radius:50%;background:#34d399;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.guide .msg{font-weight:600;font-size:.94rem;margin-top:2px}
.guide.warn{border-color:#f59e0b}
.guide.cheer{border-color:#34d399}

/* field scroll */
.fsh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-size:.74rem;font-weight:800;letter-spacing:.06em;color:var(--verm-d);text-transform:uppercase}
.passage{font-family:'Lora',serif;font-size:1.05rem;line-height:1.95;margin:0}
.vw{color:#991b1b;font-weight:700;border:none;border-bottom:2px dashed var(--gold);background:rgba(251,191,36,.18);padding:0 3px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:inherit;line-height:inherit}
.vw.on{background:var(--verm);color:var(--parch)}
.vw.clue{background:#fde047;border:1.5px solid var(--verm);box-shadow:0 0 10px rgba(217,119,6,.5)}
.tipbox{margin-top:10px;background:#fff;border:1.5px solid var(--gold);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.tipbox b{color:var(--verm-d)}
.tipbox i{color:var(--gold);font-size:.85rem;margin-left:4px}
.tipbox .x{margin-left:auto;border:none;background:none;cursor:pointer;color:var(--soft);font-weight:900;min-width:32px;min-height:32px}

/* questions */
.q{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:16px;margin:14px 0;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.q.ok{border-color:var(--jade)}
.qh{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.qn{background:var(--verm-d);color:var(--gold-t);border-radius:8px;font-weight:900;padding:1px 9px;flex:none;font-size:.85rem}
.qt{font-weight:700;line-height:1.55}
.qtype{display:block;font-size:.7rem;font-weight:800;letter-spacing:.06em;color:var(--gold);text-transform:uppercase}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;min-height:52px;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--verm);background:var(--parch)}
.opt .k{font-weight:900;color:var(--verm-d);flex:none;width:24px}
.opt.good{border-color:var(--jade);background:var(--jade-t)}
.opt.bad{border-color:var(--bad);background:var(--bad-t);opacity:.85}
.opt.out{opacity:.35;text-decoration:line-through}
.opt.sel{border-color:var(--verm);background:var(--parch2)}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:.94rem}
.fb.good{background:var(--jade-t);border-left:5px solid var(--jade)}
.fb.bad{background:var(--bad-t);border-left:5px solid var(--bad)}
.fb b{display:inline-flex;align-items:center;gap:6px}
.fb.good b{color:var(--jade)} .fb.bad b{color:var(--bad)}
.shake{animation:shake .4s ease}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* fill */
.sent{margin:0 0 12px;line-height:2.15}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:104px;min-height:38px;padding:0 10px;margin:0 2px;border-radius:10px;border:2px dashed var(--verm);background:var(--parch2);color:var(--verm-d);font-weight:800;cursor:pointer;vertical-align:middle}
.blank.act{border-style:solid;box-shadow:0 0 0 4px rgba(251,191,36,.5)}
.blank.filled{border-style:solid;background:#fff}
.blank.right{border-color:var(--jade);background:var(--jade-t);color:var(--jade);cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--gold);background:#fff;cursor:pointer;font-weight:800}
.chip:disabled{opacity:.3;cursor:default}
.subh{font-size:.76rem;font-weight:800;color:var(--soft);margin:12px 0 4px}

/* order & lock */
.seqbox{background:#1c1917;border-radius:12px;padding:10px;color:#fff}
.seqbox .lt{font-size:.7rem;font-weight:900;letter-spacing:.12em;opacity:.85;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.slots{display:flex;flex-wrap:wrap;gap:6px;min-height:50px;border:1.5px dashed rgba(255,255,255,.35);border-radius:10px;padding:8px}
.slots.col{flex-direction:column}
.slots .ph{opacity:.6;font-size:.85rem;align-self:center}
.tile{min-height:42px;padding:4px 12px;border-radius:10px;border:none;font-weight:700;cursor:pointer;background:#fff;color:var(--ink);text-align:left;line-height:1.35}
.tile .n{display:inline-block;min-width:22px;font-weight:900;color:var(--verm)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tiles.col{flex-direction:column}
.tiles .tile{background:#fff;border:1.5px solid var(--gold)}
.tiles .tile:disabled{opacity:.25}
.seqbox.open{background:var(--jade)}

/* sort */
.cards{display:grid;gap:8px}
.bc{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:52px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;line-height:1.4}
.bc.sel{border-color:var(--gold-b);box-shadow:0 0 0 3px rgba(251,191,36,.45)}
.lab{margin-left:auto;font-size:.72rem;font-weight:900;padding:2px 8px;border-radius:999px;white-space:nowrap}
.lab.b0{background:var(--bad-t);color:var(--verm-d)} .lab.b1{background:var(--pink-t);color:var(--pink)} .lab.b2{background:var(--sky-t);color:var(--sky)}
.lab.empty{border:1.5px dashed var(--line);color:var(--soft)}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.bin{min-height:58px;border-radius:12px;border:none;cursor:pointer;font-weight:800;line-height:1.25;padding:6px;font-size:.88rem}
.bin.b0{background:var(--bad-t);color:var(--verm-d)} .bin.b1{background:var(--pink-t);color:var(--pink)} .bin.b2{background:var(--sky-t);color:var(--sky)}
.bin:disabled{opacity:.45;cursor:default}
.bin small{display:block;font-size:.7rem;opacity:.8}

/* hints */
.hints{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.hints .hl{font-size:.74rem;font-weight:800;color:var(--soft);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.tier{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:68px;padding:6px 4px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-weight:800;font-size:.78rem;line-height:1.25;text-align:center}
.tier .tn{font-size:.66rem;font-weight:900;letter-spacing:.06em}
.tier.t1 .tn{color:var(--gold)} .tier.t2 .tn{color:var(--sky)} .tier.t3 .tn{color:var(--jade)}
.tier.next{border-color:var(--gold-b);box-shadow:0 0 0 3px rgba(251,191,36,.3)}
.tier.used{background:var(--parch2);opacity:.7}
.tier:disabled{cursor:default}
.tier:not(.used):not(.next){opacity:.5}
.tier.locked{background:repeating-linear-gradient(45deg,#f5f5f4 0 6px,#e7e5e4 6px 12px);opacity:.7}
.hint{background:var(--parch2);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.92rem}
.hint .lv{font-weight:900;color:var(--gold);font-size:.74rem;display:block}
.quote{display:block;margin-top:6px;padding:8px 10px;background:#fff;border-radius:10px;font-style:italic;font-family:'Lora',serif;border-left:4px solid var(--gold)}

/* nav */
.nav2{display:flex;gap:10px;margin:20px 0 4px}
.nav2 .btn{flex:1}
.nav2 .en{display:none}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#1c1917;border-top:2px solid rgba(251,191,36,.5);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
.tab{position:relative;height:62px;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#a8a29e;font-weight:800;font-size:.7rem;line-height:1.1}
.tab .tn{height:22px;display:flex;align-items:center;font-size:1rem;font-weight:900}
.tab.on{color:var(--gold-b)}
.tab.on::before{content:"";position:absolute;top:0;left:20%;right:20%;height:3px;background:var(--gold-b);border-radius:0 0 3px 3px}
.tab.done .tn{color:#34d399}
.tab:disabled{opacity:.35;cursor:not-allowed}

/* codex drawer, sheet, modal */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:none}
.mask.show{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(92vw,460px);z-index:92;background:var(--parch);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.show{transform:none}
.dhead{background:linear-gradient(90deg,#450a0a,#1c1917);color:var(--gold-t);padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--gold-b)}
.dhead b{font-family:'Cinzel','Noto Sans TC',serif;color:var(--gold-b)}
.dhead .x{margin-left:auto;background:none;border:none;color:var(--gold-t);cursor:pointer;min-width:40px;min-height:40px}
.dtabs{display:flex;gap:4px;padding:8px 10px 0;background:var(--parch2);border-bottom:1px solid var(--gold)}
.dtabs button{flex:1;min-height:42px;border:none;border-radius:10px 10px 0 0;background:transparent;cursor:pointer;font-weight:800;font-size:.82rem;color:var(--soft)}
.dtabs button.on{background:#fff;color:var(--verm-d);border:1px solid var(--gold);border-bottom:none}
.dbody{flex:1;overflow:auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));background:#fff;font-size:.94rem}
.vgrid{display:grid;gap:8px;margin-top:10px}
.vcard{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--parch)}
.vcard b{color:var(--verm-d)} .vcard i{color:var(--gold);font-size:.82rem;margin-left:4px}
table.cmp{width:100%;border-collapse:collapse;font-size:.88rem}
table.cmp th{background:var(--verm-d);color:var(--gold-t);text-align:left;padding:8px}
table.cmp td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top}
table.cmp td:first-child{font-weight:800;color:var(--verm-d)}
.gram{border-left:4px solid var(--verm);background:var(--parch);border-radius:0 12px 12px 0;padding:10px 12px;margin-bottom:12px}
.formula{background:#1c1917;color:var(--gold-b);font-family:ui-monospace,Menlo,monospace;border-radius:8px;padding:8px 10px;font-size:.85rem;margin:6px 0}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--parch);border-radius:22px 22px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto;transform:translateY(105%);transition:transform .25s}
.sheet.show{transform:none}
.seg{display:flex;background:var(--parch2);border-radius:999px;padding:4px;gap:4px;margin:6px 0 14px}
.seg button{flex:1;min-height:42px;border:none;border-radius:999px;background:transparent;cursor:pointer;font-weight:800;font-size:.88rem}
.seg button.on{background:var(--verm);color:var(--gold-t)}

  {id:'a1f',type:'fill',title:['字彙熱身','Word warm-up'],q:'Complete the envoy’s notes with the right words.',
   bank:['pilgrimage','authorities','cast','devotion','unify','pavement','explosive'],
   blanks:[
    {id:'a1f1',pre:'Every year, thousands of believers join the ',post:' to honor Mazu.',ans:'pilgrimage',src:'The annual pilgrimage, which honors the sea goddess Mazu…',fb:['要一個名詞：「為了宗教目的的旅程」。','You need a noun: a journey for religious reasons.']},
    {id:'a1f2',pre:'Temple ',post:' decide when the journey will begin.',ans:'authorities',src:'During the Lantern Festival, temple authorities cast…',fb:['誰有權力做決定？要一個複數名詞。','Who has the power to decide? Use a plural noun.']},
    {id:'a1f3',pre:'They ',post:' two wooden blocks to ask for Mazu’s answer.',ans:'cast',src:'…cast two half-moon-shaped wooden blocks…',fb:['「擲」筊的動作是哪個動詞？','Which verb means "throw for a special purpose"?']},
    {id:'a1f4',pre:'Walking for nine days shows the pilgrims’ deep ',post:'.',ans:'devotion',src:'(Act 2) …thousands of believers in deep devotion…',fb:['deep 後面接名詞，意思是「虔誠」。','After "deep," use a noun meaning strong religious love.']},
    {id:'a1f5',pre:'The festival helps ',post:' people from many different towns.',ans:'unify',src:'(Title) A Great Pilgrimage That Unifies the People',fb:['helps 後面接原形動詞，意思是「使團結」。','After "helps," use a base verb meaning "bring together."']}
   ],
   hints:[{t:['先判斷空格要名詞還是動詞，看空格前後的字。','Decide whether each blank needs a noun or a verb.']},{t:['第一個還沒填對的空格，看這句：','For the first blank you haven’t got right, read this:'],quote:true},{t:['幫你揭曉一格。','One blank will be filled in for you.'],act:'reveal'}]},
  {id:'a1m',type:'mc',title:['閱讀理解','Comprehension'],q:'Who decides the exact departure schedule, and how?',
   opts:['Government officials choose a date on the solar calendar.','Each pilgrim casts wooden blocks to choose a destination.','Temple authorities cast wooden blocks during the Lantern Festival.','The journey always starts on the night of Mazu’s birthday.'],ans:2,
   fb:{0:['課文說的是「廟方」和「農曆」，不是政府和國曆。','The text talks about temple authorities and the lunar calendar, not the government.'],1:['擲筊的是廟方，不是每位信徒；而且是決定出發時間，不是目的地。','The temple authorities cast the blocks, and they decide the schedule, not the destination.'],3:['課文說是在媽祖生日「前後」出發，確切時間要靠擲筊決定。','It sets out around her birthday; the exact time is decided by casting the blocks.']},
   ok:['正確！元宵節由廟方擲筊，決定出發的確切時辰。','Correct! On the Lantern Festival, the temple authorities cast the blocks to set the exact time.'],
   hints:[{t:['找課文第二句，看「誰」在「什麼時候」做什麼。','Look at the second sentence: who does what, and when?']},{t:['讀這句：','Read this:'],quote:'During the Lantern Festival, temple authorities cast two half-moon-shaped wooden blocks to decide the exact departure schedule.'},{t:['刪去兩個錯誤選項。','Two wrong options are removed.'],act:'elim',keep:[2,3]}]},
  {id:'a1o',type:'order',title:['時間排序','Timeline'],q:'Put the events in the correct order.',
   steps:['The Lantern Festival arrives.','Temple authorities cast the wooden blocks.','The departure schedule is announced.','Pilgrims set out around Mazu’s birthday.','The journey ends after nine days and eight nights.'],
   fb:['再想想：日期是先「擲筊決定」，才「公布」，然後才「出發」。','Think again: the date is decided first, then announced, and only then do pilgrims set out.'],
   ok:['順序完全正確！元宵擲筊 → 公布 → 出發 → 九天八夜後結束。','Perfect order! Lantern Festival → cast blocks → announce → set out → end after 9 days.'],
   hints:[{t:['第一件事和最後一件事最好找，先放這兩個。','Start with the first and the last events.']},{t:['讀這兩句：','Read these:'],quote:'During the Lantern Festival, temple authorities cast two half-moon-shaped wooden blocks… The journey lasts nine days and eight nights…'},{t:['幫你放好前兩步。','The first two steps will be placed for you.'],act:'place2'}]}
 ]},
{n:2,emb:'icon-sedan',title:['雙線進香','Twin Pilgrimages'],skill:['比較與對照','Compare & Contrast'],
 goal:['分清楚大甲與白沙屯兩大進香的不同。','Tell the Dajia and Baishatun pilgrimages apart.'],
 guide:['很多遊客會把大甲和白沙屯搞混！需要的話，打開右上角的 Field Codex 看比較表。','Many visitors mix up Dajia and Baishatun! Open the Field Codex (top right) to check the comparison chart.'],
 scroll:['Although both events ',['w','unify'],' thousands of believers in deep ',['w','devotion'],', the Dajia pilgrimage follows a ',['c','fixed nine-day, eight-night'],' route to Xingang, ',['c','whereas'],' Baishatun Mazu travels in a ',['c','pink sedan chair'],' with no fixed route or duration.'],
 items:[
  {id:'a2s',type:'sort',title:['特徵分類','Sort the facts'],q:'Is each fact about Dajia, Baishatun, or both?',
   bins:[['大甲','Dajia'],['白沙屯','Baishatun'],['兩者皆是','Both']],
   cards:[['a2s1','Starts at Zhenlan Temple',0],['a2s2','Mazu rides in a pink sedan chair',1],['a2s3','Honors the sea goddess Mazu',2],
          ['a2s4','Always lasts nine days and eight nights',0],['a2s5','Has no fixed route or duration',1],['a2s6','Takes place in the third lunar month',2],
          ['a2s7','Goes to Fengtian Temple in Xingang',0],['a2s8','Starts at Gongtian Temple in Miaoli',1],['a2s9','Unifies thousands of believers',2]],
   hints:[{t:['大甲 = 固定行程；白沙屯 = 粉紅轎、不固定。','Dajia = fixed schedule; Baishatun = pink sedan chair, nothing fixed.']},{t:['每一類剛好 3 張。「兩者皆是」是兩個進香共同的特點。','Each group has exactly 3 cards. "Both" means true for both pilgrimages.']},{t:['幫你放對一張卡。','One card will be placed for you.'],act:'reveal'}]},
  {id:'a2m',type:'mc',title:['對照句','Contrast sentence'],q:'Which sentence compares the two pilgrimages correctly?',
   opts:['Dajia Mazu rides in a pink sedan chair, whereas Baishatun has a fixed route.','Both pilgrimages last nine days, whereas only Dajia starts in Miaoli.','The Baishatun route ends in Xingang, whereas the Dajia route ends in Beigang.','The Dajia route is fixed, whereas Baishatun Mazu has no fixed route or time.'],ans:3,
   fb:{0:['兩邊對調了！粉紅轎是白沙屯，固定路線是大甲。','You swapped them! The pink sedan chair is Baishatun; the fixed route is Dajia.'],1:['只有大甲是九天八夜；而且白沙屯才是從苗栗出發。','Only Dajia lasts nine days, and Baishatun is the one from Miaoli.'],2:['終點對調了：大甲到新港，白沙屯到北港。','The endpoints are swapped: Dajia goes to Xingang; Baishatun goes to Beigang.']},
   ok:['正確！whereas 用來對比兩件不同的事。','Correct! "Whereas" shows a contrast between two different things.'],
   hints:[{t:['看課文裡 whereas 前後各在講哪一個進香。','Check which pilgrimage comes before and after "whereas" in the scroll.']},{t:['讀這句：','Read this:'],quote:'the Dajia pilgrimage follows a fixed nine-day, eight-night route to Xingang, whereas Baishatun Mazu travels in a pink sedan chair with no fixed route or duration.'},{t:['刪去兩個錯誤選項。','Two wrong options are removed.'],act:'elim',keep:[0,3]}]},
  {id:'a2v',type:'mc',title:['字義推論','Word in context'],q:'In the scroll, "unify" is closest in meaning to ____.',
   opts:['separate','bring together','entertain','protect'],ans:1,
   fb:{0:['相反了！separate 是「分開」。','That’s the opposite! "Separate" means to split apart.'],2:['進香不只是娛樂，unify 是讓人「團結在一起」。','It’s not about fun. "Unify" means making people one group.'],3:['protect 是「保護」，課文說的是把信徒「聚在一起」。','"Protect" means keep safe. The text is about bringing believers together.']},
   ok:['沒錯！unify = bring together，課名就是 A Great Pilgrimage That Unifies the People。','Right! Unify = bring together, just like the title says.'],
   hints:[{t:['想想課名：A Great Pilgrimage That Unifies the People。','Think about the lesson title.']},{t:['讀這句：','Read this:'],quote:'Although both events unify thousands of believers in deep devotion…'},{t:['刪去兩個錯誤選項。','Two wrong options are removed.'],act:'elim',keep:[0,1]}]}
 ]},

 guide:['從這一幕開始，每用一次提示都會扣 1 分。倒裝句的公式在 Field Codex 第 3 頁。','From now on, every hint costs 1 point. The inversion formula is on page 3 of the Field Codex.'],
 scroll:['When Mazu’s statue ',['w','emerges'],', ',['w','explosive'],' sounds of drums and firecrackers ',['w','pierce'],' the air. Believers ',['w','kneel'],' on the ',['w','pavement'],' for her ',['w','blessing'],', while locals offer free food, washing ',['w','facilities'],', and ',['w','accommodations'],'. ',['c','Rarely'],' can such ',['w','hospitality'],' be seen, and ',['c','never'],' do the pilgrims’ passion and dedication fade.'],
 items:[
  {id:'a3f',type:'fill',title:['場景字彙','Scene words'],q:'Complete the description of the scene.',
   bank:['emerges','pierces','kneel','hospitality','designated','heritage'],
   blanks:[
    {id:'a3f1',pre:'When Mazu’s statue ',post:' from the temple, the crowd cheers.',ans:'emerges',src:'When Mazu’s statue emerges, explosive sounds…',fb:['statue 是單數，要用加 -s 的動詞「出現」。','"Statue" is singular, so use the -s verb meaning "come out."']},
    {id:'a3f2',pre:'The sound of firecrackers ',post:' the quiet night air.',ans:'pierces',src:'…sounds of drums and firecrackers pierce the air.',fb:['聲音「劃破」空氣；sound 是單數，動詞加 -s。','A sound "cuts through" the air. "Sound" is singular, so add -s.']},
    {id:'a3f3',pre:'Many believers ',post:' on the road to receive her blessing.',ans:'kneel',src:'Believers kneel on the pavement for her blessing…',fb:['信徒在路上「跪下」；believers 是複數，用原形。','Believers go down on their knees. "Believers" is plural.']},
    {id:'a3f4',pre:'Local families show warm ',post:' by offering free food and drinks.',ans:'hospitality',src:'Rarely can such hospitality be seen…',fb:['warm 後面接名詞「熱情款待」。','After "warm," use the noun meaning friendly treatment of guests.']}
   ],
   hints:[{t:['注意主詞單複數：單數主詞的動詞要加 -s。','Check singular and plural subjects: a singular subject needs a verb with -s.']},{t:['第一個還沒填對的空格，看這句：','For the first blank you haven’t got right, read this:'],quote:true},{t:['幫你揭曉一格。','One blank will be filled in for you.'],act:'reveal'}]},
  {id:'a3m',type:'mc',title:['倒裝判斷','Spot the inversion'],q:'Which sentence uses inversion correctly?',
   opts:['Rarely such generosity can be seen during a religious event.','Rarely can such generosity be seen during a religious event.','Rarely can such generosity is seen during a religious event.','Rarely does such generosity can be seen during a religious event.'],ans:1,
   fb:{0:['Rarely 放句首時，助動詞 can 要移到主詞前面。','When "Rarely" starts the sentence, "can" must move before the subject.'],2:['can 後面要接原形：can be seen，不是 can is seen。','After "can," use the base form: "can be seen."'],3:['一個子句只要一個助動詞，does 和 can 不能同時出現。','Use only one helping verb. "Does" and "can" can’t both be there.']},
   ok:['正確！Rarely + can + 主詞 + be seen。','Correct! Rarely + can + subject + be seen.'],
   hints:[{t:['公式：否定副詞 + 助動詞 + 主詞 + 原形動詞。','Formula: negative adverb + helping verb + subject + base verb.']},{t:['課文例句：','From the scroll:'],quote:'Rarely can such hospitality be seen'},{t:['刪去兩個錯誤選項。','Two wrong options are removed.'],act:'elim',keep:[1,2]}]},
  {id:'a3l',type:'lock',title:['句型鎖','Syntax lock'],q:'Build the sentence: the pilgrims’ passion and dedication never fade.',
   tiles:['fade.','Never','does','the pilgrims’ passion and dedication','do','fades.'],
   ans:['Never','do','the pilgrims’ passion and dedication','fade.'],
   ok:['解鎖！passion and dedication 是複數，用 do；助動詞後面接原形 fade。','Unlocked! "Passion and dedication" is plural, so use "do," and the verb after it stays "fade."'],
   hints:[{t:['Never 放句首 → 助動詞要移到主詞前面。','"Never" first, then the helping verb, then the subject.']},{t:['課文例句：','From the scroll:'],quote:'never do the pilgrims’ passion and dedication fade'},{t:['幫你放好前兩塊。','The first two pieces will be placed for you.'],act:'place2'}]},
  {id:'a3t',type:'mc',title:['句子改寫','Rewrite'],q:'Rewrite with inversion: "Pilgrims seldom complain about the long walk."',
   opts:['Seldom pilgrims complain about the long walk.','Seldom do pilgrims complained about the long walk.','Seldom do pilgrims complain about the long walk.','Seldom are pilgrims complain about the long walk.'],ans:2,
   fb:{0:['少了助動詞！Seldom 開頭要加 do。','The helping verb is missing! Add "do" after "Seldom."'],1:['do 後面要接原形 complain，不能用過去式。','After "do," use the base form "complain."'],3:['complain 是一般動詞，助動詞要用 do，不是 are。','"Complain" is an action verb, so the helper is "do," not "are."']},
   ok:['完美！Seldom + do + 主詞 + 原形動詞。','Perfect! Seldom + do + subject + base verb.'],
   hints:[{t:['原句是現在式一般動詞 → 助動詞用 do / does。','The original uses a present action verb, so the helper is do/does.']},{t:['對照這個公式：','Compare with this:'],quote:'Never do their passion and dedication fade.'},{t:['刪去兩個錯誤選項。','Two wrong options are removed.'],act:'elim',keep:[0,2]}]}
 ]},
{n:4,emb:'icon-mazu',title:['活的文化遺產','Living Cultural Heritage'],skill:['強調句與作者目的','Emphasis & Purpose'],fade:true,
 goal:['看懂 It is no exaggeration to say that…，判斷作者的寫作目的。','Understand "It is no exaggeration to say that…" and the author’s purpose.'],
 guide:['你已經走了很遠！從這一幕開始，第 3 層提示會關閉，要靠自己判斷了。','You’ve come a long way! From this Act, Tier 3 hints are locked. Trust your own reading.'],
 scroll:['Over the years, the Mazu pilgrimage has become more than just a ',['w','religious'],' ',['w','ritual'],'. It attracts all kinds of people, young and old, foreign and Taiwanese, and it has been ',['c','designated'],' an important national folk custom. ',['c','Undoubtedly'],', ',['c','it is no exaggeration to say that'],' joining this event is a great way to experience Taiwan’s cultural ',['w','heritage'],'.'],
 items:[
  {id:'a4m',type:'mc',title:['句型意義','Pattern meaning'],q:'What does "It is no exaggeration to say that…" mean?',
   opts:['It is too much to say that…','It is hard to believe that…','It is unfair to say that…','It is completely true to say that…'],ans:3,
   fb:{0:['相反了！no exaggeration =「一點也不誇張」。','The opposite! "No exaggeration" means it is not overstated at all.'],1:['作者不是在懷疑，而是在強調這件事「千真萬確」。','The author isn’t doubting; it stresses that something is really true.'],2:['句型沒有「不公平」的意思。','The pattern has nothing to do with being unfair.']},
   ok:['正確！說…一點也不誇張 = 完全是真的。','Correct! Saying it is no exaggeration means it is completely true.'],
   hints:[{t:['拆開看：no + exaggeration（誇大）。','Break it down: no + exaggeration.']},{t:['課文中的用法：','How the scroll uses it:'],quote:'Undoubtedly, it is no exaggeration to say that joining this event is a great way to experience Taiwan’s cultural heritage.'}]},
  {id:'a4s',type:'mc',title:['同義改寫','Same meaning'],q:'Which sentence means the SAME as: "It is no exaggeration to say that this event might be the world’s largest birthday party."',
   opts:['It is not too much to say that this event might be the world’s largest birthday party.','It is an exaggeration to say that this event might be the world’s largest birthday party.','It is no exaggeration saying what this event might be the world’s largest birthday party.','It is not enough to say that this event might be the world’s largest birthday party.'],ans:0,
   fb:{1:['拿掉 no 意思就完全相反了。','Removing "no" reverses the meaning.'],2:['句型固定是 to say that，不是 saying what。','The fixed pattern is "to say that," not "saying what."'],3:['not enough（不夠）和 not too much（不過分）意思不同。','"Not enough" is different from "not too much."']},
   ok:['沒錯！It is not too much to say that… = It is no exaggeration to say that…','Right! "It is not too much to say that…" has the same meaning.'],
   hints:[{t:['找「一點也不過分」的說法。','Look for the phrase meaning "not overstated."']},{t:['Field Codex 第 3 頁有寫：','From the Field Codex:'],quote:'It is no exaggeration to say that + S + V = It is not too much to say that + S + V'}]},
  {id:'a4p',type:'mc',title:['作者目的','Author’s purpose'],q:'Why does the author mention that the pilgrimage has been "designated an important national folk custom"?',
   opts:['To show that the event is too crowded for tourists.','To show that the event is officially recognized as important.','To argue that the government controls the ritual.','To explain why the route changes every year.'],ans:1,
   fb:{0:['課文沒有說人太多，反而說各種人都來參加。','The text never complains about crowds; it says all kinds of people join.'],2:['designate 是「正式指定」，不代表政府控制儀式。','"Designate" means to give an official title, not to control.'],3:['課文這段沒有談路線變化。','This part doesn’t talk about the route.']},
   ok:['正確！被正式指定，代表它的文化價值受到肯定。','Correct! Being officially designated shows its cultural value is recognized.'],
   hints:[{t:['先想 designate 的意思（點課文裡的字）。','First check what "designate" means (tap it in the scroll).']},{t:['讀這句：','Read this:'],quote:'it has been designated an important national folk custom.'}]}
 ]},
{n:5,emb:'icon-sdgs',title:['SDGs 綠色進香','SDGs Eco-Pilgrimage'],skill:['SDGs 行動方案','SDGs Action Plan'],fade:true,
 goal:['提出兼顧傳統與環境的方案，並用本課句型寫下你的提案。','Propose a plan that protects both tradition and the environment, and write it with a lesson pattern.'],
 guide:['最後一站！我們要怎麼同時守護媽祖的文化，又守護大家呼吸的空氣？','Final stop! How can we protect Mazu’s culture and the air we breathe at the same time?'],
 scroll:['While ',['w','throngs'],' of pilgrims celebrate with ',['w','explosive'],' firecrackers and generous free meals, air-quality monitoring has found that PM2.5 levels can rise to unhealthy levels during the pilgrimage, and single-use tableware creates huge amounts of waste. A good plan must protect public health and the environment while keeping the festival’s ',['c','devotion'],' and ',['c','hospitality'],' alive.'],
 items:[
  {id:'a5s',type:'sort',title:['方案評估','Rate the ideas'],q:'Sort each idea: does it balance both, hurt tradition, or hurt the environment?',
   bins:[['兩全其美','Balanced'],['傷害傳統','Hurts tradition'],['傷害環境','Hurts environment']],
   cards:[['a5s1','Use digital firecracker sound effects',0],['a5s2','Ban all free food along the route',1],['a5s3','Hand out more plastic water bottles',2],
          ['a5s4','Offer reusable bowls at food stations',0],['a5s5','Cancel the pilgrimage every other year',1],['a5s6','Set off twice as many firecrackers',2],
          ['a5s7','Burn fewer, eco-friendly incense sticks',0],['a5s8','Stop believers from kneeling for blessings',1],['a5s9','Use disposable plates at every stop',2]],
   hints:[{t:['好方案要同時保留 devotion 和 hospitality，又減少空污和垃圾。','A good idea keeps devotion and hospitality and also cuts pollution and waste.']},{t:['每一類剛好 3 張。','Each group has exactly 3 cards.']}]},
  {id:'a5m',type:'mc',title:['最佳方案','Best plan'],q:'Which plan best balances tradition and the environment?',
   opts:['Keep all the firecrackers but ask pilgrims to wear masks.','Switch to paper cups and plates so the waste can be recycled.','Replace most firecrackers with digital sound effects and set up reusable tableware stations.','Let only temple staff walk the route to reduce the crowds.'],ans:2,
   fb:{0:['口罩只保護個人，空氣還是被污染了。','Masks protect people a little, but the air is still polluted.'],1:['紙杯紙盤還是一次性用品，垃圾沒有變少。','Paper cups and plates are still single-use, so waste stays high.'],3:['這樣就失去「團結眾人」的意義，傷害了傳統。','That loses the spirit of unifying people and hurts the tradition.']},
   ok:['很棒的 SDGs 方案！保留熱鬧與款待，同時減少 PM2.5 和垃圾。','Great SDGs thinking! It keeps the festive spirit and hospitality while cutting PM2.5 and waste.'],
   hints:[{t:['想一想：哪一個同時處理「空污」和「垃圾」？','Which plan deals with both air pollution and waste?']},{t:['回到課文最後一句：','Go back to the last sentence:'],quote:'A good plan must protect public health and the environment while keeping the festival’s devotion and hospitality alive.'}]},
  {id:'a5w',type:'write',title:['寫下你的提案','Write your plan'],q:'Write ONE sentence for your eco-pilgrimage plan. Use "It is no exaggeration to say that…" OR start with Never / Rarely / Seldom + helping verb.',
   ex:'It is no exaggeration to say that reusable bowls can keep the festival’s hospitality alive.',
   hints:[{t:['選一個句型：It is no exaggeration to say that + S + V，或 Rarely/Never/Seldom + 助動詞 + S + V。','Pick one pattern: "It is no exaggeration to say that + S + V," or "Rarely/Never/Seldom + helper + S + V."']},{t:['範例：','Example:'],quote:'Rarely can a festival be so lively and so green at the same time.'}]}
 ]}
];
const ITEM={},QOWN={},ACT_Q={};
ACTS.forEach(a=>{ACT_Q[a.n]=[];a.items.forEach(it=>{it.act=a.n;ITEM[it.id]=it;
  if(it.type==='fill'){it.blanks.forEach(b=>{QOWN[b.id]=it.id;ACT_Q[a.n].push(b.id);});}
  else if(it.type==='sort'){it.cards.forEach(c=>{QOWN[c[0]]=it.id;ACT_Q[a.n].push(c[0]);});}
  else {QOWN[it.id]=it.id;ACT_Q[a.n].push(it.id);}
});});
function qLabel(qid){const it=ITEM[QOWN[qid]];const a=it.act;

/* 提示 */
function hintUI(it){const id=it.id;if(isItemOk(it))return '';const a=ACTS[it.act-1];const lv=hlv(id);const cost=it.act>=3;
 const tiers=[[ 'TIER 1',['方向','Where'] ],[ 'TIER 2',['原句','Quote'] ],[ 'TIER 3',['排除','Clear'] ]];
 let btns='';tiers.forEach((t,i)=>{const locked=i===2&&(a.fade||!it.hints[2]);const used=i<lv;const next=i===lv&&!locked;
  btns+=`<button class="tier t${i+1} ${used?'used':''} ${next?'next':''} ${locked?'locked':''}" data-hint="${id}" ${next?'':'disabled'}><span class="tn">${t[0]}</span><span>${esc(locked?S('已關閉','Locked'):(state.lang==='en'?t[1][1]:t[1][0]))}</span>${locked?ic('lock'):''}</button>`;});
 let out='';for(let i=0;i<lv;i++){const H=it.hints[i];let qt='';if(H.quote){const t=typeof H.quote==='string'?H.quote:currentSrc(it);if(t)qt=`<span class="quote" lang="en">${esc(t)}</span>`;}
  out+=`<div class="hint"><span class="lv">TIER ${i+1}</span>${TP(H.t)}${qt}</div>`;}
 return `<div class="hints"><div class="hl"><span>${T('三層提示','3-tier hints',true)}</span><span>${cost?esc(S('每次 −1 分','−1 point each')):esc(S('第 1–2 幕免費','Free in Acts 1–2'))}</span></div><div class="tiers">${btns}</div>${out}</div>`;}
function currentSrc(it){if(it.type==='fill'){const b=it.blanks.find(x=>!isOk(x.id));return b?b.src:'';}return '';}
function isItemOk(it){if(it.type==='fill')return it.blanks.every(b=>isOk(b.id));if(it.type==='sort')return it.cards.every(c=>isOk(c[0]));return isOk(it.id);}
function qHead(it,num){return `<div class="qh"><span class="qn num">${num}</span><div class="qt"><span class="qtype">${TP(it.title,true).replace(/<span class="en in"/,'<span class="en in" style="display:none"')}</span><span lang="en">${esc(it.q)}</span></div></div>`;}

/* ---------------- 題型 ---------------- */
function rMC(it,num){const ok=isOk(it.id);const w=state.w[it.id]||(state.w[it.id]={wrong:[],last:null});
 const elim=it.hints[2]&&it.hints[2].act==='elim'&&hlv(it.id)>=3?it.hints[2].keep:null;
 const opts=it.opts.map((o,i)=>{let c='opt',dis=ok;if(ok&&i===it.ans)c+=' good';if(w.wrong.includes(i)){c+=' bad';dis=true;}if(elim&&!elim.includes(i)&&!ok){c+=' out';dis=true;}
  return `<button class="${c}" data-mc="${it.id}" data-i="${i}" ${dis?'disabled':''}><span class="k">${'ABCD'[i]}</span><span lang="en">${esc(o)}</span></button>`;}).join('');
 let fb='';if(ok)fb=`<div class="fb good"><b>${ic('check')}${T('正確','Correct',true)}</b><br>${TP(it.ok)}</div>`;else if(w.last!==null&&it.fb[w.last])fb=`<div class="fb bad"><b>${ic('x')}${T('再想想','Not quite',true)}</b><br>${TP(it.fb[w.last])}</div>`;
 return `<div class="q ${ok?'ok':''}" id="q-${it.id}">${qHead(it,num)}<div class="opts">${opts}</div>${fb}${hintUI(it)}</div>`;}
function rFill(it,num){const w=state.w[it.id]||(state.w[it.id]={fill:{},sel:null,wrongIds:[]});const done=isItemOk(it);
 if(!done&&(!w.sel||isOk(w.sel))){const f=it.blanks.find(b=>!isOk(b.id)&&!w.fill[b.id]);w.sel=f?f.id:null;}
 const used=Object.values(w.fill);
 const sents=it.blanks.map((b,i)=>{const ok=isOk(b.id);const v=ok?b.ans:w.fill[b.id];return `<p class="sent" lang="en"><b class="num" style="color:var(--verm)">${i+1}.</b> ${esc(b.pre)}<button class="blank${ok?' right':v?' filled':''}${w.sel===b.id&&!ok?' act':''}" data-blank="${it.id}|${b.id}" ${ok?'disabled':''}>${v?esc(v):'?'}</button>${esc(b.post)}</p>`;}).join('');
 const chips=it.bank.map(x=>{const u=used.includes(x)||it.blanks.some(b=>isOk(b.id)&&b.ans===x);return `<button class="chip" data-chip="${it.id}|${esc(x)}" ${u||done?'disabled':''} lang="en">${esc(x)}</button>`;}).join('');
 const all=it.blanks.every(b=>isOk(b.id)||w.fill[b.id]);
 const fbs=w.wrongIds.filter(id=>!isOk(id)).map(id=>{const b=it.blanks.find(x=>x.id===id);const i=it.blanks.indexOf(b)+1;return `<div class="fb bad"><b>${ic('x')}${T('第'+i+'格','Blank '+i,true)}</b><br>${TP(b.fb)}</div>`;}).join('');
 return `<div class="q ${done?'ok':''}" id="q-${it.id}">${qHead(it,num)}${sents}
  ${done?`<div class="fb good"><b>${ic('check')}${T('全部正確','All correct',true)}</b></div>`:`<div class="subh">${T('點空格，再點單字。有 2 個字用不到。','Tap a blank, then a word. Two words are extra.')}</div><div class="chips">${chips}</div>
  <button class="btn block" style="margin-top:12px" data-check="${it.id}" ${all?'':'disabled'}>${ic('check')}${T('檢查','Check',true)}</button>`}${fbs}${hintUI(it)}</div>`;}
function rOrder(it,num){const ok=isOk(it.id);const w=state.w[it.id]||(state.w[it.id]={seq:[],last:null,shuf:shuffleIdx(it.steps.length,it.id)});
 const seq=ok?it.steps.map((_,i)=>i):w.seq;
 const slots=seq.length?seq.map((si,k)=>`<button class="tile" data-oslot="${it.id}|${k}" ${ok?'disabled':''} lang="en"><span class="n">${k+1}</span>${esc(it.steps[si])}</button>`).join(''):`<span class="ph">${T('依序點下方事件','Tap the events below in order',true)}</span>`;
 const tiles=w.shuf.map(i=>`<button class="tile" data-otile="${it.id}|${i}" ${seq.includes(i)||ok?'disabled':''} lang="en">${esc(it.steps[i])}</button>`).join('');
 let fb='';if(ok)fb=`<div class="fb good"><b>${ic('check')}${T('正確','Correct',true)}</b><br>${TP(it.ok)}</div>`;else if(w.last)fb=`<div class="fb bad"><b>${ic('x')}${T('順序不對','Wrong order',true)}</b><br>${TP(it.fb)}</div>`;
 return `<div class="q ${ok?'ok':''}" id="q-${it.id}">${qHead(it,num)}<div class="seqbox ${ok?'open':''}"><div class="lt">${ic(ok?'check':'book')} TIMELINE</div><div class="slots col">${slots}</div></div>
  ${ok?'':`<div class="tiles col">${tiles}</div><button class="btn block" style="margin-top:10px" data-check="${it.id}" ${seq.length===it.steps.length?'':'disabled'}>${ic('check')}${T('檢查順序','Check order',true)}</button>`}${fb}${hintUI(it)}</div>`;}
function shuffleIdx(n,seed){const a=[...Array(n).keys()];let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;for(let i=n-1;i>0;i--){h=(h*1103515245+12345)>>>0;const j=h%(i+1);[a[i],a[j]]=[a[j],a[i]];}if(a.every((v,i)=>v===i))a.reverse();return a;}
function rLock(it,num){const ok=isOk(it.id);const w=state.w[it.id]||(state.w[it.id]={seq:[],last:null});const seq=ok?it.ans.map(x=>it.tiles.indexOf(x)):w.seq;
 const slots=seq.length?seq.map((ti,k)=>`<button class="tile" data-lslot="${it.id}|${k}" ${ok?'disabled':''} lang="en">${esc(it.tiles[ti])}</button>`).join(''):`<span class="ph">${T('依序點下方字卡','Tap the pieces in order',true)}</span>`;
 const tiles=it.tiles.map((t,i)=>`<button class="tile" data-ltile="${it.id}|${i}" ${seq.includes(i)||ok?'disabled':''} lang="en">${esc(t)}</button>`).join('');
 let fb='';if(ok)fb=`<div class="fb good"><b>${ic('check')}${T('解鎖','Unlocked',true)}</b><br>${TP(it.ok)}</div>`;else if(w.last)fb=`<div class="fb bad"><b>${ic('x')}${T('鎖還沒開','Still locked',true)}</b><br>${TP(w.last)}</div>`;
 return `<div class="q ${ok?'ok':''}" id="q-${it.id}">${qHead(it,num)}<div class="seqbox ${ok?'open':''}"><div class="lt">${ic(ok?'check':'lock')} SYNTAX LOCK</div><div class="slots">${slots}</div></div>
  ${ok?'':`<div class="tiles">${tiles}</div><button class="btn block" style="margin-top:10px" data-check="${it.id}" ${seq.length?'':'disabled'}>${ic('lock')}${T('解鎖','Unlock',true)}</button>`}${fb}${hintUI(it)}</div>`;}
function rSort(it,num){const w=state.w[it.id]||(state.w[it.id]={bins:{},sel:null,res:null});const done=isItemOk(it);
 if(!done&&!w.sel){const nx=it.cards.find(c=>w.bins[c[0]]===undefined);w.sel=nx?nx[0]:null;}
 const cards=it.cards.map(c=>{const b=done?c[2]:w.bins[c[0]];return `<button class="bc ${w.sel===c[0]&&!done?'sel':''}" data-card="${it.id}|${c[0]}" ${done?'disabled':''}><span lang="en">${esc(c[1])}</span>${b!==undefined?`<span class="lab b${b}">${esc(state.lang==='en'?it.bins[b][1]:it.bins[b][0])}</span>`:`<span class="lab empty">${esc(S('未分類','Unsorted'))}</span>`}</button>`;}).join('');
 const cnt=k=>Object.values(w.bins).filter(v=>v===k).length;
 const bins=it.bins.map((b,k)=>`<button class="bin b${k}" data-bin="${it.id}|${k}" ${w.sel&&!done?'':'disabled'}>${esc(state.lang==='en'?b[1]:b[0])}${state.lang==='bi'?`<small lang="en">${esc(b[1])}</small>`:''}<small class="num">${cnt(k)}/3</small></button>`).join('');
 const all=it.cards.every(c=>w.bins[c[0]]!==undefined);
 let fb='';if(done)fb=`<div class="fb good"><b>${ic('check')}${T('分類全對','All sorted correctly',true)}</b></div>`;
 else if(w.res){fb=`<div class="fb bad"><b>${ic('x')}${T('還有卡片放錯','Some cards are wrong',true)}</b><br>${it.bins.map((b,k)=>w.res[k]?esc(S(b[0]+'：錯 '+w.res[k]+' 張',b[1]+': '+w.res[k]+' wrong')):'').filter(Boolean).join('　')}</div>`;}
 return `<div class="q ${done?'ok':''}" id="q-${it.id}">${qHead(it,num)}<div class="subh">${T('點卡片（黃框），再點下方分類。','Tap a card (gold frame), then a group below.')}</div><div class="cards">${cards}</div>
  ${done?'':`<div class="bins">${bins}</div><button class="btn block" style="margin-top:10px" data-check="${it.id}" ${all?'':'disabled'}>${ic('check')}${T('檢查分類','Check',true)}</button>`}${fb}${hintUI(it)}</div>`;}
function rWrite(it,num){const ok=isOk(it.id);const w=state.w[it.id]||(state.w[it.id]={txt:state.reflect||'',last:null});
 let fb='';if(ok)fb=`<div class="fb good"><b>${ic('check')}${T('提案已記錄','Plan recorded',true)}</b><br>${T('你的句子已送給老師。','Your sentence has been sent to your teacher.')}</div>`;else if(w.last)fb=`<div class="fb bad"><b>${ic('x')}${T('再修改一下','Revise a little',true)}</b><br>${TP(w.last)}</div>`;
 return `<div class="q ${ok?'ok':''}" id="q-${it.id}">${qHead(it,num)}<textarea id="wtxt" rows="3" lang="en" placeholder="${esc(it.ex)}" ${ok?'disabled':''}>${esc(w.txt)}</textarea>
  ${ok?'':`<button class="btn block" style="margin-top:10px" data-check="${it.id}">${ic('pen')}${T('送出提案','Submit',true)}</button>`}${fb}${hintUI(it)}</div>`;}
const RENDER={mc:rMC,fill:rFill,order:rOrder,lock:rLock,sort:rSort,write:rWrite};

 const ids=ACT_Q[n],first=ids.filter(id=>state.q[id].first).length;const sc=Math.max(0,Math.round(20*first/ids.length)-(state.hs[n]||0));
 state.score[n]=sc;state.done[n-1]=1;if(doneCount()===5&&!state.end)state.end=Date.now();say(n===5?'final':'done',n);save();
 queue(doneCount()===5?'final':'progress',n);sfx.win();
 const m=document.getElementById('modal');m.innerHTML=`<div class="amulet">${amulet(n,84)}</div><h2 class="disp" style="color:var(--verm-d);margin-top:6px">${T('獲得平安符','Amulet earned')}</h2>

 const vocab=VOCAB.filter(v=>!codexQ||v[0].includes(codexQ.toLowerCase())||v[3].includes(codexQ)).map(v=>`<div class="vcard"><b lang="en">${esc(v[0])}</b><i>${esc(v[1])}</i><div lang="en">${esc(v[2])}</div><div class="muted">${esc(v[3])}</div></div>`).join('');
 const body=codexTab==='vocab'?`<input id="vq" class="field" style="width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--gold);border-radius:12px" placeholder="${esc(S('搜尋單字…','Search words…'))}" value="${esc(codexQ)}"><div class="vgrid">${vocab||esc(S('找不到','No match'))}</div>`
  :codexTab==='routes'?`<table class="cmp"><tr><th></th><th>Dajia</th><th>Baishatun</th></tr><tr><td>Route</td><td>Zhenlan Temple (Dajia, Taichung) → Fengtian Temple (Xingang, Chiayi)</td><td>Gongtian Temple (Baishatun, Miaoli) → Chaotian Temple (Beigang, Yunlin)</td></tr>

  :`<div class="gram"><b>1. Negative Adverb Inversion</b><div class="formula">Never / Rarely / Seldom / Hardly + aux. (do / does / did / can…) + S + base verb</div><div lang="en"><i>Never do their passion and dedication fade.</i><br><i>Rarely can such generosity be seen during a religious event.</i></div><div class="muted" style="margin-top:6px">${esc(S('否定副詞放句首 → 助動詞移到主詞前；用 do/does/did 時，後面動詞回到原形。','Negative adverb first → helper before the subject; after do/does/did, use the base verb.'))}</div></div>
   <div class="gram"><b>2. Emphatic Pattern</b><div class="formula">It is no exaggeration to say that + S + V<br>= It is not too much to say that + S + V</div><div lang="en"><i>It is no exaggeration to say that this event might be the world’s largest birthday party.</i></div></div>`;
 d.innerHTML=`<div class="dhead">${sym('icon-mazu',32,32)}<b>Field Codex</b><button class="x" data-act="closeAll" aria-label="close">${ic('x')}</button></div>
  <div class="dtabs">${[['vocab',S('22 單字','22 Words')],['routes',S('進香比較','Routes')],['grammar',S('句型','Grammar')]].map(([k,l])=>`<button class="${codexTab===k?'on':''}" data-ctab="${k}">${esc(l)}</button>`).join('')}</div><div class="dbody">${body}</div>`;
 if(!d.classList.contains('show'))show('drawer');
 const vq=document.getElementById('vq');if(vq)vq.addEventListener('input',e=>{codexQ=e.target.value;const pos=e.target.selectionStart;openCodex();const n=document.getElementById('vq');n.focus();n.setSelectionRange(pos,pos);});}

 sh.innerHTML=`<h3>${T('設定','Settings',true)}</h3><b>${T('語言','Language',true)}</b>${seg('lang',[['zh','中文'],['bi','雙語'],['en','English']])}<b>${T('字級','Text size',true)}</b>${seg('big',[[false,S('標準','Normal')],[true,S('放大','Large')]])}

document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.go!==undefined){sfx.clack();go(d.go);return;}

 if(d.ctab){codexTab=d.ctab;openCodex();return;}
 if(d.act==='mute'){state.mute=!state.mute;render();sfx.clack();return;}

 if(d.act==='reset'){const k={lang:state.lang,big:state.big,mute:state.mute};state=Object.assign(fresh(),k);hideAll();go('home');return;}
 if(d.act==='flush'){flush();return;}
 if(d.act==='copy'){const p=state.player;const txt=`[${GAME_ID}] ${p.cls}-${p.seat} ${p.name} | Merit ${totalScore()}/100 | Acts ${[1,2,3,4,5].map(k=>state.score[k]).join('/')} | Hints ${totalHints()} | Mistakes ${wrongCount()} | Time ${fmt(elapsed())} | ${rankOf(totalScore())[1]}`;
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{t.innerHTML=ic('check')+T('已複製','Copied',true);}).catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');t.innerHTML=ic('check')+T('已複製','Copied',true);}catch(x){}ta.remove();});return;}
 if(d.act==='closeVocab'){state.vocabOpen=null;render();return;}
 if(d.vocab){state.vocabOpen=state.vocabOpen===d.vocab?null:d.vocab;sfx.clack();render();return;}

 if(d.hint){const it=ITEM[d.hint];const lv=hlv(it.id);if(lv>=3)return;state.hl[it.id]=lv+1;if(lv===0)state.hl['clue'+it.act]=1;
  if(it.act>=3){state.hs[it.act]=(state.hs[it.act]||0)+1;}stam(-4);sfx.hint();
  if(lv+1===3){const w=state.w[it.id];
   if(it.hints[2].act==='reveal'&&it.type==='fill'){const b=it.blanks.find(x=>!isOk(x.id));if(b){const r=state.q[b.id]||(state.q[b.id]={t:0,w:0,first:null,ok:false});if(r.first===null)r.first=false;r.ok=true;delete w.fill[b.id];Object.keys(w.fill).forEach(k=>{if(w.fill[k]===b.ans)delete w.fill[k];});w.sel=null;}}
   if(it.hints[2].act==='reveal'&&it.type==='sort'){const c=it.cards.find(x=>w.bins[x[0]]!==x[2]);if(c){w.bins[c[0]]=c[2];w.sel=null;}}
   if(it.hints[2].act==='place2'){w.seq=it.type==='lock'?[it.tiles.indexOf(it.ans[0]),it.tiles.indexOf(it.ans[1])]:[0,1];w.last=null;}}
  render();checkAct(it.act);return;}

 if(d.mc){const it=ITEM[d.mc];const i=Number(d.i);const c=i===it.ans;attempt(it.id,c);const w=state.w[it.id];
  if(c){w.last=null;stam(2);sfx.right();say('right',it.act);}else{w.wrong.push(i);w.last=i;stam(-6);sfx.wrong();say('wrong',it.act);fx.push(`[data-mc="${it.id}"][data-i="${i}"]`);}
  render();checkAct(it.act);return;}
 if(d.blank){const [iid,bid]=d.blank.split('|');const w=state.w[iid];if(w.fill[bid])delete w.fill[bid];w.sel=bid;render();return;}
 if(d.chip){const [iid,word]=d.chip.split('|');const w=state.w[iid];if(!w.sel)return;w.fill[w.sel]=word;const it=ITEM[iid];const nx=it.blanks.find(b=>!isOk(b.id)&&!w.fill[b.id]);w.sel=nx?nx.id:null;sfx.clack();render();return;}
 if(d.card){const [iid,cid]=d.card.split('|');state.w[iid].sel=cid;render();return;}
 if(d.bin){const [iid,k]=d.bin.split('|');const w=state.w[iid];const it=ITEM[iid];if(!w.sel)return;w.bins[w.sel]=Number(k);w.res=null;const nx=it.cards.find(c=>w.bins[c[0]]===undefined);w.sel=nx?nx[0]:null;sfx.clack();render();return;}
 if(d.otile){const [iid,i]=d.otile.split('|');const w=state.w[iid];w.seq.push(Number(i));w.last=null;sfx.clack();render();return;}
 if(d.oslot){const [iid,k]=d.oslot.split('|');const w=state.w[iid];w.seq.splice(Number(k),1);render();return;}
 if(d.ltile){const [iid,i]=d.ltile.split('|');const w=state.w[iid];w.seq.push(Number(i));w.last=null;sfx.clack();render();return;}
 if(d.lslot){const [iid,k]=d.lslot.split('|');const w=state.w[iid];w.seq.splice(Number(k),1);render();return;}

 if(d.check){const it=ITEM[d.check];const w=state.w[it.id];let good=false;
  if(it.type==='fill'){w.wrongIds=[];it.blanks.forEach(b=>{if(isOk(b.id))return;const c=w.fill[b.id]===b.ans;attempt(b.id,c);if(!c){w.wrongIds.push(b.id);delete w.fill[b.id];}});w.sel=null;good=!w.wrongIds.length;}
  else if(it.type==='sort'){const res=[0,0,0];it.cards.forEach(c=>{const ok=w.bins[c[0]]===c[2];attempt(c[0],ok);state.q[c[0]].ok=ok;if(!ok)res[w.bins[c[0]]]++;});good=res.every(x=>!x);w.res=good?null:res;}
  else if(it.type==='order'){good=w.seq.every((v,i)=>v===i);attempt(it.id,good);w.last=good?null:1;if(!good)w.seq=[];}
  else if(it.type==='lock'){const b=w.seq.map(i=>it.tiles[i]);good=b.join('|')===it.ans.join('|');attempt(it.id,good);
   if(!good){w.last=b.includes('does')?['passion and dedication 是複數主詞，助動詞要用 do。','"Passion and dedication" is plural, so the helper is "do."']:b.includes('fades.')?['助動詞 do 後面要接原形 fade。','After "do," the verb stays "fade."']:b[0]!=='Never'?['倒裝句由 Never 開頭。','The sentence starts with "Never."']:b[1]!=='do'?['Never 後面先放助動詞，再放主詞。','After "Never," put the helper first, then the subject.']:['字卡還沒用完，或順序不對。','Some pieces are missing or out of order.'];w.seq=[];}}
  else if(it.type==='write'){const txt=(document.getElementById('wtxt').value||'').trim();w.txt=txt;const words=txt.split(/\s+/).filter(Boolean).length;
   const emph=/it is no exaggeration to say that\s+\S+/i.test(txt)||/it is not too much to say that\s+\S+/i.test(txt);
   const inv=/^(never|rarely|seldom|hardly)\s+(do|does|did|can|could|will|would|should|is|are|was|were|has|have|had)\s+\S+/i.test(txt);
   good=words>=8&&(emph||inv)&&/[.!]$/.test(txt);attempt(it.id,good);
   w.last=good?null:words<8?['句子太短了，至少寫 8 個字，說清楚你的方案。','Too short. Write at least 8 words to explain your plan.']:!(emph||inv)?['要用指定句型：It is no exaggeration to say that…，或 Never/Rarely/Seldom + 助動詞開頭。','Use one of the patterns: "It is no exaggeration to say that…" or start with Never/Rarely/Seldom + a helper.']:['句尾記得加句點。','Remember to end with a period.'];
   if(good){state.reflect=txt;queue('reflect');}}
  if(good){stam(3);sfx.right();say('right',it.act);}else{stam(-6);sfx.wrong();say('wrong',it.act);fx.push('#q-'+it.id);}
  render();checkAct(it.act);return;}
});
document.addEventListener('submit',e=>{if(e.target.id!=='joinForm')return;e.preventDefault();const c=document.getElementById('fCls').value.trim(),s=document.getElementById('fSeat').value.trim(),n=document.getElementById('fName').value.trim();
 if(!c||!s||!n){document.getElementById('regErr').hidden=false;sfx.wrong();return;}state.player={cls:c,seat:s,name:n};state.start=state.start||Date.now();save();queue('join');sfx.win();go(1);});
document.addEventListener('input',e=>{if(e.target.id==='wtxt'){const it=ITEM.a5w;(state.w[it.id]||(state.w[it.id]={txt:'',last:null})).txt=e.target.value;save();}});
document.getElementById('mask').addEventListener('click',()=>{if(document.getElementById('pgBox'))closeProcession();else{hideAll();render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('pgBox'))closeProcession();else hideAll();}});
render();flush();
</script>
