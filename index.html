<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gina 的英文闖關遊戲｜Book III L7–L9</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F9FD;--card:#fff;--ink:#17324D;--soft:#557089;--line:#D3E2EF;--accent:#2F86D6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;line-height:1.7}
main{max-width:760px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
h1{font-size:clamp(1.5rem,6vw,2rem);font-weight:900;margin:6px 0 4px;text-wrap:balance}
.kicker{display:inline-block;font-size:.78rem;font-weight:800;color:var(--accent);background:#DCEBFA;border-radius:999px;padding:2px 10px}
.lead{color:var(--soft);margin:0 0 18px}
.game{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 6px 22px rgba(31,111,184,.08);min-height:96px}
.game:hover{border-color:var(--accent)}
.ic{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:1.25rem;flex:none}
.game b{display:block;font-size:1.08rem}
.game small{color:var(--soft);display:block;line-height:1.5}
.go{margin-left:auto;font-weight:900;color:var(--accent);white-space:nowrap}
footer{text-align:center;color:var(--soft);font-size:.8rem;margin-top:24px}
footer b{color:var(--ink)}
</style>
</head>
<body>
<main>
 <span class="kicker">Book III · Lessons 7–9</span>
 <h1>英文闖關遊戲</h1>
 <p class="lead">選老師指定的那一課，輸入班級、座號、姓名就能開始。進度會自動保存。</p>
 <a class="game" href="l7/"><span class="ic" style="background:linear-gradient(135deg,#2F86D6,#0E9A9A)">L7</span><span><b>讀心探員特訓營</b><small>Bodies Speak Louder Than Words · 肢體語言</small></span><span class="go">開始 →</span></a>
 <a class="game" href="l8/"><span class="ic" style="background:linear-gradient(135deg,#2E7D5B,#C87D28)">L8</span><span><b>叢林大象救援行動</b><small>Elephant Tourism · 動物保育</small></span><span class="go">開始 →</span></a>
 <a class="game" href="l9/"><span class="ic" style="background:linear-gradient(135deg,#7f1d1d,#d97706)">L9</span><span><b>媽祖進香文化特使</b><small>Mazu Mania · 文化遺產與 SDGs</small></span><span class="go">開始 →</span></a>
 <footer><b>Gina教室的AI奇蹟</b><br>鳳新高中英文科李姬慧老師 X AI 彙整製作</footer>
</main>
</body>
</html>
