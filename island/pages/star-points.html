<style>
/* Layout: sticky glass header, 12-col work grid (lg 7/5), mobile bottom nav. Single dark cosmic theme by design. */
:root{--bg:#030712;--fg:#f1f5f9;color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:"Plus Jakarta Sans","Noto Sans TC",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:#070b19}
.stars-bg{background-color:#030712;background-image:radial-gradient(at 0% 0%,rgba(99,102,241,.16) 0px,transparent 45%),radial-gradient(at 100% 0%,rgba(6,182,212,.14) 0px,transparent 45%),radial-gradient(at 50% 100%,rgba(168,85,247,.14) 0px,transparent 50%);background-attachment:fixed}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.glass-panel{background:rgba(12,19,40,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);box-shadow:0 12px 40px 0 rgba(0,0,0,.55)}
.glass-card{background:rgba(22,32,60,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.07);transition:border-color .2s,box-shadow .2s,transform .2s}
.glass-card.hov:hover{border-color:rgba(99,102,241,.45);box-shadow:0 12px 30px -10px rgba(99,102,241,.3)}
.glass-input{background:rgba(7,11,25,.75);border:1px solid rgba(255,255,255,.12);color:#f8fafc}
.glass-input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.25);outline:none}
select.glass-input option{background:#0c1328}
.mi{font-family:'Material Symbols Rounded';font-style:normal;font-weight:500;font-size:1.25em;line-height:1;display:inline-block;vertical-align:-.2em;font-variation-settings:'FILL' 0;font-feature-settings:'liga'}
.mi.fill{font-variation-settings:'FILL' 1}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:2px solid #38bdf8;outline-offset:2px}
.view{animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.float{animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.main-pad{padding-bottom:calc(6.5rem + env(safe-area-inset-bottom,0px))}
@media(min-width:768px){.main-pad{padding-bottom:3rem}}
.bottom-nav{padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="stars-bg min-h-screen text-slate-100">
<header class="glass-panel sticky z-40 gutter" style="top:env(safe-area-inset-top,0px)">
  <div class="max-w-6xl mx-auto py-3 flex items-center gap-3 flex-wrap">
    <div class="flex items-center gap-3 min-w-0 flex-1">
      <div class="w-10 h-10 shrink-0 rounded-xl p-[2px] bg-gradient-to-br from-indigo-500 via-purple-600 to-cyan-400">

      </div>
      <div class="min-w-0">
        <div class="text-[11px] font-extrabold tracking-[.2em] bg-gradient-to-r from-indigo-400 via-purple-400 to-cyan-300 bg-clip-text text-transparent">STAR SCOUTS</div>
        <div class="font-black tracking-tight text-base leading-tight truncate">208好事星探社</div>
      </div>
    </div>
    <nav id="topTabs" class="hidden md:flex bg-cosmic-950/80 p-1 rounded-xl border border-white/10 text-sm"></nav>

      <select id="who" class="glass-input rounded-lg px-2 py-1.5 text-sm max-w-[10rem]" aria-label="切換示範身分"></select>

</header>

<div class="gutter"><div class="max-w-6xl mx-auto mt-3">
  <div class="px-3 py-2 rounded-xl bg-amber-500/10 border border-amber-500/25 text-amber-200 text-xs flex items-start gap-2">
    <i class="mi text-amber-300">science</i>
    <span>示範版：正式版會用學校帳號登入，點數記在各自的學校信箱下。現在用右上角切換身分，就能走完推薦、附議、審核、兌換。</span>
  </div>
</div></div>

<main class="gutter main-pad"><div class="max-w-6xl mx-auto pt-5" id="view"></div></main>
<nav id="bottomNav" class="bottom-nav md:hidden fixed bottom-0 inset-x-0 z-40 glass-panel border-t border-white/10"></nav>
<div id="toasts" class="fixed z-50 right-4 left-4 md:left-auto md:w-80 flex flex-col gap-2 pointer-events-none" style="bottom:calc(5.5rem + env(safe-area-inset-bottom,0px))" role="status" aria-live="polite"></div>
</div>

<script>
const KEY='starpoints-demo-v2';
const WEEK_LIMIT=3;
const now=()=>new Date().toISOString();
const daysAgo=d=>new Date(Date.now()-d*864e5).toISOString();
const dateOnly=t=>t.slice(0,10);
const DEFAULT={
  students:[
    {seat:'01',name:'王小明',email:'demo01@example.com'},
    {seat:'02',name:'林佳穎',email:'demo02@example.com'},
    {seat:'03',name:'陳柏宇',email:'demo03@example.com'},
    {seat:'04',name:'張雅婷',email:'demo04@example.com'},
    {seat:'05',name:'黃子晴',email:'demo05@example.com'},
    {seat:'06',name:'劉冠廷',email:'demo06@example.com'},
    {seat:'07',name:'吳宥辰',email:'demo07@example.com'},
    {seat:'08',name:'蔡欣妤',email:'demo08@example.com'}
  ],
  cats:[
    {id:'lead',name:'活動負責人',pts:10,icon:'flag',hint:'統籌班級或學校活動'},
    {id:'serve',name:'熱心服務',pts:5,icon:'volunteer_activism',hint:'主動幫忙班上或同學'},
    {id:'help',name:'協助活動',pts:3,icon:'groups',hint:'參與籌備、現場支援'},
    {id:'clean',name:'打掃確實',pts:2,icon:'cleaning_services',hint:'掃區做得特別仔細'},
    {id:'hw',name:'準時完成作業',pts:2,icon:'task_alt',hint:'一週作業全部準時'}
  ],
  noms:[
    {id:'n1',to:'demo05@example.com',by:'demo02@example.com',cat:'lead',fact:'統籌園遊會攤位排班表，每個時段都有人顧',date:dateOnly(daysAgo(9)),status:'approved',pts:10,time:daysAgo(8)},
    {id:'n2',to:'demo06@example.com',by:'demo01@example.com',cat:'help',fact:'園遊會當天提早一小時到校搬桌椅',date:dateOnly(daysAgo(9)),status:'approved',pts:3,time:daysAgo(8)},
    {id:'n3',to:'demo02@example.com',by:'teacher',cat:'serve',fact:'主動幫請病假的同學整理各科講義',date:dateOnly(daysAgo(5)),status:'approved',pts:5,time:daysAgo(5)},
    {id:'n4',to:'demo03@example.com',by:'demo03@example.com',cosigner:'demo06@example.com',cat:'clean',fact:'外掃區落葉全部清完，還把排水溝撈乾淨',date:dateOnly(daysAgo(2)),status:'approved',pts:2,time:daysAgo(2)},
    {id:'n5',to:'demo01@example.com',by:'demo05@example.com',cat:'serve',fact:'午休幫忙把全班的作業簿送到英文科辦公室',date:dateOnly(daysAgo(1)),status:'pending',time:daysAgo(1)},
    {id:'n6',to:'demo04@example.com',by:'demo08@example.com',cat:'help',fact:'教師節卡片設計和收集全班簽名',date:dateOnly(daysAgo(1)),status:'pending',time:daysAgo(1)},
    {id:'n7',to:'demo02@example.com',by:'demo02@example.com',cosigner:'demo01@example.com',cat:'hw',fact:'這週國英數三科作業都在期限前交',date:dateOnly(daysAgo(0)),status:'cosign',time:daysAgo(0)}
  ],
  ledger:[
    {email:'demo05@example.com',pts:10,reason:'活動負責人：統籌園遊會攤位排班表',time:daysAgo(8)},
    {email:'demo06@example.com',pts:3,reason:'協助活動：園遊會提早到校搬桌椅',time:daysAgo(8)},
    {email:'demo02@example.com',pts:5,reason:'熱心服務：幫病假同學整理講義',time:daysAgo(5)},
    {email:'demo03@example.com',pts:2,reason:'打掃確實：外掃區與排水溝',time:daysAgo(2)},
    {email:'demo05@example.com',pts:-8,reason:'兌換：午休選歌一次',time:daysAgo(3)}
  ],
  rewards:[
    {id:'r1',name:'午休選歌一次',cost:8,stock:5,open:true,icon:'music_note'},
    {id:'r2',name:'當一日小老師',cost:10,stock:3,open:true,icon:'school'},
    {id:'r3',name:'作業延交一天',cost:12,stock:8,open:true,icon:'schedule'},
    {id:'r4',name:'自選座位一週',cost:15,stock:4,open:true,icon:'event_seat'}
  ],
  redeems:[{id:'d1',email:'demo05@example.com',rid:'r1',status:'given',time:daysAgo(3)}],
  goal:{target:80,prize:'全班電影午後'},
  mail:[]
};

let S,me='demo01@example.com',tab='home',form={who:'other',to:'',cat:'',fact:'',date:'',cosigner:''},setTab='items';
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('這台裝置無法儲存，重新整理後會回到範例資料','rose')}}
S=load()||JSON.parse(JSON.stringify(DEFAULT));

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const stu=e=>S.students.find(s=>s.email===e);
const nm=e=>e==='teacher'?'導師':(stu(e)?.name||'—');
const bal=e=>S.ledger.filter(l=>l.email===e).reduce((a,l)=>a+l.pts,0);
const earned=e=>S.ledger.filter(l=>l.email===e&&l.pts>0).reduce((a,l)=>a+l.pts,0);
const classEarned=()=>S.ledger.filter(l=>l.pts>0).reduce((a,l)=>a+l.pts,0);
const cat=id=>S.cats.find(c=>c.id===id);
const rew=id=>S.rewards.find(r=>r.id===id);
const isT=()=>me==='teacher';
const md=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()}`};
const sign=n=>n>0?'+'+n:String(n);
const weekCount=e=>S.noms.filter(n=>n.by===e&&Date.now()-new Date(n.time)<7*864e5).length;

function toast(msg,tone='indigo'){
  const m={indigo:'bg-indigo-950/80 border-indigo-500/40 text-indigo-100',emerald:'bg-emerald-950/80 border-emerald-500/40 text-emerald-100',rose:'bg-rose-950/80 border-rose-500/40 text-rose-100',amber:'bg-amber-950/80 border-amber-500/40 text-amber-100',cyan:'bg-cyan-950/80 border-cyan-500/40 text-cyan-100'};
  const el=document.createElement('div');el.className=`px-4 py-3 rounded-2xl backdrop-blur-md border text-sm shadow-xl ${m[tone]||m.indigo}`;el.textContent=msg;
  document.getElementById('toasts').appendChild(el);setTimeout(()=>el.remove(),3200);
}
function sendMail(to,subject){S.mail.unshift({to,subject,time:now()})}

/* nav */
function tabs(){
  return isT()
    ?[{id:'home',label:'總覽',icon:'dashboard'},{id:'review',label:'審核',icon:'fact_check'},{id:'wall',label:'善行牆',icon:'auto_awesome'},{id:'settings',label:'設定',icon:'tune'}]
    :[{id:'home',label:'我的星點',icon:'stars'},{id:'nominate',label:'推薦善行',icon:'campaign'},{id:'wall',label:'善行牆',icon:'auto_awesome'},{id:'shop',label:'兌換站',icon:'redeem'}];
}
function renderNav(){
  const t=tabs();if(!t.find(x=>x.id===tab))tab='home';
  const pend=S.noms.filter(n=>n.status==='pending').length;
  const cos=isT()?0:S.noms.filter(n=>n.status==='cosign'&&n.cosigner===me).length;
  const badge=id=>{const n=id==='review'?pend:id==='home'&&!isT()?cos:0;return n?`<span class="ml-1 px-1.5 rounded-full bg-amber-500 text-cosmic-950 text-[10px] font-black num">${n}</span>`:''};
  document.getElementById('topTabs').innerHTML=t.map(x=>`<button onclick="go('${x.id}')" class="px-3 py-1.5 rounded-lg font-bold ${tab===x.id?'bg-indigo-600 text-white':'text-slate-400 hover:text-white'}">${x.label}${badge(x.id)}</button>`).join('');
  document.getElementById('bottomNav').innerHTML=`<div class="grid grid-cols-4">`+t.map(x=>`<button onclick="go('${x.id}')" class="relative py-2.5 flex flex-col items-center gap-0.5 text-[11px] font-bold ${tab===x.id?'text-cyan-300':'text-slate-400'}"><i class="mi ${tab===x.id?'fill':''} text-xl">${x.icon}</i>${x.label}${badge(x.id)?`<span class="absolute top-1.5 left-1/2 ml-2 w-2 h-2 rounded-full bg-amber-400"></span>`:''}</button>`).join('')+'</div>';
  const sel=document.getElementById('who');
  sel.innerHTML=`<option value="teacher">導師｜李姬慧</option>`+S.students.map(s=>`<option value="${s.email}">${esc(s.seat)} ${esc(s.name)}</option>`).join('');
  sel.value=me;
}
function go(t){tab=t;render();window.scrollTo({top:0,behavior:'smooth'})}
document.getElementById('who').addEventListener('change',e=>{me=e.target.value;tab='home';form={who:'other',to:'',cat:'',fact:'',date:'',cosigner:''};render();toast(`已切換為 ${isT()?'導師':nm(me)}`,'cyan')});

/* pieces */
const panel=(inner,cls='')=>`<section class="glass-panel rounded-3xl p-5 sm:p-6 relative overflow-hidden ${cls}">${inner}</section>`;
const h2=(icon,t,sub='')=>`<div class="mb-4"><h2 class="font-black tracking-tight text-lg flex items-center gap-2"><i class="mi text-indigo-300">${icon}</i>${t}</h2>${sub?`<p class="text-slate-400 text-sm mt-1">${sub}</p>`:''}</div>`;
const pill=(t,tone)=>{const m={cyan:'bg-cyan-500/20 text-cyan-300 border-cyan-500/30',amber:'bg-amber-500/20 text-amber-300 border-amber-500/30',rose:'bg-rose-500/20 text-rose-300 border-rose-500/30',emerald:'bg-emerald-500/20 text-emerald-300 border-emerald-500/30',slate:'bg-slate-500/20 text-slate-300 border-slate-500/30'};return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold border whitespace-nowrap ${m[tone]}">${t}</span>`};
const empty=t=>`<p class="text-slate-500 text-sm py-6 text-center">${t}</p>`;
const cta=(label,fn,icon='')=>`<button onclick="${fn}" class="w-full py-4 rounded-2xl bg-gradient-to-r from-indigo-500 via-purple-600 to-cyan-400 font-extrabold shadow-xl shadow-indigo-600/30 hover:-translate-y-0.5 transition">${icon?`<i class="mi">${icon}</i> `:''}${label}</button>`;
function credit(n){
  if(n.by==='teacher')return '導師肯定';
  if(n.by===n.to)return `自薦・${esc(nm(n.cosigner))} 附議`;
  return `推薦人：${esc(nm(n.by))}`;
}
function goalBar(){
  const g=S.goal,v=classEarned(),p=Math.min(100,v/g.target*100);
  return `<div class="flex items-end justify-between gap-3 mb-2"><div><div class="text-xs text-slate-400">全班共同目標</div><div class="font-black">${esc(g.prize)}</div></div><div class="num text-sm text-slate-300"><b class="text-cyan-300 text-lg">${v}</b> / ${g.target}</div></div>
  <div class="h-2.5 bg-slate-800 rounded-full p-0.5 border border-white/10"><div class="h-full rounded-full bg-gradient-to-r from-indigo-500 to-cyan-400" style="width:${Math.max(3,p)}%"></div></div>
  <p class="text-[11px] text-slate-500 mt-2">${v>=g.target?'目標達成，找導師安排獎勵！':`還差 ${g.target-v} 點。每個人被肯定的點數都會累積到這裡，兌換不會扣掉。`}</p>`;
}

/* ---------- student views ---------- */
function vStudentHome(){
  const s=stu(me),b=bal(me);
  const mine=S.ledger.filter(l=>l.email===me).slice().sort((a,c)=>c.time.localeCompare(a.time));
  const myNoms=S.noms.filter(n=>n.by===me&&n.status!=='approved').slice().reverse();
  const toCos=S.noms.filter(n=>n.status==='cosign'&&n.cosigner===me);
  const steps=[['推薦善行','自己做的或看到同學做的，寫下具體事實'],['導師審核','確認有這件事，依點數表給點'],['自動入帳','點數記在你的學校信箱帳號，並寄信通知'],['兌換獎勵','點數夠了就到兌換站換']];
  return `<div class="grid grid-cols-1 lg:grid-cols-12 gap-6"><div class="lg:col-span-7 flex flex-col gap-6">
  ${toCos.length?panel(h2('how_to_reg','同學請你附議','你也看到這件事，就按附議；沒看到就略過')+`<ul class="flex flex-col gap-2.5">${toCos.map(n=>`<li class="glass-card rounded-xl p-3.5"><div class="font-bold">${esc(nm(n.to))}・${esc(cat(n.cat)?.name)}</div><div class="text-sm text-slate-300 mt-0.5">${esc(n.fact)}</div><div class="text-[11px] text-slate-500 mt-0.5">${md(n.date)}</div><div class="flex gap-2 mt-3"><button onclick="cosign('${n.id}',false)" class="flex-1 py-2 rounded-xl glass-card hover:bg-white/10 text-slate-300 text-sm font-bold">我沒看到</button><button onclick="cosign('${n.id}',true)" class="flex-1 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-sm font-bold">附議</button></div></li>`).join('')}</ul>`,'ring-1 ring-amber-400/40'):''}
  ${panel(`<div class="absolute -right-16 -top-16 w-80 h-80 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
   <div class="relative flex items-center gap-5 flex-wrap">
    <div class="float w-28 h-28 rounded-full p-[3px] bg-gradient-to-br from-indigo-500 via-purple-600 to-cyan-400 shrink-0"><div class="w-full h-full rounded-full bg-cosmic-900 grid place-items-center text-center"><div><div class="num text-4xl font-black">${b}</div><div class="text-[10px] text-slate-400 tracking-widest">可用星點</div></div></div></div>
    <div class="min-w-0"><div class="text-slate-400 text-sm">${esc(s.seat)} 號</div><h1 class="text-2xl font-black tracking-tight">${esc(s.name)}</h1><div class="text-xs text-slate-400 mt-1 break-all"><i class="mi text-cyan-300">mail</i> ${esc(s.email)}</div><div class="text-xs text-slate-500 mt-1">本學期累計獲得 <b class="num text-slate-300">${earned(me)}</b> 點</div></div>
   </div>
   <div class="relative grid grid-cols-2 gap-3 mt-5">
    <button onclick="startNom('self')" class="py-3.5 rounded-2xl bg-gradient-to-r from-indigo-500 via-purple-600 to-cyan-400 font-extrabold shadow-xl shadow-indigo-600/30 hover:-translate-y-0.5 transition"><i class="mi">person_add</i> 自薦</button>
    <button onclick="startNom('other')" class="py-3.5 rounded-2xl glass-card hover:bg-white/10 text-slate-200 font-bold"><i class="mi">campaign</i> 推薦同學</button>
   </div>`)}
  ${panel(goalBar())}
  ${panel(h2('route','怎麼運作')+`<ol class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">${steps.map((x,i)=>`<li class="glass-card rounded-xl p-3 flex items-start gap-3"><span class="w-6 h-6 shrink-0 rounded-lg bg-indigo-500/20 text-indigo-300 font-bold text-xs grid place-items-center">${i+1}</span><div><div class="font-bold text-sm">${x[0]}</div><div class="text-slate-400 text-xs mt-0.5">${x[1]}</div></div></li>`).join('')}</ol>`)}
  </div><div class="lg:col-span-5 flex flex-col gap-6">

function syncText(){const a=document.getElementById('fFact');if(a)form.fact=a.value;const d=document.getElementById('fDate');if(d)form.date=d.value}
function submitNom(){
  syncText();
  const to=form.who==='self'?me:form.to,fact=form.fact.trim();
  if(weekCount(me)>=WEEK_LIMIT)return toast(`這週已經推薦 ${WEEK_LIMIT} 次了，下週再來`,'amber');
  if(form.who==='other'&&!to)return toast('請選擇要推薦的同學','amber');
  if(form.who==='self'&&!form.cosigner)return toast('自薦需要選一位附議的同學','amber');
  if(!form.cat)return toast('請選一個類別','amber');
  if(fact.length<8)return toast('請寫具體一點：做了什麼事，至少 8 個字','amber');
  if(!form.date)return toast('請選日期','amber');
  if(S.noms.some(n=>n.to===to&&n.cat===form.cat&&n.date===form.date&&n.status!=='returned'))return toast('這件事已經有人登錄過了，不用重複推薦','amber');
  const self=form.who==='self';
  S.noms.push({id:uid('n'),to,by:me,cosigner:self?form.cosigner:undefined,cat:form.cat,fact,date:form.date,status:self?'cosign':'pending',time:now()});
  save();toast(self?`已送出，等 ${nm(form.cosigner)} 附議`:`已推薦 ${nm(to)}，等導師審核`,'emerald');
  form={who:'other',to:'',cat:'',fact:'',date:'',cosigner:''};go('home');
}
function cosign(id,ok){
  const n=S.noms.find(x=>x.id===id);if(!n)return;
  if(ok){n.status='pending';toast('已附議，送到導師審核','emerald')}
  else{n.status='returned';n.reason=`附議人 ${nm(me)} 表示沒看到這件事`;toast('已略過這筆自薦','amber')}
  save();render();
}

function redeem(rid){
  const r=rew(rid);if(bal(me)<r.cost||r.stock<=0)return;
  r.stock--;S.ledger.push({email:me,pts:-r.cost,reason:'兌換：'+r.name,time:now()});
  S.redeems.push({id:uid('d'),email:me,rid,status:'waiting',time:now()});
  save();toast(`已兌換「${r.name}」，找導師領取`,'emerald');render();
}

function award(n,pts){
  n.status='approved';n.pts=pts;n.time=now();

  sendMail(n.to,`【208好事星探社】你獲得 ${pts} 點：${c.name}`);
}
function decide(id,ok){
  const n=S.noms.find(x=>x.id===id);if(!n)return;
  if(ok){
    const p=Math.round(+document.getElementById('p_'+id).value);
    if(!(p>=1&&p<=30))return toast('點數請填 1 到 30','amber');
    award(n,p);toast(`已核定 ${nm(n.to)} +${p}，通知寄到 ${n.to}`,'emerald');
  }else{
    n.status='returned';n.reason=document.getElementById('r_'+id).value;
    sendMail(n.by,`【208好事星探社】你的推薦被退回：${n.reason}`);
    toast(`已退回，原因會讓推薦人看到`,'amber');
  }
  save();render();
}

  if(setTab==='items')body=h2('inventory_2','兌換項目')+`<ul class="flex flex-col gap-2 mb-5">${S.rewards.map(r=>`<li class="glass-card rounded-xl p-3 flex items-center gap-3"><div class="flex-1 min-w-0"><div class="font-bold text-sm truncate">${esc(r.name)}</div><div class="text-xs text-slate-400 num">${r.cost} 點・剩 ${r.stock} 份</div></div><button onclick="toggleItem('${r.id}')" class="px-3 py-1.5 rounded-lg text-xs font-bold ${r.open?'bg-emerald-500/20 text-emerald-300':'bg-slate-500/20 text-slate-300'}">${r.open?'開放中':'已暫停'}</button></li>`).join('')}</ul>
   <div class="grid grid-cols-1 sm:grid-cols-[1fr_6rem_6rem_auto] gap-2"><input id="iName" class="glass-input rounded-xl px-3 py-2.5" placeholder="新項目名稱"><input id="iCost" type="number" min="1" class="glass-input rounded-xl px-3 py-2.5" placeholder="點數"><input id="iStock" type="number" min="1" class="glass-input rounded-xl px-3 py-2.5" placeholder="數量"><button onclick="addItem()" class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold">上架</button></div>`;
  if(setTab==='points')body=h2('table_chart','點數表','改完按儲存，之後的審核預設值就會更新')+`<ul class="flex flex-col gap-2">${S.cats.map((c,i)=>`<li class="glass-card rounded-xl p-3 flex items-center gap-3"><i class="mi text-cyan-300">${c.icon}</i><span class="flex-1 text-sm font-bold">${esc(c.name)}</span><input id="cp_${i}" type="number" min="1" value="${c.pts}" class="glass-input w-16 rounded-lg px-2 py-1.5 num text-center" aria-label="${esc(c.name)} 點數"></li>`).join('')}</ul><button onclick="savePts()" class="mt-4 px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold">儲存點數表</button>`;
  if(setTab==='goal')body=h2('flag','班級共同目標','全班被肯定的點數加總達標，就解鎖團體獎勵')+`<div class="grid grid-cols-1 sm:grid-cols-[1fr_7rem_auto] gap-2"><input id="gPrize" value="${esc(S.goal.prize)}" class="glass-input rounded-xl px-3 py-2.5" aria-label="獎勵"><input id="gTarget" type="number" min="1" value="${S.goal.target}" class="glass-input rounded-xl px-3 py-2.5 num" aria-label="目標點數"><button onclick="saveGoal()" class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold">儲存</button></div><div class="mt-5">${goalBar()}</div>`;
  if(setTab==='export'){
    const txt=exportText();
    body=h2('download','學期善行紀錄','每位同學被肯定的事蹟，可以貼到學習歷程或幹部服務證明')+`<div class="overflow-x-auto mb-4"><table class="w-full text-sm"><thead class="text-slate-400 text-xs"><tr><th class="text-left py-2">座號</th><th class="text-left">姓名</th><th class="text-right">事蹟</th><th class="text-right">累計獲得</th><th class="text-right">可用</th></tr></thead><tbody>${S.students.map(s=>`<tr class="border-t border-white/5"><td class="py-2.5 num text-slate-400">${esc(s.seat)}</td><td>${esc(s.name)}</td><td class="text-right num">${S.noms.filter(n=>n.to===s.email&&n.status==='approved').length}</td><td class="text-right num font-extrabold">${earned(s.email)}</td><td class="text-right num text-slate-300">${bal(s.email)}</td></tr>`).join('')}</tbody></table></div>
    <textarea id="exp" readonly rows="6" class="glass-input w-full rounded-xl px-3 py-2 text-xs">${esc(txt)}</textarea>
    <div class="flex gap-2 mt-3 flex-wrap"><button onclick="copyExport()" class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold"><i class="mi">content_copy</i> 複製（可貼到試算表）</button><button onclick="resetDemo()" class="px-4 py-2.5 rounded-xl glass-card hover:bg-white/10 text-slate-300 font-bold"><i class="mi">restart_alt</i> 重設示範資料</button></div>`;
  }
  return `<div class="flex gap-1 overflow-x-auto bg-cosmic-950/80 p-1 rounded-xl border border-white/10 mb-5 text-sm">${t.map(([id,l])=>`<button onclick="setTab='${id}';render()" class="px-3 py-2 rounded-lg font-bold whitespace-nowrap ${setTab===id?'bg-indigo-600 text-white':'text-slate-400 hover:text-white'}">${l}</button>`).join('')}</div>`+panel(body);
}
function toggleItem(id){const r=rew(id);r.open=!r.open;save();render()}
function addItem(){
  const n=document.getElementById('iName').value.trim(),c=+document.getElementById('iCost').value,s=+document.getElementById('iStock').value;
  if(!n||c<1||s<1)return toast('名稱、點數、數量都要填，點數和數量至少 1','amber');
  S.rewards.push({id:uid('r'),name:n,cost:c,stock:s,open:true,icon:'star'});save();toast(`已上架「${n}」`,'emerald');render();
}
function savePts(){S.cats.forEach((c,i)=>{const v=Math.round(+document.getElementById('cp_'+i).value);if(v>=1)c.pts=v});save();toast('點數表已更新','emerald');render()}
function saveGoal(){const p=document.getElementById('gPrize').value.trim(),t=Math.round(+document.getElementById('gTarget').value);if(!p||t<1)return toast('請填獎勵名稱和目標點數','amber');S.goal={prize:p,target:t};save();toast('班級目標已更新','emerald');render()}
function exportText(){
  const rows=[['座號','姓名','學校信箱','日期','類別','事蹟','點數','推薦方式']];
  S.students.forEach(s=>S.noms.filter(n=>n.to===s.email&&n.status==='approved').forEach(n=>rows.push([s.seat,s.name,s.email,n.date,cat(n.cat)?.name,n.fact,n.pts,credit(n)])));
  return rows.map(r=>r.join('\t')).join('\n');
}
function copyExport(){
  const el=document.getElementById('exp');
  navigator.clipboard.writeText(el.value).then(()=>toast('已複製，貼到 Google 試算表就會自動分欄','emerald')).catch(()=>{el.focus();el.select();toast('已選取文字，請按複製','amber')});
}
let resetArmed=false;
function resetDemo(){
  if(!resetArmed){resetArmed=true;toast('再按一次「重設示範資料」就會清掉這台裝置的紀錄','amber');setTimeout(()=>resetArmed=false,4000);return}
  resetArmed=false;S=JSON.parse(JSON.stringify(DEFAULT));save();toast('已回到範例資料','cyan');render();
}

function render(){
  renderNav();
  const v=isT()?{home:vTeacherHome,review:vReview,wall:vWall,settings:vSettings}[tab]:{home:vStudentHome,nominate:vNominate,wall:vWall,shop:vShop}[tab];
  document.getElementById('view').innerHTML=`<div class="view">${v()}</div><footer class="text-center text-[11px] text-slate-500 mt-10">鳳新高中英文科李姬慧老師 X AI 彙整製作</footer>`;
}
render();
</script>
