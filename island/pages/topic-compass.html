<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>自主學習選題羅盤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FDF8F1; --bg-warm:#F7EFE3; --card:#FFFFFF;
  --amber:#D97706; --amber-deep:#B45309; --amber-dark:#92400E; --amber-tint:#FDF0DC;
  --teal:#0F766E; --teal-soft:#5EAEA6; --teal-tint:#E3F2EF;
  --ink:#2E2419; --ink-soft:#6B5D4F; --line:#E8DCCB;
  --on-amber:#FFFFFF;
  --shadow:0 4px 20px rgba(146,64,14,.08); --shadow-lg:0 12px 40px rgba(146,64,14,.12);
  --radius:18px; --radius-sm:12px;
  --serif:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --display:'Playfair Display',Georgia,'Noto Serif TC',serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1B1611; --bg-warm:#231C15; --card:#2A221A;
    --amber:#F59E0B; --amber-deep:#FBBF24; --amber-dark:#FCD34D; --amber-tint:#3A2A14;
    --teal:#5EC4B8; --teal-soft:#5EAEA6; --teal-tint:#17332F;
    --ink:#F3E9DC; --ink-soft:#BFAF9C; --line:#3E3228; --on-amber:#1B1611;
    --shadow:0 4px 20px rgba(0,0,0,.35); --shadow-lg:0 12px 40px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1B1611; --bg-warm:#231C15; --card:#2A221A;
  --amber:#F59E0B; --amber-deep:#FBBF24; --amber-dark:#FCD34D; --amber-tint:#3A2A14;
  --teal:#5EC4B8; --teal-soft:#5EAEA6; --teal-tint:#17332F;
  --ink:#F3E9DC; --ink-soft:#BFAF9C; --line:#3E3228; --on-amber:#1B1611;
  --shadow:0 4px 20px rgba(0,0,0,.35); --shadow-lg:0 12px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.8;padding:0 16px}
.wrap{max-width:880px;margin:0 auto}
h1,h2,h3{text-wrap:balance;line-height:1.35;margin:0}
p{margin:0}
button,input,textarea,select{font-family:inherit;font-size:1rem;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* hero */
.hero{padding-block:40px 20px;display:grid;gap:10px}
.eyebrow{font-family:var(--display);font-style:italic;color:var(--amber);letter-spacing:.06em;font-size:.95rem}
.hero h1{font-size:clamp(1.9rem,6vw,2.8rem);font-weight:700}
.hero p{color:var(--ink-soft);max-width:36em}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--amber);color:var(--on-amber);font-weight:600;padding:10px 22px;border-radius:999px;cursor:pointer;transition:background .2s,transform .2s}
.btn:hover{background:var(--amber-deep);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--amber-dark);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--amber);background:var(--amber-tint)}
.btn.sm{padding:6px 14px;font-size:.9rem}
.btn.danger{background:#B91C1C;color:#fff}
.linkbtn{background:none;border:0;color:var(--ink-soft);cursor:pointer;font-size:.88rem;text-decoration:underline;padding:4px}

/* banner */
.banner{background:var(--teal-tint);border:1px solid var(--teal-soft);border-radius:var(--radius-sm);padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;font-size:.95rem;margin-bottom:16px}
.banner b{color:var(--teal)}

/* stepper */
.stepper{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:24px}
.steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:1 0 auto;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px 6px 6px;cursor:pointer;white-space:nowrap;font-size:.92rem;color:var(--ink-soft)}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg-warm);font-family:var(--display);font-weight:700;font-size:.9rem;color:var(--amber-dark)}
.step.done .n{background:var(--teal);color:var(--card)}
.step.on{border-color:var(--amber);color:var(--ink);font-weight:600;background:var(--amber-tint)}
.step.on .n{background:var(--amber);color:var(--on-amber)}

/* panel */
.phead{display:grid;gap:6px;margin-bottom:22px}
.phead h2{font-size:clamp(1.45rem,4vw,2rem)}
.phead h2::after{content:'';display:block;width:48px;height:3px;background:var(--amber);border-radius:2px;margin-top:12px}
.rule{background:var(--amber-tint);border-radius:var(--radius-sm);padding:12px 16px;color:var(--amber-dark);font-size:.95rem}
.rule strong{font-weight:700}
.group{display:grid;gap:18px;margin-bottom:34px}
.gtitle{display:flex;align-items:baseline;gap:10px;font-size:1.15rem;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.gtitle small{font-weight:400;color:var(--ink-soft);font-size:.88rem}
.q{display:grid;gap:8px}
.q label,.qlabel{font-weight:600}
.q .hint{color:var(--ink-soft);font-size:.88rem;line-height:1.6}
.qn{font-family:var(--display);color:var(--amber);font-weight:700;margin-right:4px}
textarea,input[type=text],input[type=number],select{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:10px 14px;line-height:1.7}
textarea{min-height:84px;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--amber);outline:none}
::placeholder{color:var(--ink-soft);opacity:.7}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:.92rem;transition:all .15s}
.chip:hover{border-color:var(--amber)}
.chip.on{background:var(--amber);border-color:var(--amber);color:var(--on-amber);font-weight:600}
.chip.teal.on{background:var(--teal);border-color:var(--teal);color:var(--card)}

/* skills */
.skills{display:grid;gap:8px}
.skill{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 14px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;font-size:.84rem;cursor:pointer;color:var(--ink-soft)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--amber);color:var(--on-amber);font-weight:600}
@media (max-width:560px){.skill{grid-template-columns:1fr}.seg{justify-self:start}}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}

/* summary card */
.summary{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 22px;display:grid;gap:14px}
.summary h3{font-size:1.1rem;display:flex;align-items:center;gap:8px}
.summary h3 .eyebrow{font-size:.85rem}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 20px}
.sitem{display:grid;gap:4px}
.sitem .k{font-size:.8rem;letter-spacing:.08em;color:var(--ink-soft)}
.sitem .v{font-weight:600}
.tag{display:inline-block;background:var(--bg-warm);border-radius:6px;padding:1px 8px;margin:2px 4px 2px 0;font-size:.88rem;font-weight:500}
.tag.teal{background:var(--teal-tint);color:var(--teal)}
.tag.amber{background:var(--amber-tint);color:var(--amber-dark)}
.scale{border-top:1px dashed var(--line);padding-top:12px;font-size:.95rem}
.mini{font-size:.9rem;color:var(--ink-soft)}
details.mini-sum{background:var(--bg-warm);border-radius:var(--radius-sm);padding:10px 16px;margin-bottom:20px}
details.mini-sum summary{cursor:pointer;font-weight:600;color:var(--amber-dark)}
details.mini-sum .sgrid{margin-top:10px}

/* diverge */
.seedrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.seedrow{grid-template-columns:1fr}}
.lab{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:grid;gap:14px;box-shadow:var(--shadow)}
.sparks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.spark{text-align:left;border:1px dashed var(--line);background:var(--bg);border-radius:var(--radius-sm);padding:8px 12px;cursor:pointer;font-size:.9rem;line-height:1.55}
.spark:hover{border-color:var(--amber);border-style:solid}
.spark b{color:var(--amber-dark);display:block;font-size:.78rem;letter-spacing:.06em}
.addrow{display:grid;grid-template-columns:1fr auto;gap:10px}
@media (max-width:560px){.addrow{grid-template-columns:1fr}}
.meter{display:flex;align-items:center;gap:12px;font-size:.92rem}
.bar{flex:1;height:8px;background:var(--bg-warm);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber);border-radius:99px;transition:width .3s}
.bar i.ok{background:var(--teal)}
.ideas{display:grid;gap:8px}
.idea{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 14px}
.idea .num{font-family:var(--display);color:var(--amber);font-weight:700;min-width:1.6em;font-variant-numeric:tabular-nums}
.idea .t{font-weight:600;line-height:1.6}
.example{border-left:3px solid var(--teal-soft);padding:4px 0 4px 14px;font-size:.9rem;color:var(--ink-soft)}
.example b{color:var(--teal)}

/* filter */
.crit{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.crit div{background:var(--bg-warm);border-radius:var(--radius-sm);padding:8px 12px;font-size:.88rem;line-height:1.55}
.crit b{display:block;font-size:.95rem}
.scorecard{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:14px 16px;display:grid;gap:10px}
.scorecard.picked{border-color:var(--teal);background:linear-gradient(0deg,var(--teal-tint),var(--card) 70%)}
.sc-top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.total{font-family:var(--display);font-weight:700;font-size:1.5rem;color:var(--amber-dark);font-variant-numeric:tabular-nums;line-height:1}
.total small{font-size:.75rem;color:var(--ink-soft);font-family:var(--serif);font-weight:400}
.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:640px){.scores{grid-template-columns:1fr 1fr}}
.score .k{font-size:.8rem;color:var(--ink-soft);margin-bottom:2px}
.score .seg button{flex:1;padding:3px 0;min-width:26px;font-family:var(--display)}
.pickbtn{justify-self:start}

/* focus */
.fcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:grid;gap:14px;box-shadow:var(--shadow)}
.fcard.final{border:2px solid var(--amber)}
.fhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.fhead h3{font-size:1.1rem}
.tpls{display:flex;flex-wrap:wrap;gap:6px}
.tpl{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:3px 10px;font-size:.84rem;cursor:pointer}
.tpl:hover{border-color:var(--amber)}
.radio{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;color:var(--amber-dark);border:1.5px solid var(--line);border-radius:999px;padding:4px 14px 4px 8px;background:var(--card)}
.radio .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--amber);display:grid;place-items:center}
.radio.on{background:var(--amber);color:var(--on-amber);border-color:var(--amber)}
.radio.on .dot{border-color:var(--on-amber)}
.radio.on .dot::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--on-amber)}

/* form */
.forms{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:700px){.forms{grid-template-columns:1fr}}
.fopt{position:relative;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;display:grid;gap:8px;align-content:start;transition:transform .2s,box-shadow .2s}
.fopt:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.fopt.on{border:2px solid var(--amber);background:var(--amber-tint)}
.fopt h4{margin:0;font-size:1.1rem}
.fopt p{font-size:.9rem;color:var(--ink-soft);line-height:1.65}
.fopt .fit{font-size:.85rem;line-height:1.6}
.rec{position:absolute;top:-11px;right:14px;background:var(--teal);color:var(--card);font-size:.76rem;padding:2px 10px;border-radius:99px;font-weight:600}
.plan{display:grid;gap:8px}
.prow{display:grid;grid-template-columns:120px 1fr auto;gap:8px;align-items:start}
@media (max-width:560px){.prow{grid-template-columns:1fr auto}.prow textarea{grid-column:1/-1;grid-row:2}}
.prow textarea{min-height:48px}
.xbtn{border:0;background:transparent;color:var(--ink-soft);cursor:pointer;font-size:1.2rem;line-height:1;padding:8px}
.xbtn:hover{color:#B91C1C}

/* proposal */
.doc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:clamp(20px,5vw,40px);display:grid;gap:22px}
.doc .dt{text-align:center;display:grid;gap:4px;padding-bottom:16px;border-bottom:2px solid var(--amber)}
.doc .dt h3{font-size:clamp(1.3rem,4vw,1.7rem)}
.dsec{display:grid;gap:6px}
.dsec h4{margin:0;font-size:.82rem;letter-spacing:.12em;color:var(--amber-dark)}
.dsec .big{font-size:1.15rem;font-weight:700;line-height:1.6}
.dplan{display:grid;gap:4px;font-size:.95rem}
.dplan div{display:grid;grid-template-columns:110px 1fr;gap:10px;border-bottom:1px dotted var(--line);padding-block:4px}
.dplan span:first-child{color:var(--amber-dark);font-weight:600;font-variant-numeric:tabular-nums}
.empty{color:var(--ink-soft);font-style:italic}
.copyarea{display:grid;gap:10px;margin-top:22px}
.copybox{width:100%;min-height:140px;font-size:.85rem;line-height:1.6}
.send{display:grid;gap:14px;margin-top:40px;background:var(--card);border:2px solid var(--teal-soft);border-radius:var(--radius);padding:20px}
.row3{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:12px}
@media (max-width:560px){.row3{grid-template-columns:1fr 1fr}.row3 .q:last-child{grid-column:1/-1}}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.warn{background:var(--amber-tint);border-radius:var(--radius-sm);padding:10px 16px;font-size:.92rem;color:var(--amber-dark)}
.warn ul{margin:4px 0 0;padding-left:1.2em}
.warn.ok{background:var(--teal-tint);color:var(--teal)}
.warn b{display:block;font-size:.8rem;letter-spacing:.08em}
.draft{background:var(--card);border:2px dashed var(--amber);border-radius:var(--radius-sm);padding:14px 16px;display:grid;gap:8px;justify-items:start}
.draft .k,.fl .k,.rexc .k{font-size:.8rem;letter-spacing:.08em;color:var(--ink-soft);font-weight:600;display:block}
.draft p{font-weight:700;font-size:1.05rem;line-height:1.6}
.rex{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.rexc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;display:grid;gap:8px;align-content:start}
.rexc .before{color:var(--ink-soft);font-size:.95rem}
.rexc .before s{text-decoration-color:var(--amber);text-decoration-thickness:2px}
.rexc .after{font-weight:600;line-height:1.6;padding-left:10px;border-left:3px solid var(--teal)}
.funnel{display:grid;gap:6px;justify-items:center}
.fl{width:var(--w);background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 16px;display:grid;gap:6px}
.fl:first-child{background:var(--amber-tint);border-color:transparent}
.fl:first-child p:not(.mini){font-weight:700}
.fl .seg{flex-wrap:wrap;gap:6px;border:0;border-radius:0;overflow:visible}
.fl .seg button,.fl .seg button+button{border:1.5px solid var(--line);border-radius:999px;padding:5px 12px}
.fl .seg button.on{border-color:var(--amber)}
@media (max-width:560px){.fl{width:100%}}
.checks{display:grid;gap:8px}
.chk{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px}
.chk.on{background:var(--teal-tint);border-color:var(--teal-soft)}
.chk .box{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--card);cursor:pointer;color:var(--card);font-weight:700;display:grid;place-items:center;padding:0}
.chk.on .box{background:var(--teal);border-color:var(--teal)}
.chk p{font-size:.9rem;color:var(--ink-soft);line-height:1.6}
.chk .fix{color:var(--amber-dark)}
.doc .sub{font-size:.95rem;color:var(--ink-soft);line-height:1.7}
.fbcard{background:var(--card);border:2px solid var(--teal);border-radius:var(--radius);padding:18px 20px;display:grid;gap:8px;margin-bottom:20px;box-shadow:var(--shadow)}
.fbh{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.fbh b{font-size:1.1rem;color:var(--teal)}
.fbb{border-color:var(--teal);background:var(--teal-tint)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:all .25s;font-size:.92rem;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}

.nav{display:flex;justify-content:space-between;gap:10px;margin-block:30px 10px}
.backup{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:grid;gap:10px;margin-bottom:20px}
footer{text-align:center;color:var(--ink-soft);font-size:.85rem;padding-block:40px 30px;border-top:1px solid var(--line);margin-top:30px}
footer .brand{font-family:var(--display);font-style:italic;color:var(--amber)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="hero">
    <p class="eyebrow">Self-Directed Learning Compass</p>
    <h1>自主學習選題羅盤</h1>
    <p>從認識自己開始，經過發散、篩選、聚焦、定型四個步驟，找到一個你有興趣、做得到、又能展現跨領域能力的自主學習主題。</p>
    <div class="toolbar">
      <button class="btn ghost sm" data-act="backup">進度碼：換裝置接著做</button>
      <button class="btn ghost sm" data-act="askclear">全部清空</button>
    </div>
  </header>
  <div id="notice"></div>
  <nav class="stepper" aria-label="步驟"><div class="steps" id="steps"></div></nav>
  <main id="panel"></main>
  <footer><span class="brand">Gina教室的AI奇蹟</span> · 你的答案只存在這台裝置的瀏覽器裡，換裝置請用「進度碼」。</footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===== 老師設定：部署 Apps Script 後，把「網頁應用程式網址」貼在引號中間 ===== */
const SCRIPT_URL='';
/* ============================================================================ */

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getP(path){return path.split('.').reduce((o,k)=>o==null?o:o[k],S)}

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}

function genPlan(weeks,form){
 weeks=Math.max(1,parseInt(weeks)||16);const ph=PHASES[form]||PHASES['書面報告'];
 let lens=ph.map(p=>Math.max(1,Math.round(p[1]*weeks)));
 let diff=weeks-lens.reduce((a,b)=>a+b,0);let i=0;
 while(diff!==0&&i<200){const k=i%lens.length;if(diff>0){lens[k]++;diff--}else if(lens[k]>1){lens[k]--;diff++}i++}
 let w=1;return ph.map((p,k)=>{const a=w,b=w+lens[k]-1;w=b+1;return{w:a===b?`第 ${a} 週`:`第 ${a}–${b} 週`,task:p[0]}});
}

function rqWarn(t){const w=[];t=(t||'').trim();if(!t)return w;
 if(/探討|淺談|之研究|研究$/.test(t))w.push('看起來像報告標題，請改寫成一個問句。');
 if(!/[？?]\s*$/.test(t.replace(/（範圍：.*）$/,'')))w.push('結尾不是問號。研究問題要寫成問句。');
 if((t.match(/[？?]/g)||[]).length>1)w.push('問了不只一個問題。留一個主問題，其他寫到子問題。');
 if(!/(學生|同學|民眾|居民|顧客|店|人|班|校|家|區|市|縣|鎮|國小|國中|高中|網站|平台|品牌|產品|樣本|植物|動物)/.test(t))w.push('看不出研究對象是誰或什麼。');
 else if(/影響/.test(t)&&!/(數|量|分數|時數|比例|次)/.test(t))w.push('「影響」太籠統。寫出要測量的東西，例如次數、分數、時數。');
 if(t.length<15)w.push('有點短，可能還不夠具體。');
 if(t.length>80)w.push('有點長，可能一次放了太多東西。');
 return w;}

 const rf=S.refine.forId===S.final;

}

function promptText(){const p=S.profile;return`你是我的高中自主學習教練。請不要直接替我完成作業，而是用提問和建議，幫我把計畫變得更具體、更可行。

1. 用「對象明確、可以測量、做得完、答案不是查得到的、只問一件事、有意義」六個標準檢查我的研究問題，指出哪一項最弱，並給我 2 種修改方向（不要直接幫我定稿）。

每次回覆的最後，請整理「目前進度＋下一步」。`}

function fbKey(){return S.feedback.at||S.feedback.text}
function fbCard(){const f=S.feedback;if(!f.text)return'';
 return`<div class="fbcard"><div class="fbh"><span class="eyebrow">From Your Teacher</span><b>老師的建議</b>${f.at?`<span class="mini">${esc(f.at)}</span>`:''}</div><p>${esc(f.text).replace(/\n/g,'<br>')}</p><p class="mini">依建議修改後，回到這裡按「更新送出的企劃書」。</p></div>`}
async function checkFeedback(silent){
 if(!SCRIPT_URL||S.sample)return;
 const c=String(S.student.cls).trim(),s=String(S.student.seat).trim(),n=String(S.name).trim(),k=String(S.code).trim();
 if(!c||!s||!n||!k){if(!silent)toast('請先填好班級、座號、姓名和班級代碼');return}
 try{const r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'feedback',code:k,cls:c,seat:s,name:n})});const j=await r.json();
  if(!j.ok){if(!silent)toast(j.msg||'暫時查不到，請稍後再試');return}
  if(!j.feedback){if(!silent)toast('老師還沒有寫建議');return}
  S.feedback.text=j.feedback;S.feedback.at=j.at||'';save();render();if(!silent)toast('已取得老師建議');
 }catch(e){if(!silent)toast('連不上，請確認網路後再試')}}
function render(){if(cur===LAST&&S.feedback.text&&fbKey()!==S.feedback.seen){S.feedback.seen=fbKey();save()}renderSteps();renderNotice();const pn=document.getElementById('panel');pn.innerHTML=`<div class="fade">${R[cur]()}</div>`}
function refreshLight(){renderSteps();const s=document.getElementById('summary');if(s)s.innerHTML=summaryInner();
 const d=document.getElementById('rdraft');if(d)d.innerHTML=draftHTML();const w=document.getElementById('rwarn');if(w)w.innerHTML=warnHTML()}

async function submit(){
 const st=document.getElementById('sendStatus');const say=(m,bad)=>{st.innerHTML=m;st.style.color=bad?'#B91C1C':'var(--teal)'};
 if(sending)return;
 if(S.sample){say('範例資料無法送出。',true);return}
 if(!SCRIPT_URL){say('老師還沒設定送出網址。',true);return}
 const c=String(S.student.cls).trim(),s=String(S.student.seat).trim(),n=String(S.name).trim();
 if(!c||!s||!n){say('請填寫班級、座號和姓名。',true);return}
 if(!String(S.code).trim()){say('請輸入班級代碼。',true);return}
 if(!done(3)){say('還沒選定主題或寫下研究問題，請先完成「聚焦」這一步。',true);return}
 const d=proposal(),p=S.profile;
 const payload={code:String(S.code).trim(),cls:c,seat:s,name:n,title:d.title,doms:d.doms.join(' × '),rq:d.rq,scope:d.scope,subq:d.sub,checks:`${d.checks} / ${CHECKS.length}`,reason:d.reason,
  show:d.show.join('、'),groups:d.groups.join('、'),form:d.form,methods:d.methods.join('、'),hours:d.hours,weeks:d.weeks,
  res:d.res.join('、'),risk:d.risk,need:d.need,plan:d.plan.map(r=>`${r.w}　${r.task}`).join('\n'),present:d.present,
  interests:[p.q1,p.q2,p.q3].filter(Boolean).join('\n'),skills:SKILLS.map(([k,t])=>`${t}：${LEVELS[p.skills[k]]}`).join('\n'),
  ideaCount:S.ideas.length,backup:encode()};
 sending=true;say('送出中…');
 try{
  const r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(payload)});
  const j=await r.json();
  if(!j.ok){say(esc(j.msg||'送出失敗，請再試一次。'),true);return}
  S.submittedAt=new Date().toLocaleString('zh-TW',{hour12:false});save();
  say(`已送出！這是你第 ${esc(j.count)} 次送出，老師那邊已更新為最新版本（${esc(S.submittedAt)}）。`);
  toast('已送出給老師');
 }catch(e){say('送不出去。請確認網路連線，並用老師發的正式網址開啟這個工具後再試一次。',true)}
 finally{sending=false}
}
function encode(){try{return btoa(unescape(encodeURIComponent(JSON.stringify(S))))}catch(e){return''}}
async function copy(text,msg,fallbackId){
 try{await navigator.clipboard.writeText(text);toast(msg)}catch(e){
  let el=fallbackId&&document.getElementById(fallbackId);
  if(!el){el=document.createElement('textarea');el.className='copybox';el.id='fb';el.readOnly=true;document.querySelector('.copyarea')?.appendChild(el)}
  el.value=text;el.focus();el.select();toast('請長按或按 Ctrl+C 複製選取的文字')}
}

document.addEventListener('input',e=>{const t=e.target,p=t.dataset.path;if(!p)return;
 setP(p,t.type==='number'?(t.value===''?'':+t.value):t.value);save();refreshLight();});

document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.go!=null){cur=+d.go;render();document.querySelector('.stepper').scrollIntoView({behavior:'smooth'});return}
 if(d.toggle){const arr=getP(d.toggle)||[];const i=arr.indexOf(d.val);if(i>=0)arr.splice(i,1);else{if(d.max&&arr.length>=+d.max){toast(`最多選 ${d.max} 個`);return}arr.push(d.val)}setP(d.toggle,arr);save();render();return}
 if(d.set){const cv=getP(d.set);let v=isNaN(+d.val)?d.val:+d.val;if(String(cv)===String(v)&&typeof v==='string')v='';setP(d.set,v);save();render();return}
 const a=d.act;if(!a)return;
 switch(a){
  case'start':S=blank();save();cur=0;ui.seed=0;ui.newDoms=[];render();toast('已清空，開始填寫你的輪廓');break;
  case'askclear':ui.confirmClear=true;renderNotice();window.scrollTo({top:0,behavior:'smooth'});break;
  case'cancelclear':ui.confirmClear=false;renderNotice();break;
  case'clear':S=blank();ui.confirmClear=false;save();cur=0;render();toast('已清空');break;
  case'backup':ui.backup=!ui.backup;renderNotice();break;
  case'copybk':copy(encode(),'已複製進度碼','bkOut');break;
  case'import':{const v=document.getElementById('bkIn').value.trim();try{const o=JSON.parse(decodeURIComponent(escape(atob(v))));if(!o.profile)throw 0;S=Object.assign(blank(),o);save();ui.backup=false;render();toast('已讀入進度')}catch(err){toast('進度碼不完整，請重新複製整串再貼上')}break}
  case'seed':ui.seed=+d.i;render();break;
  case'spark':{const seed=S.seeds[ui.seed];if(!seed){toast('先在上面寫下興趣點');document.getElementById('seed'+ui.seed)?.focus();return}
   const t=LENSES.find(l=>l[0]===d.lens)[1].replace('{x}',seed);ui.newDoms=[d.lens];render();const el=document.getElementById('newTitle');el.value=t;el.focus();break}
  case'dom':{const i=ui.newDoms.indexOf(d.val);if(i>=0)ui.newDoms.splice(i,1);else{if(ui.newDoms.length>=2)ui.newDoms.shift();ui.newDoms.push(d.val)}
   const keep=document.getElementById('newTitle').value;render();document.getElementById('newTitle').value=keep;break}
  case'add':{const el=document.getElementById('newTitle');const t=el.value.trim();if(!t){toast('先寫下題目想法');el.focus();return}
   S.ideas.push({id:S.nextId++,title:t,doms:[...ui.newDoms],scores:{i:3,d:3,r:3,f:3},pick:false});ui.newDoms=[];save();render();toast(`已加入第 ${S.ideas.length} 個想法`);document.getElementById('newTitle').focus();break}
  case'del':{const x=S.ideas.splice(+d.i,1)[0];delete S.focus[x.id];if(S.final===x.id)S.final=null;save();render();break}
  case'sort':S.ideas.sort((a,b)=>total(b)-total(a));save();render();break;
  case'pick':{const x=S.ideas[+d.i];if(!x.pick&&pickedIdeas().length>=3){toast('已經選了 3 個，先取消一個');return}x.pick=!x.pick;if(!x.pick&&S.final===x.id)S.final=null;save();render();break}
  case'final':S.final=+d.id;save();render();break;
  case'tpl':{const id=d.id;S.focus[id]=S.focus[id]||{};S.focus[id].rq=d.t;save();render();const el=document.getElementById('rq'+id);el.focus();el.setSelectionRange(0,0);break}
  case'form':S.form=d.val;if(!S.plan.length)S.plan=genPlan(S.profile.weeks,S.form);save();render();break;
  case'gen':S.plan=genPlan(S.profile.weeks,S.form||recForm());save();render();toast('已產生進度草稿，可以直接修改');break;
  case'addrow':S.plan.push({w:'第 ? 週',task:''});save();render();break;
  case'delrow':S.plan.splice(+d.i,1);save();render();break;
  case'copyprop':copy(proposalText(),'已複製企劃書');break;
  case'copyprompt':copy(promptText(),'已複製，貼到 AI 新對話就能開始');break;
  case'submit':submit();break;
  case'fb':checkFeedback(false);break;
  case'usedraft':{const d=compose();if(!d)return;S.refine.rq=d;S.refine.forId=S.final;save();render();const el=document.getElementById('rrq');el.focus();toast('已套用，可以再修改得更順');break}
  case'startrefine':S.refine={forId:S.final,who:'',what1:'',what2:'',scope:'',type:'',rq:'',sub:'',checks:[]};save();render();break;
 }
});
render();
checkFeedback(true);
</script>
