<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>實作發想工坊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FDF8F1; --bg-warm:#F7EFE3; --card:#FFFFFF;
  --amber:#D97706; --amber-deep:#B45309; --amber-dark:#92400E; --amber-tint:#FDF0DC;
  --teal:#0F766E; --teal-soft:#5EAEA6; --teal-tint:#E3F2EF;
  --ink:#2E2419; --ink-soft:#6B5D4F; --line:#E8DCCB; --on-amber:#FFFFFF;
  --bad:#B91C1C; --bad-tint:#FDECEC;
  --shadow:0 4px 20px rgba(146,64,14,.08); --shadow-lg:0 12px 40px rgba(146,64,14,.12);
  --radius:18px; --radius-sm:12px;
  --serif:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --display:'Playfair Display',Georgia,'Noto Serif TC',serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1B1611; --bg-warm:#231C15; --card:#2A221A;
    --amber:#F59E0B; --amber-deep:#FBBF24; --amber-dark:#FCD34D; --amber-tint:#3A2A14;
    --teal:#5EC4B8; --teal-soft:#5EAEA6; --teal-tint:#17332F;
    --ink:#F3E9DC; --ink-soft:#BFAF9C; --line:#3E3228; --on-amber:#1B1611;
    --bad:#F87171; --bad-tint:#3A1C1C;
    --shadow:0 4px 20px rgba(0,0,0,.35); --shadow-lg:0 12px 40px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1B1611; --bg-warm:#231C15; --card:#2A221A;
  --amber:#F59E0B; --amber-deep:#FBBF24; --amber-dark:#FCD34D; --amber-tint:#3A2A14;
  --teal:#5EC4B8; --teal-soft:#5EAEA6; --teal-tint:#17332F;
  --ink:#F3E9DC; --ink-soft:#BFAF9C; --line:#3E3228; --on-amber:#1B1611;
  --bad:#F87171; --bad-tint:#3A1C1C;
  --shadow:0 4px 20px rgba(0,0,0,.35); --shadow-lg:0 12px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.8;padding:0 16px}
.wrap{max-width:900px;margin:0 auto}
h1,h2,h3,h4{text-wrap:balance;line-height:1.35;margin:0}
p{margin:0}
button,input,textarea,select{font-family:inherit;font-size:1rem;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
a{color:var(--amber-dark)}

.hero{padding-block:36px 18px;display:grid;gap:10px}
.eyebrow{font-family:var(--display);font-style:italic;color:var(--amber);letter-spacing:.06em;font-size:.95rem}
.hero h1{font-size:clamp(1.9rem,6vw,2.8rem);font-weight:700}
.hero p{color:var(--ink-soft);max-width:38em}

.btn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--amber);color:var(--on-amber);font-weight:600;padding:10px 22px;border-radius:999px;cursor:pointer;transition:background .2s,transform .2s;text-decoration:none}
.btn:hover{background:var(--amber-deep);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--amber-dark);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--amber);background:var(--amber-tint)}
.btn.teal{background:var(--teal);color:var(--card)}
.btn.sm{padding:6px 14px;font-size:.9rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.linkbtn{background:none;border:0;color:var(--amber-dark);cursor:pointer;font-size:.9rem;text-decoration:underline;padding:2px 4px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.ctx{display:grid;gap:10px;margin-bottom:26px}
.ctx .k,.k{font-size:.8rem;letter-spacing:.08em;color:var(--ink-soft);font-weight:600;display:block}
.ctx .rq{font-size:1.12rem;font-weight:700;line-height:1.6}
.tag{display:inline-block;background:var(--bg-warm);border-radius:6px;padding:1px 8px;margin:2px 4px 2px 0;font-size:.88rem}
.tag.teal{background:var(--teal-tint);color:var(--teal)}
.tag.amber{background:var(--amber-tint);color:var(--amber-dark)}
.mini{font-size:.9rem;color:var(--ink-soft);line-height:1.65}
.empty{color:var(--ink-soft);font-style:italic}

.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:20px}
.mod{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:20px;cursor:pointer;display:grid;gap:8px;align-content:start;position:relative;transition:transform .25s,box-shadow .25s,border-color .25s}
.mod:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--amber)}
.mod .num{font-family:var(--display);font-size:2.2rem;font-weight:700;color:var(--amber);line-height:1}
.mod h3{font-size:1.2rem}
.mod .en{font-family:var(--display);font-style:italic;color:var(--ink-soft);font-size:.85rem}
.mod p{font-size:.92rem;color:var(--ink-soft);line-height:1.65}
.mod .stuck{font-size:.85rem;border-top:1px dashed var(--line);padding-top:8px;color:var(--amber-dark)}
.mod .use{position:absolute;top:16px;right:16px;background:var(--teal);color:var(--card);font-size:.75rem;padding:2px 10px;border-radius:99px;font-weight:600}

.mhead{display:grid;gap:6px;margin-block:8px 16px}
.mhead h2{font-size:clamp(1.5rem,4.5vw,2.1rem)}
.mhead h2::after{content:'';display:block;width:48px;height:3px;background:var(--amber);border-radius:2px;margin-top:12px}
.ctxbar{background:var(--bg-warm);border-radius:var(--radius-sm);padding:10px 14px;font-size:.92rem;margin-bottom:18px;line-height:1.6}
.ctxbar b{color:var(--amber-dark)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:22px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px;cursor:pointer;white-space:nowrap;font-size:.94rem;color:var(--ink-soft)}
.tab.on{border-color:var(--amber);background:var(--amber);color:var(--on-amber);font-weight:600}
.tab.home{color:var(--amber-dark);font-weight:600}

.sec{display:grid;gap:16px;margin-bottom:32px}
.stitle{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:1.15rem;font-weight:700;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.stitle small{font-weight:400;color:var(--ink-soft);font-size:.88rem}
.lead{color:var(--ink-soft);font-size:.95rem}
.q{display:grid;gap:6px}
.q label,.qlabel{font-weight:600;font-size:.95rem}
textarea,input[type=text],input[type=number],input[type=url]{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:9px 13px;line-height:1.7}
textarea{min-height:80px;resize:vertical}
textarea:focus,input:focus{border-color:var(--amber);outline:none}
::placeholder{color:var(--ink-soft);opacity:.7}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:620px){.grid2,.grid3{grid-template-columns:1fr}}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:.92rem}
.chip:hover{border-color:var(--amber)}
.chip.on{background:var(--amber);border-color:var(--amber);color:var(--on-amber);font-weight:600}
.chip.teal.on{background:var(--teal);border-color:var(--teal);color:var(--card)}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 13px;font-size:.88rem;cursor:pointer;color:var(--ink-soft)}
.seg button.on{background:var(--amber);border-color:var(--amber);color:var(--on-amber);font-weight:600}

.res{border-radius:var(--radius-sm);padding:12px 16px;font-size:.94rem;line-height:1.7}
.res b.h{display:block;font-size:.8rem;letter-spacing:.08em}
.res ul{margin:4px 0 0;padding-left:1.2em}
.res li+li{margin-top:4px}
.res.warn{background:var(--amber-tint);color:var(--amber-dark)}
.res.ok{background:var(--teal-tint);color:var(--teal)}
.res.bad{background:var(--bad-tint);color:var(--bad)}
.res.neutral{background:var(--bg-warm);color:var(--ink)}
.out{background:var(--card);border:2px dashed var(--amber);border-radius:var(--radius-sm);padding:14px 16px;display:grid;gap:8px}
.out pre{white-space:pre-wrap;word-break:break-word;margin:0;font-family:var(--serif);font-size:.93rem;line-height:1.75}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88rem;background:var(--bg-warm);border-radius:8px;padding:8px 12px;word-break:break-all}

.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 14px}
.item .n{font-family:var(--display);color:var(--amber);font-weight:700;min-width:1.5em;font-variant-numeric:tabular-nums}
.item .t{font-weight:600;line-height:1.6}
.xbtn{border:0;background:transparent;color:var(--ink-soft);cursor:pointer;font-size:1.2rem;line-height:1;padding:6px}
.xbtn:hover{color:var(--bad)}

table.tb{width:100%;border-collapse:collapse;font-size:.92rem}
.tbwrap{overflow-x:auto}
.tb th,.tb td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tb th{font-size:.8rem;letter-spacing:.06em;color:var(--ink-soft);font-weight:600}
.tb td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:10px;background:var(--bg-warm);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--amber);border-radius:99px}

.checkrow{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px}
.checkrow.on{background:var(--teal-tint);border-color:var(--teal-soft)}
.box{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--card);cursor:pointer;color:var(--card);font-weight:700;display:grid;place-items:center;padding:0}
.checkrow.on .box{background:var(--teal);border-color:var(--teal)}
.checkrow p{font-size:.9rem;color:var(--ink-soft);line-height:1.6}

.credrow{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 14px}
@media (max-width:560px){.credrow{grid-template-columns:1fr}}

.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.cmp{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;display:grid;gap:6px;font-size:.92rem}
.cmp .bad s{text-decoration-color:var(--bad);text-decoration-thickness:2px;color:var(--ink-soft)}
.cmp .good{font-weight:600;border-left:3px solid var(--teal);padding-left:10px}

.seg-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 14px;display:grid;gap:6px}
.seg-card .quote{line-height:1.7}
.seg-card .quote::before{content:'「';color:var(--amber)}
.seg-card .quote::after{content:'」';color:var(--amber)}
.seg-card input{padding:6px 12px}

.chartpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cp{border:1.5px solid var(--line);background:var(--card);border-radius:var(--radius-sm);padding:12px;cursor:pointer;text-align:left;font-size:.92rem;line-height:1.55}
.cp.on{border-color:var(--amber);background:var(--amber-tint);font-weight:600}
.rec{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:center}
@media (max-width:560px){.rec{grid-template-columns:1fr}}
.rec svg{width:100%;max-width:180px;height:auto}
svg .axis{stroke:var(--ink-soft);stroke-width:1}
svg .grid{stroke:var(--line);stroke-width:1}
svg .dot{fill:var(--amber);fill-opacity:.8}
svg .trend{stroke:var(--teal);stroke-width:2;stroke-dasharray:5 4}
svg .lbl{fill:var(--ink-soft);font-size:11px;font-family:var(--serif)}
svg .f1{fill:var(--amber)} svg .f2{fill:var(--teal)} svg .f3{fill:var(--amber-tint);stroke:var(--amber);stroke-width:1.5} svg .f4{fill:var(--line)}
svg .ln{fill:none;stroke:var(--amber);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.scatter{width:100%;max-width:440px;height:auto;display:block}
.stat{display:flex;flex-wrap:wrap;gap:10px}
.stat div{background:var(--bg-warm);border-radius:var(--radius-sm);padding:8px 14px}
.stat b{display:block;font-family:var(--display);font-size:1.5rem;color:var(--amber-dark);font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.8rem;color:var(--ink-soft)}

.quiz{display:grid;gap:8px}
.qz{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 14px}
.qz .fb{grid-column:1/-1;font-size:.88rem}
@media (max-width:560px){.qz{grid-template-columns:1fr}}

.ai{background:var(--card);border:2px solid var(--teal-soft);border-radius:var(--radius);padding:20px;display:grid;gap:12px;margin-top:10px}
.ai h3{font-size:1.1rem;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.ai textarea{min-height:160px;font-size:.88rem;line-height:1.65;background:var(--bg)}
.ai .note{font-size:.85rem;color:var(--ink-soft);border-left:3px solid var(--amber);padding-left:10px}

.banner{background:var(--teal-tint);border:1px solid var(--teal-soft);border-radius:var(--radius-sm);padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;font-size:.95rem;margin-bottom:16px}
.reply{background:var(--teal-tint);border-radius:var(--radius-sm);padding:10px 14px;font-size:.93rem}
.reply b{color:var(--teal)}
.plan{display:grid;gap:4px;font-size:.92rem}
.plan div{display:grid;grid-template-columns:110px 1fr;gap:10px;border-bottom:1px dotted var(--line);padding-block:4px}
.plan span:first-child{color:var(--amber-dark);font-weight:600;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:all .25s;font-size:.92rem;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;color:var(--ink-soft);font-size:.85rem;padding-block:40px 30px;border-top:1px solid var(--line);margin-top:30px}
footer .brand{font-family:var(--display);font-style:italic;color:var(--amber)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.rule{background:var(--amber-tint);border-radius:var(--radius-sm);padding:12px 16px;color:var(--amber-dark);font-size:.95rem;margin-bottom:22px}
.btn.danger{background:var(--bad);color:#fff}
.stepper{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:24px}
.steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:1 0 auto;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px 6px 6px;cursor:pointer;white-space:nowrap;font-size:.92rem;color:var(--ink-soft)}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg-warm);font-family:var(--display);font-weight:700;font-size:.9rem;color:var(--amber-dark)}
.step.done .n{background:var(--teal);color:var(--card)}
.step.on{border-color:var(--amber);color:var(--ink);font-weight:600;background:var(--amber-tint)}
.step.on .n{background:var(--amber);color:var(--on-amber)}
.sparks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.spark{text-align:left;border:1px dashed var(--line);background:var(--card);border-radius:var(--radius-sm);padding:9px 12px;cursor:pointer;font-size:.92rem;line-height:1.55}
.spark:hover{border-color:var(--amber);border-style:solid}
.spark b{color:var(--amber-dark);display:flex;gap:8px;align-items:baseline;font-size:.82rem;letter-spacing:.04em}
.spark b span{font-weight:400;color:var(--ink-soft);font-size:.76rem}
.meter{display:flex;align-items:center;gap:12px;font-size:.92rem}
.meter .bar{flex:1;height:8px}
.meter .bar i.ok{background:var(--teal)}
.fcard{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:grid;gap:14px;box-shadow:var(--shadow)}
.fcard.picked{border-color:var(--teal);background:linear-gradient(0deg,var(--teal-tint),var(--card) 60%)}
.fcard.final{border:2px solid var(--amber)}
.fcard .t{font-weight:700;line-height:1.55}
.sc-top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.total{font-family:var(--display);font-weight:700;font-size:1.5rem;color:var(--amber-dark);font-variant-numeric:tabular-nums;line-height:1}
.total small{font-size:.75rem;color:var(--ink-soft);font-family:var(--serif);font-weight:400}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.legend div{background:var(--bg-warm);border-radius:var(--radius-sm);padding:8px 12px;font-size:.86rem;line-height:1.55}
.legend b{display:block;font-size:.95rem}
.lights{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px}
@media (max-width:620px){.lights{grid-template-columns:1fr 1fr}}
.light .k{margin-bottom:3px}
.seg.tri{gap:4px}
.seg.tri button{padding:3px 11px;font-size:.84rem}
.seg.tri button.綠.on{background:var(--teal);border-color:var(--teal);color:var(--card)}
.seg.tri button.黃.on{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.seg.tri button.紅.on{background:var(--bad);border-color:var(--bad);color:#fff}
.radio{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;color:var(--amber-dark);border:1.5px solid var(--line);border-radius:999px;padding:4px 14px 4px 8px;background:var(--card);white-space:nowrap}
.radio .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--amber);display:grid;place-items:center}
.radio.on{background:var(--amber);color:var(--on-amber);border-color:var(--amber)}
.radio.on .dot{border-color:var(--on-amber)}
.radio.on .dot::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--on-amber)}
.cmp .k{margin-top:4px}
.evl{display:grid;gap:6px}
.evl div{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;border-radius:var(--radius-sm);padding:8px 12px;font-size:.9rem;background:var(--bg-warm)}
.evl .ev5{background:var(--teal-tint)} .evl .ev5 b{color:var(--teal)}
.evl .ev4{background:var(--teal-tint)} .evl .ev4 b{color:var(--teal)}
.evl .ev1{background:var(--bad-tint)} .evl .ev1 b{color:var(--bad)}
.evl span{color:var(--ink-soft)}
details.mini-sum{background:var(--bg-warm);border-radius:var(--radius-sm);padding:10px 16px;margin-bottom:18px}
details.mini-sum summary{cursor:pointer;font-weight:600;color:var(--amber-dark)}
table.mat input{padding:6px 8px;min-width:80px;font-size:.92rem}
table.mat td{padding:4px}
.plan input{padding:5px 8px;font-size:.92rem}

async function copy(text,msg){try{await navigator.clipboard.writeText(text);toast(msg||'已複製')}catch(e){const t=document.createElement('textarea');t.value=text;t.setAttribute('readonly','');t.style.cssText='position:fixed;left:16px;right:16px;bottom:80px;width:auto;height:160px;z-index:30';document.body.appendChild(t);t.focus();t.select();toast('請按 Ctrl+C（手機長按）複製選取的文字');setTimeout(()=>t.remove(),12000)}}
function encode(){try{return btoa(unescape(encodeURIComponent(JSON.stringify(S))))}catch(e){return''}}

function inp(path,ph,id,type='text'){return`<input type="${type}" id="${id||path.replace(/\./g,'-')}" data-path="${path}" value="${esc(getP(path))}" placeholder="${esc(ph)}">`}
function ta(path,ph,h,id){return`<textarea id="${id||path.replace(/\./g,'-')}" data-path="${path}" placeholder="${esc(ph)}" ${h?`style="min-height:${h}px"`:''}>${esc(getP(path))}</textarea>`}
function seg(path,opts,vals,keep){const v=getP(path);vals=vals||opts;return`<div class="seg" role="group">${opts.map((o,i)=>`<button data-set="${path}" data-val="${esc(vals[i])}" ${keep?'data-keep="1"':''} class="${String(v)===String(vals[i])?'on':''}" aria-pressed="${String(v)===String(vals[i])}">${esc(o)}</button>`).join('')}</div>`}
function chips(path,list,cls='',max=0){const a=getP(path)||[];return`<div class="chips">${list.map(v=>`<button class="chip ${cls} ${a.includes(v)?'on':''}" data-toggle="${path}" data-val="${esc(v)}" ${max?`data-max="${max}"`:''} aria-pressed="${a.includes(v)}">${esc(v)}</button>`).join('')}</div>`}
function sec(t,sm,body){return`<section class="sec"><div class="stitle">${t}${sm?`<small>${sm}</small>`:''}</div>${body}</section>`}
function resBox(kind,head,items){return`<div class="res ${kind}"><b class="h">${head}</b>${Array.isArray(items)?`<ul>${items.map(x=>`<li>${x}</li>`).join('')}</ul>`:items}</div>`}
function head(eb,t,rule){return`<div class="mhead"><p class="eyebrow">${eb}</p><h2>${t}</h2></div><p class="rule">${rule}</p>`}
const finalIdea=()=>S.ideas.find(x=>x.id===S.final);
const M=()=>S.mvp[S.final]||{};
const formOf=()=>finalIdea()?.form||'';
const lightScore=x=>FEAS.reduce((a,[k])=>a+({'綠':2,'黃':1,'紅':0}[x.f[k]]??0),0);
const reds=x=>FEAS.filter(([k])=>x.f[k]==='紅');
const matTotal=()=>S.plan.mat.reduce((a,m)=>a+(parseFloat(m.cost)||0),0);
const safeList=()=>[...SAFE_BASE,...(SAFE[formOf()]||[])];

function done(i){const m=S.me,f=M(),p=S.plan;switch(i){
 case 0:return!!(m.seeds.some(Boolean)&&m.budget&&m.weeks);
 case 1:return S.ideas.length>=8;
 case 2:return S.ideas.filter(x=>x.pick).length>=1&&S.ideas.filter(x=>x.pick).every(x=>FEAS.every(([k])=>x.f[k]));
 case 3:return!!(S.final&&f.can&&f.core&&f.success);
 case 4:return S.sci.filter(r=>r.part).length>=2&&S.sci.filter(r=>r.part).every((r,i)=>S.ev.some(e=>e.pi===S.sci.indexOf(r)));
 case 5:return!!(p.mat.length&&p.steps&&p.tv&&p.measures.length&&p.safe.length>=safeList().length);
 case 6:return[0,1,2,3,4,5].every(done)}}

/* ---------- 步驟 1 盤點 ---------- */
const R=[];
R[0]=()=>head('Step 1 · Take Stock','盤點：我有興趣什麼？我有什麼？','<strong>這一步的目的：</strong>好的實作題目，一半來自興趣，一半來自你手上已經有的東西。先誠實盤點，後面的點子才不會做到一半卡住。')+
 sec('我有興趣的事','寫 1–3 個，越具體越好',`<div class="grid3">${[0,1,2].map(i=>inp(`me.seeds.${i}`,['例如：健身運動','例如：零食','例如：烹飪'][i],`seed${i}`)).join('')}</div>`)+
 sec('我會的技能','會一點也算',chips('me.skills',SKILLS,'teal'))+
 sec('我用得到的設備','家裡、學校、借得到的都算',`${chips('me.tools',TOOLS,'teal')}${inp('me.toolNote','其他設備，或可以去哪裡借，例如：家政教室有探針溫度計','toolNote')}`)+
 sec('預算與時間','',`<div class="grid3"><div class="q"><label for="bud">材料預算（新台幣）</label>${inp('me.budget','例如：1500','bud','number')}</div><div class="q"><label for="wks">可以做幾週</label>${inp('me.weeks','例如：12','wks','number')}</div><div class="q"><label for="hrs">每週幾小時</label>${inp('me.hours','例如：3','hrs','number')}</div></div><div id="capout">${capOut()}</div>`)+
 sec('誰可以幫我','',`${chips('me.help',HELP,'teal')}${inp('me.helpNote','例如：家政老師可以指導；阿姨在餐廳工作','helpNote')}`)+nav();
function capOut(){const m=S.me,h=(+m.weeks||0)*(+m.hours||0),b=+m.budget||0;if(!h&&!b)return'';
 return`<div class="stat">${h?`<div><b>${h}</b><span>總共可投入的小時</span></div>`:''}${b?`<div><b>${b}</b><span>預算（元）</span></div>`:''}</div>
 <p class="mini">${h&&h<25?'時間不多：選一個一兩次就能做出原型的點子。':h>=50?'時間充裕：可以做出第一版後再改良一到兩次。':h?'時間中等：做出第一版、改良一次，剛剛好。':''}${b&&b<500?' 預算有限：優先找家裡、學校現有的材料和設備。':''}</p>`}

/* ---------- 步驟 2 發想 ---------- */
R[1]=()=>{const seed=S.me.seeds[ui.seed]||'（先在步驟 1 寫興趣）',n=S.ideas.length;
 return head('Step 2 · Diverge','發想：從興趣長出成品點子','<strong>這一步的規則：</strong>先求多、不求好，至少想出 8 個點子。現在不用管做不做得到，下一步才篩選。')+
 sec('選一個興趣',`再點下面的提示當起點`,`<div class="chips">${[0,1,2].map(i=>`<button class="chip ${ui.seed===i?'on':''}" data-act="seed" data-i="${i}">${esc(S.me.seeds[i]||'興趣 '+(i+1))}</button>`).join('')}</div>`)+
 sec('提示 A：可以做成什麼形式？','',`<div class="sparks">${FORMS.map(([f,d,t])=>`<button class="spark" data-act="spark" data-form="${f}" data-t="${esc(t.replace('{x}',seed))}"><b>${f}<span>${d}</span></b>${esc(t.replace('{x}',seed))}</button>`).join('')}</div>`)+
 sec('提示 B：改造現有的東西','',`<div class="sparks">${SCAMPER.map(([k,t])=>`<button class="spark" data-act="spark" data-form="" data-t="${esc(t.replace('{x}',seed))}"><b>${k}</b>${esc(t.replace('{x}',seed))}</button>`).join('')}</div>`)+
 sec('寫下你的點子','',`<div class="card" style="display:grid;gap:12px"><div class="q"><label for="nt">點子</label><input type="text" id="nt" placeholder="例如：雞胸肉脆片（高蛋白零食）"></div>
  <div class="q"><label for="nw">做給誰用？</label><input type="text" id="nw" placeholder="例如：運動社同學"></div>
  <div class="q"><span class="qlabel">成品形式</span><div class="chips">${FORMS.map(([f])=>`<button class="chip teal ${ui.newForm===f?'on':''}" data-act="nform" data-f="${f}">${f}</button>`).join('')}</div></div>
  <div class="toolbar"><button class="btn" data-act="addIdea">加入清單</button></div></div>`)+
 sec('我的點子清單',`${n} / 8 個以上`,`<div class="meter"><div class="bar"><i class="${n>=8?'ok':''}" style="width:${Math.min(100,n/10*100)}%"></i></div><span>${n>=8?'夠多了，可以進入下一步':'再想 '+(8-n)+' 個'}</span></div>
  ${n?`<div class="list">${S.ideas.map((x,i)=>`<div class="item"><span class="n">${i+1}</span><div><div class="t">${esc(x.title)}</div><div>${x.form?`<span class="tag teal">${esc(x.form)}</span>`:''}${x.who?`<span class="tag">給：${esc(x.who)}</span>`:''}</div></div><button class="xbtn" data-act="delIdea" data-i="${i}" aria-label="刪除">×</button></div>`).join('')}</div>`:'<p class="empty">點上面的提示，或直接寫下點子。</p>'}`)+nav()};

/* ---------- 步驟 3 紅綠燈 ---------- */
R[2]=()=>{const np=S.ideas.filter(x=>x.pick).length;return head('Step 3 · Feasibility','可行性紅綠燈','<strong>這一步的規則：</strong>每個點子依六個面向亮燈。綠燈＝沒問題、黃燈＝有點挑戰但想得到辦法、紅燈＝目前做不到。最後挑 1–2 個進入下一步，紅燈不一定要放棄，但要先想好怎麼解決。')+
 miniMe()+
 `<div class="legend">${FEAS.map(([k,n,d])=>`<div><b>${n}</b>${d}</div>`).join('')}</div>
 <p class="mini" style="margin-block:14px">已選 <b style="color:var(--teal)">${np}</b> / 2 個</p>
 <div class="list">${S.ideas.length?S.ideas.map((x,i)=>{const r=reds(x),sc=lightScore(x),all=FEAS.every(([k])=>x.f[k]);return`<div class="fcard ${x.pick?'picked':''}">
  <div class="sc-top"><div><div class="t">${esc(x.title)}</div><div>${x.form?`<span class="tag teal">${esc(x.form)}</span>`:''}</div></div><div class="total">${all?sc:'–'}<small> /12</small></div></div>
  <div class="lights">${FEAS.map(([k,n])=>`<div class="light"><span class="k">${n}</span><div class="seg tri">${['綠','黃','紅'].map(c=>`<button class="${c} ${x.f[k]===c?'on':''}" data-set="ideas.${i}.f.${k}" data-val="${c}" aria-label="${n}${c}燈" aria-pressed="${x.f[k]===c}">${c}</button>`).join('')}</div></div>`).join('')}</div>
  ${r.length?resBox('bad',`${r.length} 個紅燈，想想怎麼解決`,r.map(([k,n])=>`<b>${n}</b>：${FIX[k]}`)):''}
  <button class="btn sm ${x.pick?'':'ghost'}" data-act="pick" data-i="${i}" style="justify-self:start">${x.pick?'✓ 已選入':'選這個進入下一步'}</button></div>`}).join(''):'<p class="empty">先回到「發想」寫下點子。</p>'}</div>`+nav()};
function miniMe(){const m=S.me;return`<details class="mini-sum"><summary>對照我的盤點</summary><p class="mini" style="margin-top:8px">技能：${esc(m.skills.join('、')||'未填')}<br>設備：${esc([...m.tools,m.toolNote].filter(Boolean).join('、')||'未填')}<br>預算 ${esc(m.budget||'?')} 元・${esc(m.weeks||'?')} 週 × 每週 ${esc(m.hours||'?')} 小時<br>幫手：${esc([...m.help,m.helpNote].filter(Boolean).join('、')||'未填')}</p></details>`}

/* ---------- 步驟 4 縮小 ---------- */
R[3]=()=>{const P=S.ideas.filter(x=>x.pick);return head('Step 4 · Scope Down','縮小：從夢想版到可做版','<strong>這一步的規則：</strong>先寫下最理想的樣子（夢想版），再用縮小策略，變成高中生在你的時間和預算內做得出來的版本（可做版）。可做版要有一個<strong>核心問題</strong>和<strong>可以測量的成功標準</strong>。')+
 sec('看看別人怎麼縮小','',`<div class="compare">${MVPEX.map(([a,b,c])=>`<div class="cmp"><span class="k">夢想版</span><span class="bad"><s>${esc(a)}</s></span><span class="k">可做版</span><span class="good">${esc(b)}</span><span class="mini">用了：${esc(c)}</span></div>`).join('')}</div>`)+
 (P.length?P.map(x=>{const m=S.mvp[x.id]||{},pre=`mvp.${x.id}`,w=successWarn(m.success);return`<div class="fcard ${S.final===x.id?'final':''}" style="margin-bottom:16px">
  <div class="sc-top"><div><h3 style="font-size:1.1rem">${esc(x.title)}</h3>${x.form?`<span class="tag teal">${esc(x.form)}</span>`:''}</div><button class="radio ${S.final===x.id?'on':''}" data-act="final" data-id="${x.id}"><span class="dot"></span>${S.final===x.id?'就做這個':'選這個'}</button></div>
  <div class="q"><label for="dr${x.id}">夢想版：最理想的樣子</label>${ta(pre+'.dream','不用管做不做得到，例如：可以上架販售的高蛋白零食品牌',56,'dr'+x.id)}</div>
  <div class="q"><span class="qlabel">縮小策略（可複選）</span><div class="chips">${STRAT.map(([s,d])=>{const on=(m.strat||[]).includes(s);return`<button class="chip ${on?'on':''}" data-toggle="${pre}.strat" data-val="${esc(s)}" title="${esc(d)}" aria-pressed="${on}">${esc(s)}</button>`}).join('')}</div><p class="mini">${STRAT.map(([s,d])=>`${s}：${d}`).join('　')}</p></div>
  <div class="q"><label for="cn${x.id}">可做版：你實際要做出來的東西</label>${ta(pre+'.can','例如：用家用烤箱做出不散開、會脆的雞胸肉脆片，找出最適合的烘乾溫度',56,'cn'+x.id)}</div>
  <div class="q"><label for="co${x.id}">核心問題：這個成品要驗證的一件事</label>${ta(pre+'.core','例如：烘乾溫度如何影響雞胸肉脆片的脆度？',50,'co'+x.id)}</div>
  <div class="q"><label for="su${x.id}">成功標準：做到什麼程度算成功？</label>${ta(pre+'.success','例如：脆度 ≥ 4 分；常溫 3 天不變軟；試吃平均 ≥ 4 分',56,'su'+x.id)}<div id="sw${x.id}">${w}</div></div></div>`}).join(''):'<p class="empty">先在「紅綠燈」選出 1–2 個點子。</p>')+nav()};
function successWarn(t){t=(t||'').trim();if(!t)return'';return/\d/.test(t)?resBox('ok','成功標準','有數字，可以測量。做完時就能清楚判斷成功了沒有。'):resBox('warn','成功標準','還不能測量。加上數字，例如「≥ 4 分」「3 天」「10 次成功 8 次」「比原本少 20%」。')}

/* ---------- 步驟 5 原理 ---------- */
function scholar(q){return'https://scholar.google.com/scholar?q='+encodeURIComponent(q)}
function google(q){return'https://www.google.com/search?q='+encodeURIComponent(q)}
function extraDB(){return{'吃的':[['衛福部食藥署','https://www.fda.gov.tw']],'種的養的':[['農業部','https://www.moa.gov.tw']],'電子程式':[['micro:bit 官方教學','https://microbit.org']]}[formOf()]||[]}
R[4]=()=>{const fin=finalIdea(),hints=HINTS[formOf()]||[];const L=(u,t)=>`<a class="btn sm ghost" href="${u}" target="_blank" rel="noopener">${t} ↗</a>`;
 return head('Step 5 · Science & Evidence','原理：成品背後的科學與佐證','<strong>這一步的規則：</strong>把成品想要的特性一個一個拆出來，每個特性背後都有一個科學問題。每個問題至少找到一個可信的佐證，你的做法才不是「憑感覺」。')+
 `<div class="ctxbar"><b>可做版：</b>${esc(M().can||fin?.title||'（先完成步驟 4）')}</div>`+
 sec('拆出成品的特性','點提示可以直接加入',`${hints.length?`<div class="chips">${hints.map(([p,c])=>`<button class="chip" data-act="addTrait" data-p="${esc(p)}" data-c="${esc(c)}">＋ ${esc(p)}</button>`).join('')}</div><p class="mini">提示會帶入相關的科學名詞，當作搜尋關鍵字的起點。</p>`:''}
  <div class="list">${S.sci.map((r,i)=>{const evs=S.ev.filter(e=>e.pi===i),best=Math.max(0,...evs.map(e=>(EVL.find(l=>l[0]===e.lv)||[])[2]||0));return`<div class="fcard" style="gap:10px"><div class="sc-top"><span class="k">特性 ${i+1}</span><button class="xbtn" data-act="delTrait" data-i="${i}" aria-label="刪除">×</button></div>
   <div class="grid2"><div class="q"><label for="sp${i}">想要的特性</label>${inp(`sci.${i}.part`,'例如：黏得住、不散開',`sp${i}`)}</div><div class="q"><label for="sq${i}">背後的科學問題</label>${inp(`sci.${i}.q`,'例如：肉泥為什麼加熱後會黏在一起？',`sq${i}`)}</div></div>
   <div class="grid2"><div class="q"><label for="sk${i}">中文關鍵字</label>${inp(`sci.${i}.kw`,'例如：蛋白質凝膠、黏著劑',`sk${i}`)}</div><div class="q"><label for="se${i}">英文關鍵字</label>${inp(`sci.${i}.en`,'例如：protein gelation binder',`se${i}`)}</div></div>
   <div class="toolbar">${r.kw?L(scholar(r.kw.replace(/、/g,' ')),'Google 學術（中）'):''}${r.en?L(scholar(r.en),'Google 學術（英）'):''}${r.kw?L(google(r.kw.replace(/、/g,' ')+' site:gov.tw'),'政府資料'):''}</div>
   <p class="mini">佐證：${evs.length?`${evs.length} 筆${best<=1?'，<b style="color:var(--bad)">目前只有影片或部落格，還需要更可信的來源</b>':''}`:'<b style="color:var(--amber-dark)">還沒有</b>'}</p></div>`}).join('')||'<p class="empty">還沒有特性。點上面的提示，或按下面的按鈕新增。</p>'}</div>
  <div class="toolbar"><button class="btn ghost sm" data-act="addTrait" data-p="" data-c="">＋ 新增特性</button></div>
  <p class="mini">其他資料庫（複製關鍵字貼進去搜尋）：</p><div class="toolbar">${L('https://ndltd.ncl.edu.tw','臺灣博碩士論文')}${L('https://www.shs.edu.tw','中學生網站')}${extraDB().map(([t,u])=>L(u,t)).join('')}</div>`)+
 sec('佐證的可信度','由高到低',`<div class="evl">${EVL.map(([n,d,s])=>`<div class="ev${s}"><b>${n}</b><span>${d}</span></div>`).join('')}</div><p class="mini">影片和部落格可以當作<b>靈感</b>，但不能當作<b>科學佐證</b>。AI 的回答也一樣：要追到原始來源才能引用。</p>`)+
 sec('新增一筆佐證','',S.sci.length?`<div class="q"><span class="qlabel">這筆佐證支持哪個特性？</span>${seg('evf.pi',S.sci.map((r,i)=>r.part||'特性 '+(i+1)),S.sci.map((r,i)=>String(i)),true)}</div>
  <div class="grid2"><div class="q"><label for="es">資料名稱</label>${inp('evf.src','作者或機構〈標題〉','es')}</div><div class="q"><label for="eu">網址</label>${inp('evf.url','https://…','eu')}</div></div>
  <div class="q"><span class="qlabel">來源類型</span>${seg('evf.lv',EVL.map(l=>l[0]),null,true)}</div>
  <div class="q"><label for="efd">它說了什麼（用自己的話）</label>${ta('evf.find','例如：加鹽攪打能讓蛋白質溶出，加熱後形成凝膠。',60,'efd')}</div>
  <div class="q"><label for="eus">這會怎麼影響我的做法？</label>${ta('evf.use','例如：固定鹽量 1.5%，攪打到黏稠。',60,'eus')}</div>
  <div class="toolbar"><button class="btn" data-act="addEv">加入佐證</button></div>`:'<p class="empty">先在上面新增特性。</p>')+
 sec('我的佐證',`${S.ev.length} 筆`,S.ev.length?`<div class="list">${S.ev.map((e,i)=>`<div class="item"><span class="n">${i+1}</span><div><div class="t">${esc(e.src)}</div><div><span class="tag teal">${esc(S.sci[e.pi]?.part||'特性 '+(e.pi+1))}</span><span class="tag ${e.lv==='影片部落格'?'amber':''}">${esc(e.lv)}</span></div>${e.find?`<p style="font-size:.93rem"><b>內容：</b>${nl(e.find)}</p>`:''}${e.use?`<p style="font-size:.93rem"><b>影響：</b>${nl(e.use)}</p>`:''}</div><button class="xbtn" data-act="delEv" data-i="${i}" aria-label="刪除">×</button></div>`).join('')}</div>`:'<p class="empty">還沒有佐證。</p>')+nav()};

  science:d.sci.map(r=>`${r.part}：${r.q}｜佐證 ${r.evs.length} 筆（${r.evs.map(e=>e.lv).join('、')||'無'}）`).join('\n'),
  budget:`${d.total} / ${d.budget||'?'} 元`,materials:d.mat.map(m=>`${m.item} ${m.qty} ${m.cost||0}元`).join('\n'),
  test:`改變：${d.tv}（${d.levels}）×${d.reps} 次\n控制：${d.controls}\n測量：${d.measures.join('、')}`,
  timeline:d.tl.map(r=>`${r.w} ${r.task}`).join('\n'),safety:`${d.safe.length} / ${safeList().length} 項`,full:proposalText(),backup:encode()});
  if(!j.ok){say(j.msg||'送出失敗，請再試一次。',true);return}
  S.submittedAt=new Date().toLocaleString('zh-TW',{hour12:false});save();say(`已送出！這是第 ${j.count} 次送出（${S.submittedAt}）。`);toast('已送出給老師')
 }catch(e){say('送不出去。請確認網路，並用老師發的正式網址開啟。',true)}finally{ui.sending=false}}
async function checkFb(silent){if(!SCRIPT_URL||S.sample||!S.submittedAt)return;
 try{const j=await post({action:'makerFb',code:String(S.code).trim(),cls:String(S.cls).trim(),seat:String(S.seat).trim(),name:String(S.name).trim()});
  if(!j.ok){if(!silent)toast(j.msg||'暫時查不到');return}if(!j.feedback){if(!silent)toast('老師還沒有寫建議');return}
  S.feedback.text=j.feedback;S.feedback.at=j.at||'';save();render();if(!silent)toast('已取得老師建議')}catch(e){if(!silent)toast('連不上，請稍後再試')}}

/* ---------- 事件 ---------- */
document.addEventListener('input',e=>{const t=e.target,p=t.dataset.path;if(!p)return;setP(p,t.value);save();refresh()});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.go!=null){cur=+d.go;render();document.querySelector('.stepper').scrollIntoView({behavior:'smooth'});return}
 if(d.toggle){const a=getP(d.toggle)||[];const i=a.indexOf(d.val);if(i>=0)a.splice(i,1);else{if(d.max&&a.length>=+d.max){toast(`最多選 ${d.max} 個`);return}a.push(d.val)}setP(d.toggle,a);save();render();return}
 if(d.set!=null){let v=d.val;if(!d.keep&&String(getP(d.set))===v)v='';setP(d.set,v);save();render();return}
 switch(d.act){
  case'start':S=blank();save();cur=0;render();scrollTo({top:0});toast('已清空，從盤點開始');break;
  case'askclear':ui.confirmClear=true;renderNotice();scrollTo({top:0,behavior:'smooth'});break;
  case'cancelclear':ui.confirmClear=false;renderNotice();break;
  case'clear':S=blank();ui.confirmClear=false;save();cur=0;render();toast('已清空');break;
  case'backup':ui.backup=!ui.backup;renderNotice();break;
  case'copyBk':copy(encode(),'已複製進度碼');break;
  case'import':{try{const o=JSON.parse(decodeURIComponent(escape(atob(document.getElementById('bkIn').value.trim()))));if(!o.me)throw 0;S=deepMerge(blank(),o);save();ui.backup=false;render();toast('已讀入進度')}catch(err){toast('進度碼不完整，請重新複製整串再貼上')}break}
  case'seed':ui.seed=+d.i;render();break;
  case'spark':{const t=document.getElementById('nt');ui.newForm=d.form||ui.newForm;render();const n=document.getElementById('nt');n.value=d.t;n.focus();n.scrollIntoView({block:'center',behavior:'smooth'});break}
  case'nform':{const keep=[document.getElementById('nt').value,document.getElementById('nw').value];ui.newForm=ui.newForm===d.f?'':d.f;render();document.getElementById('nt').value=keep[0];document.getElementById('nw').value=keep[1];break}
  case'addIdea':{const t=document.getElementById('nt').value.trim(),w=document.getElementById('nw').value.trim();if(!t){toast('先寫下點子');return}
   S.ideas.push({id:S.nextId++,title:t,form:ui.newForm,who:w,f:{},pick:false});ui.newForm='';save();render();toast(`已加入第 ${S.ideas.length} 個點子`);break}
  case'delIdea':{const x=S.ideas.splice(+d.i,1)[0];delete S.mvp[x.id];if(S.final===x.id)S.final=null;save();render();break}
  case'pick':{const x=S.ideas[+d.i];if(!x.pick&&S.ideas.filter(y=>y.pick).length>=2){toast('最多選 2 個，先取消一個');return}x.pick=!x.pick;if(!x.pick&&S.final===x.id)S.final=null;if(x.pick&&S.final==null)S.final=x.id;save();render();break}
  case'final':S.final=+d.id;save();render();break;
  case'addTrait':S.sci.push({part:d.p,q:'',kw:d.c,en:''});save();render();break;
  case'delTrait':{const i=+d.i;S.sci.splice(i,1);S.ev=S.ev.filter(e=>e.pi!==i).map(e=>({...e,pi:e.pi>i?e.pi-1:e.pi}));save();render();break}
  case'addEv':{const f=S.evf||{};if(f.pi==null||f.pi===''){toast('先選這筆佐證支持哪個特性');return}if(!(f.src||'').trim()){toast('至少寫下資料名稱');return}
   S.ev.push({pi:+f.pi,src:f.src.trim(),lv:f.lv||'專業網站',url:f.url||'',find:f.find||'',use:f.use||''});S.evf={pi:f.pi,src:'',lv:'',url:'',find:'',use:''};save();render();toast('已加入佐證');break}
  case'delEv':S.ev.splice(+d.i,1);save();render();break;
  case'addMat':S.plan.mat.push({item:'',qty:'',cost:'',src:'',alt:''});save();render();break;
  case'delMat':S.plan.mat.splice(+d.i,1);save();render();break;
  case'genTL':S.plan.tl=genTL(S.me.weeks);save();render();toast('已產生時程，可以直接修改');break;
  case'copyProp':copy(proposalText(),'已複製企劃書');break;
  case'copyAI':copy(document.getElementById('aiText').value,'已複製，貼到 AI 新對話就能開始');break;
  case'submit':submit();break;
  case'fb':checkFb(false);break;
 }});
render();checkFb(true);
</script>
