    el('div', {class:'row'}, el('button', {type:'button', class:'btn', id:'cardBtn', onclick:runCard}, icon('spark'), '做一張口條卡'), el('button', {type:'button', class:'btn ghost', id:'stopBtn', hidden:true, onclick:() => ctl && ctl.abort()}, '停止')),
    el('div', {id:'cardStatus', 'aria-live':'polite'}), el('div', {id:'fallback', class:'fallback'})));
  const c = state.card || SAMPLE_CARD;
  const out = el('div', {class:'out', style:'margin-top:16px'});
  if (!state.card) out.append(el('p', {class:'exflag', text:'目前顯示的是範例「被動語態」。輸入你的概念，按「做一張口條卡」就會換成你的版本。'}));
  out.append(el('h3', {style:'font-size:1.15rem', text:`${c.concept}｜${c.grade}`}));
  const blk = (color, label, node) => el('div', {class:'oc', style:`--c:var(${color})`}, el('div', {class:'lbl', text:label}), node);
  const enLine = s => (s && c.lang === 'bi') ? el('p', {class:'sub', lang:'en', text:s}) : null;
  out.append(
    blk('--accent', '一句話講完', el('div', null, el('p', {text:c.oneline}), enLine(c.en && c.en.oneline))),
    blk('--second', '換個抽屜', el('p', {text:c.box})),
    blk('--second', '給一個畫面', el('p', {text:c.picture})),
    blk('--accent', '分三層講', el('ol', null, ...(c.layers || []).map(x => el('li', {text:x})))),
    blk('--bad', '先講常見誤解', el('p', {text:c.myth})),
    blk('--good', '跟學生有關', el('p', {text:c.care})),
    blk('--accent-deep', '開場 30 秒台詞', el('div', null, el('p', {text:c.open}), enLine(c.en && c.en.open))),
    blk('--accent-deep', '收尾台詞', el('div', null, el('p', {text:c.close}), enLine(c.en && c.en.close))));
  const st = el('p', {class:'status', id:'copyStatus', 'aria-live':'polite'});
  out.append(el('div', {class:'row'}, el('button', {type:'button', class:'btn ghost', onclick:async () => { try { await navigator.clipboard.writeText(cardText(c)); st.textContent = '已複製，可以貼到備課筆記。'; } catch(e){ st.textContent = '無法自動複製，請長按文字手動複製。'; } }}, icon('copy'), '複製這張卡')), st);
  w.append(out); sec.append(w);

function cardText(c){
  const bi = c.lang === 'bi', L = [`【${c.concept}｜${c.grade}】`, `一句話：${c.oneline}`];
  if (bi && c.en && c.en.oneline) L.push(`  EN: ${c.en.oneline}`);
  L.push(`換個抽屜：${c.box}`, `畫面：${c.picture}`, '三層：', ...(c.layers || []).map((x, i) => `  ${i+1}. ${x}`), `常見誤解：${c.myth}`, `跟學生有關：${c.care}`, `開場：${c.open}`);
  if (bi && c.en && c.en.open) L.push(`  EN: ${c.en.open}`);
  L.push(`收尾：${c.close}`); if (bi && c.en && c.en.close) L.push(`  EN: ${c.en.close}`);
  L.push('', '— 白話拆解教室｜Gina教室的AI奇蹟');
  return L.join('\n');
}
function cardPrompt(){
  const langRule = state.lang === 'zh' ? '所有欄位用繁體中文；en 物件的三個欄位留空字串。'
    : state.lang === 'bi' ? '所有欄位用繁體中文；en 物件裡的 oneline、open、close 另外寫成 CEFR B1–B2 的口語英文，句子短、常用字。'
    : '所有欄位都改用 CEFR B1–B2 的口語英文（短句、常用字）；en 物件的三個欄位留空字串。';
  return `你是台灣高中的資深英文老師，也是很會把複雜概念講清楚的講者。你的說法借鏡沈伯洋拆解議題的方式：先講結論、換個熟悉的抽屜、給看得到的畫面、分層編號、先講誤解、接到聽眾身上、收在一個小行動。

請為「${(state.concept || '').trim().slice(0, 200)}」做一張課堂口條卡，對象是台灣${state.grade}學生。
規則：
- 每句話要能直接在教室說出口：短句、口語、不要學術腔。
- 比喻用高中生熟悉的東西（手機、遊戲、超商、捷運、社群、運動等），而且要準確，不能誤導概念。
- 只寫正確的內容，不確定就不要寫；不要編造數據或考試題號。
- ${langRule}

只回傳 JSON：
{"oneline":"一句話講完（25 字以內）","box":"它其實不是…，比較像是…","picture":"一個兩相對比或生活畫面","layers":["第一層","第二層","第三層"],"myth":"很多人以為…，其實…","care":"為什麼跟學生有關","open":"開場 30 秒台詞，含『今天只要記住一件事』與『為什麼跟你有關』","close":"收尾台詞：回到開場那句話，並給一個今天就能做的小行動","en":{"oneline":"","open":"","close":""}}`;
}
function setCardStatus(kind, msg){ const s = $('#cardStatus'); if (!s) return; s.textContent = ''; if (!kind) return; s.append(kind === 'think' ? el('div', {class:'thinking'}, el('span', {class:'dot'}), el('span', {text:msg})) : el('p', {class:'status' + (kind === 'err' ? ' err' : ''), text:msg})); }
async function runCard(){
  const concept = (state.concept || '').trim();
  if (!concept){ setCardStatus('err', '請先輸入一個概念，例如「分詞構句」。'); $('#concept').focus(); return; }
  const prompt = cardPrompt();
  if (!sample){ showFallback(prompt); return; }
  ctl = new AbortController(); $('#cardBtn').disabled = true; $('#stopBtn').hidden = false;
  setCardStatus('think', 'AI 正在做口條卡，約 10–40 秒……');
  try {
    const j = await sample.json(prompt, {signal: ctl.signal, modelTier:'default'});
    applyCard(j, concept);
  } catch(e){
    const code = e && e.code;
    if (code === 'cancelled') setCardStatus('info', '已停止。');
    else { setCardStatus('err', {rate_limited:'使用太頻繁，請稍等一下再試。', invalid_json:'AI 回覆不完整，請再按一次。', refused:'這個主題 AI 無法處理，換個說法試試。', session_expired:'登入已過期，請重新登入 Claude。'}[code] || '連線出了點問題，請再按一次。');
      if (['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)){ sample = null; showFallback(prompt); } }
  } finally { const b = $('#cardBtn'); if (b) b.disabled = false; const s = $('#stopBtn'); if (s) s.hidden = true; }
}
function applyCard(j, concept){
  if (!j || typeof j !== 'object' || !j.oneline) throw {code:'invalid_json'};
  const S = v => (v == null ? '' : String(v));
  state.card = {concept, grade:state.grade, lang:state.lang, oneline:S(j.oneline), box:S(j.box), picture:S(j.picture), layers:(Array.isArray(j.layers) ? j.layers : []).slice(0, 3).map(S), myth:S(j.myth), care:S(j.care), open:S(j.open), close:S(j.close), en:{oneline:S(j.en && j.en.oneline), open:S(j.en && j.en.open), close:S(j.en && j.en.close)}};
  save(); renderPrep();
  const o = $('#prep .out'); if (o) o.scrollIntoView({block:'start', behavior:'smooth'});
}
function showFallback(prompt){
  const box = $('#fallback'); box.textContent = '';
  const pre = el('pre', {text:prompt});
  const cb = el('button', {type:'button', class:'btn small'}, icon('copy'), '複製提示詞');
  cb.addEventListener('click', async () => { try { await navigator.clipboard.writeText(prompt); cb.textContent = '已複製'; } catch(e){ const r = document.createRange(); r.selectNodeContents(pre); const g = getSelection(); g.removeAllRanges(); g.addRange(r); } });
  const ta = el('textarea', {rows:'4', placeholder:'把 AI 回覆的 JSON 貼在這裡', 'aria-label':'貼上 AI 回覆'});
  const st = el('p', {class:'status err'});
  box.append(el('p', {class:'exflag', text:'這個畫面無法直接呼叫 AI。請複製提示詞到 Claude、ChatGPT 或 Gemini，再把回覆貼回下方。'}), pre, cb, ta,
    el('div', {class:'row', style:'margin-top:8px'}, el('button', {type:'button', class:'btn small ghost', text:'套用', onclick:() => { try { const r = ta.value; applyCard(JSON.parse(r.slice(r.indexOf('{'), r.lastIndexOf('}') + 1)), (state.concept || '').trim()); } catch(e){ st.textContent = '讀不到 JSON，請貼上完整的回覆。'; } }})), st);
}

/* ---------- shell ---------- */
const TABS = [['book','book','口條手冊'],['practice','mic','30 秒練習'],['prep','card','備課口條卡']];
function setTab(id){ state.tab = id; stopT(); save(); renderShell(); if (id === 'practice') renderPractice(); showTab(); window.scrollTo(0, 0); }
function renderShell(){
  document.documentElement.dataset.size = state.size;
  $('#sizeLbl').textContent = state.size === 'lg' ? '標準字' : '放大字';
  const tb = $('#tabbar'); tb.textContent = '';
  TABS.forEach(([id, ic, n]) => tb.append(el('button', {type:'button', 'aria-current': state.tab === id ? 'page' : null, onclick:() => setTab(id)}, icon(ic), el('span', {text:n}))));
}
function showTab(){ TABS.forEach(([id]) => { $('#' + id).hidden = state.tab !== id; }); }
function renderAll(){ renderShell(); renderBook(); renderPractice(); renderPrep(); showTab(); }
$('#sizeBtn').addEventListener('click', () => { state.size = state.size === 'lg' ? 'md' : 'lg'; save(); renderShell(); });
if (window.claude && typeof window.claude.use === 'function') window.claude.use('sample').then(s => { sample = s; }).catch(() => {});
if (!TABS.some(t => t[0] === state.tab)) state.tab = 'book';
if (!(state.moment >= 0 && state.moment < M.length)) state.moment = 0;
if (!(state.pm >= 0 && state.pm < M.length)) state.pm = 0;
renderAll();
})();
